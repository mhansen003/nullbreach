function assignRandomAbilities(hand, raceId) {


  hand.forEach(c => { c.ability = null; c.abilityText = 'No special ability'; c.isSpecial = false; });


  const pool = FACTION_ABILITY_POOLS[raceId] || FACTION_ABILITY_POOLS._default;





  // In multiplayer seed from room+faction so both clients assign identical abilities


  const _arng = (() => {


    if (typeof _mpRoom === 'undefined' || !_mpRoom) return () => Math.random();


    let s = 0;


    for (const ch of _mpRoom + raceId) s = (s * 31 + ch.charCodeAt(0)) & 0x7fffffff;


    return seededRand(s);


  })();


  const _fy = arr => {


    const a = [...arr];


    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(_arng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }


    return a;


  };





  const t1Cards    = _fy(hand.filter(c => c.tier === 'I'));


  const higherCards = hand.filter(c => c.tier !== 'I');


  const weighted = [];


  higherCards.forEach(c => {


    const w = {II:2, III:3, IV:5}[c.tier] || 2;


    for (let i = 0; i < w; i++) weighted.push(c);


  });


  const shuffledW = _fy(weighted);





  const chosen = new Set();


  for (const card of shuffledW) {


    if (chosen.size >= 4) break;


    chosen.add(card);


  }


  if (chosen.size < 5 && t1Cards.length > 0) chosen.add(t1Cards[0]);





  chosen.forEach(card => {


    const ab = pool[Math.floor(_arng() * pool.length)];


    card.ability = ab;


    card.abilityText = (typeof ABILITY_TEXT !== 'undefined' && ABILITY_TEXT[ab]) || ab.toUpperCase();


    const _raceNames = RACE_ABILITY_NAMES[raceId] || {};


    card.abilityLabel = _raceNames[ab] || null;


    card.raceId = raceId;


    card.isSpecial = true;


  });


}

    if (_em(_r-1,_c)) _dir.n = _cmp(n,    _ev(_em(_r-1,_c),'s'));


    if (_em(_r+1,_c)) _dir.s = _cmp(s,    _ev(_em(_r+1,_c),'n'));

function shufflePlaylist() {


  playlistOrder = [...PLAYLIST];


  for (let i = playlistOrder.length - 1; i > 0; i--) {

    [playlistOrder[i], playlistOrder[j]] = [playlistOrder[j], playlistOrder[i]];

// Submit player's move to Supabase — retries up to 3 times on failure


async function mpSubmitMove(cardId, r, c, seed, isFlank = false) {


  const move = { player:_mpPlayer, turn:_mpTurnNum, cardId, r, c, seed };


  if (isFlank) move.flank = true;


  for (let attempt = 0; attempt < 3; attempt++) {


    try {


      const res = await fetch(`${_SB_URL}/rest/v1/gz_rooms?id=eq.${_mpRoom}&select=moves`, { headers:_SB_H });


      const data = await res.json();


      const moves = (data[0]?.moves || []);


      // Idempotency: don't double-write if a retry already succeeded


      if (!moves.find(m => m.player === _mpPlayer && m.turn === _mpTurnNum)) {


        moves.push(move);


        const patch = await fetch(`${_SB_URL}/rest/v1/gz_rooms?id=eq.${_mpRoom}`, {


          method:'PATCH', headers:_SB_H,


          body: JSON.stringify({ moves, updated_at: new Date().toISOString() })


        });


        if (!patch.ok) throw new Error('PATCH ' + patch.status);


      }


      _mpTurnNum++;


      return; // success


    } catch(e) {


      console.error(`MP: submit attempt ${attempt+1} failed`, e);


      if (attempt < 2) await new Promise(r => setTimeout(r, 800 * (attempt + 1)));


      else showToast('Move may not have saved — check connection', '#ff4422');


    }


  }


}

// Apply opponent's move (received from Supabase)


function mpApplyMove(move) {


  // P1's opponent is P2 (p2faction param); P2's opponent is P1 (aifaction param)


  const opFaction = _mpPlayer === 1 ? _mpP2Fac : (_mpParams.get('aifaction') || window.aiRaceId);


  let card = mpFindCard(move.cardId, opFaction);


  if (!card) { console.warn('MP: card not found', move.cardId); return; }


  // Find the card in aiHand (it might have been modified by abilities/edgeMod)


  const handCard = G.aiHand.find(c => c.id === move.cardId && !c.used) || {...card, used:false, shieldExpended:false, edgeMod:{n:0,s:0,e:0,w:0}};


  // Use seeded random for AMBUSH/STONEWALL so both clients get same sides


  if (move.seed) window._mpSeed = seededRand(move.seed);


  const isFlank = move.flank === true;


  // Mirror row: opponent's home row (4) = our AI home row (0), battle zone rows invert


  const applyR = 4 - move.r;


  const applyC = move.c;


  // noTurnFlip=true: opponent has an extra FLANK turn, don't give control to this player yet


  animateAiCard(handCard, applyR, applyC, isFlank);


  _mpTurnNum++;


  if (isFlank) {


    // Keep G.turn as 'ai' and poll for opponent's extra-turn card


    setTimeout(() => { if (!G.gameOver) { G.turn = 'ai'; mpStartPolling(); } }, 620);


  } else {


    _mpMyTurn = true;


    // Flash "YOUR TURN" in the wait banner after the animation settles


    setTimeout(() => {


      const _ov = document.getElementById('mpWaitOverlay');


      if (!_ov || G.gameOver) return;


      const _orig = _ov.innerHTML;


      const _origBorder = _ov.style.borderColor;


      _ov.innerHTML = `<div style="font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px;color:#00ffcc;">▶ YOUR TURN</div>`;


      _ov.style.borderColor = '#00ffcc88';


      _ov.style.display = 'flex';


      setTimeout(() => { _ov.style.display = 'none'; _ov.innerHTML = _orig; _ov.style.borderColor = _origBorder; }, 1400);


    }, 620);


  }


}





// Poll Supabase for opponent's move


function mpStartPolling() {


  if (_mpPollInt) clearInterval(_mpPollInt);


  mpShowWaiting(true);


  let _mpPollErrors = 0, _mpLastActivity = Date.now();


  _mpPollInt = setInterval(async () => {


    if (G.gameOver) { clearInterval(_mpPollInt); _mpPollInt = null; return; }


    // Stale warning: 4 minutes with no activity


    if (Date.now() - _mpLastActivity > 240000) {


      addLog('system', '⚠ No opponent activity for 4 min — they may have disconnected');


      _mpLastActivity = Date.now();


    }


    try {


      const res = await fetch(`${_SB_URL}/rest/v1/gz_rooms?id=eq.${_mpRoom}&select=moves,status`, { headers:_SB_H });


      const data = await res.json();


      _mpPollErrors = 0; // reset on successful fetch


      if (!data[0]) return;


      if (data[0].status === 'done') { clearInterval(_mpPollInt); _mpPollInt = null; mpShowWaiting(false); return; }


      const moves = data[0].moves || [];


      if (moves.length > _mpTurnNum) {


        const nextMove = moves[_mpTurnNum];


        // Validate: must be opponent's move AND correct turn index


        if (nextMove.player !== _mpPlayer && nextMove.turn === _mpTurnNum) {


          clearInterval(_mpPollInt); _mpPollInt = null;


          _mpLastActivity = Date.now();


          mpShowWaiting(false);


          setTimeout(() => mpApplyMove(nextMove), 300);


        }


      }


    } catch(e) {


      _mpPollErrors++;


      console.warn(`MP poll error #${_mpPollErrors}`, e);


      if (_mpPollErrors === 5)  showToast('Connection unstable — retrying...', '#ffaa22');


      if (_mpPollErrors >= 15) { // ~30s of failures


        clearInterval(_mpPollInt); _mpPollInt = null;


        addLog('system', 'Lost connection to server. Please refresh to reconnect.');


        showToast('Connection lost — please refresh', '#ff4422');


      }


    }


  }, 2000);


}

      mpStartPolling();

  });


}

let _guidePage = 0;





function guidePage(delta) {


  _guidePage = Math.max(0, Math.min(GUIDE_PAGES.length - 1, _guidePage + delta));


  renderGuide();


}





function renderGuide() {


  const p = GUIDE_PAGES[_guidePage];


  document.getElementById('guideTitle').textContent = p.title;


  document.getElementById('guidePageNum').textContent = `PAGE ${_guidePage+1} OF ${GUIDE_PAGES.length}`;


  document.getElementById('guideContent').innerHTML = p.html;


  document.getElementById('guidePrev').style.opacity = _guidePage === 0 ? '0.3' : '1';


  const nextBtn = document.getElementById('guideNext');


  if (_guidePage === GUIDE_PAGES.length - 1) {


    nextBtn.textContent = 'DONE ✓';


    nextBtn.onclick = closeGuide;


  } else {


    nextBtn.textContent = 'NEXT →';


    nextBtn.onclick = () => guidePage(1);


  }


}





function showGuide() {


  _guidePage = 0;


  renderGuide();


  const m = document.getElementById('guideModal');


  m.style.display = 'flex';


}





function closeGuide() {


  const m = document.getElementById('guideModal');


  m.style.display = 'none';


  if (document.getElementById('guideDontShow')?.checked) {


    localStorage.setItem('gz_guide_seen', '1');


  }


}





// Auto-show on first visit


window.addEventListener('load', () => {


  if (!localStorage.getItem('gz_guide_seen')) {


    setTimeout(showGuide, 800);


  }


});

    <input id="sfxSlider" type="range" min="0" max="100" value="100"


      oninput="setSfxVolume(this.value)"


      style="flex:1;accent-color:#00ffcc;cursor:pointer;">


  </div>


  <button onclick="toggleSfxMute()" id="sfxMuteBtn" style="


    background:transparent;border:1px solid #1a2a2a;color:#888;


    font-family:inherit;font-size:11px;letter-spacing:2px;padding:6px 14px;


    cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;margin-bottom:14px;


  " onmouseenter="this.style.borderColor='#00ffcc55';this.style.color='#00ffcc'"


     onmouseleave="this.style.borderColor='#1a2a2a';this.style.color='#888'">


    🔊 MUTE SFX


  </button>





  <!-- GAME section -->


  <div style="font-size:9px;letter-spacing:2px;color:#555;margin-bottom:8px;padding-top:8px;border-top:1px solid #1a1a28;">GAME</div>


  <div style="display:flex;flex-direction:column;gap:8px;">


    <button onclick="showGuide();closeMenu()" style="


      background:transparent;border:1px solid #ffdd0055;color:#ffdd00;


      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;


      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;


    " onmouseenter="this.style.background='#1a1500';this.style.borderColor='#ffdd00'"


       onmouseleave="this.style.background='transparent';this.style.borderColor='#ffdd0055'">


      ? USER GUIDE


    </button>


    <button onclick="confirmRestart()" style="


      background:transparent;border:1px solid #226644;color:#ffffff;


      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;


      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;


    " onmouseenter="this.style.background='#0e2a1e';this.style.borderColor='#00ffcc'"


       onmouseleave="this.style.background='transparent';this.style.borderColor='#226644'">


      ↺ RESTART GAME


    </button>


    <button onclick="confirmDeckNav()" style="


      background:transparent;border:1px solid #443355;color:#aa88cc;


      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;


      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;


    " onmouseenter="this.style.background='#1a0a2e';this.style.borderColor='#8855ff'"


       onmouseleave="this.style.background='transparent';this.style.borderColor='#443355'">


      ← BACK TO DECK SELECT


    </button>


  </div>


</div>





<!-- Menu backdrop — body level, just below the menu -->


<div id="menuBackdrop" onclick="closeMenu()" style="


  display:none;position:fixed;inset:0;z-index:99999;background:#00000066;


"></div>





<!-- TOOLTIP — shiny, tier-colored -->


<div id="tooltip" class="tooltip"></div>


<!-- ERROR TOOLTIP — red, invalid placement -->


<div id="errorTip" class="tip-error"></div>





</body>


</html>
