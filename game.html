<script>

let G = {};   // game state shorthand

// ── START ─────────────────────────────────────

// Set active deck from URL param BEFORE initGame reads it
(function() {
  const raceId = new URLSearchParams(window.location.search).get('race') || 'terran';
  window.__activeDeck = {
    terran: PLAYER_CARDS, brood: BROOD_CARDS,
    crystallis: CRYSTALLIS_CARDS, mycos: MYCOS_CARDS, veil: VEIL_CARDS,
    entropy: ENTROPY_CARDS, void: VOID_CARDS, gas: GAS_CARDS,
    lithos: LITHOS_CARDS, quantum: QUANTUM_CARDS, choir: CHOIR_CARDS
  }[raceId] || PLAYER_CARDS;
})();

loadAudioSettings(); // restore vol/mute prefs before game starts
initRaceTheme();
initGame();
logGameEvent('game_start', {
  player_faction: window.playerRaceId,
  ai_faction:     window.aiRaceId,
  difficulty:     window.aiDifficulty || 'balanced',
  mode:           (typeof _mpRoom !== 'undefined' && _mpRoom) ? 'pvp' : 'pve'
});
// Force music start on first user interaction regardless of prior mute state in localStorage
// (user arriving at game.html is a fresh session — music should play unless they mute in THIS session)
if (localStorage.getItem('gz_musicMuted') === '1') {
  localStorage.removeItem('gz_musicMuted');
  if (typeof musicMuted !== 'undefined') musicMuted = false;
  const _mb = document.getElementById('musicMuteBtn'); if (_mb) _mb.textContent = '🔊';
}
document.addEventListener('click', function _forceMusicStart() {
  if (!musicStarted && !musicMuted) startGameMusic();
  document.removeEventListener('click', _forceMusicStart, true);
}, { once: true, capture: true });

</script>

    </div>

    <button onclick="showGuide();closeMenu()" style="
      background:transparent;border:1px solid #ffffff14;color:#ccc;
      font-family:'Orbitron',system-ui,sans-serif;font-size:10px;letter-spacing:2px;padding:9px 12px;
      cursor:pointer;border-radius:5px;text-align:left;width:100%;transition:all 0.15s;
    " onmouseenter="this.style.background='#ffffff0a';this.style.color='#fff';this.style.borderColor='#ffffff33'"
       onmouseleave="this.style.background='transparent';this.style.color='#ccc';this.style.borderColor='#ffffff14'">
      USER GUIDE
    </button>

    <button onclick="showLeaderboard();closeMenu()" style="
      background:transparent;border:1px solid #ffffff14;color:#ccc;
      font-family:'Orbitron',system-ui,sans-serif;font-size:10px;letter-spacing:2px;padding:9px 12px;
      cursor:pointer;border-radius:5px;text-align:left;width:100%;transition:all 0.15s;
    " onmouseenter="this.style.background='#ffffff0a';this.style.color='#fff';this.style.borderColor='#ffffff33'"
       onmouseleave="this.style.background='transparent';this.style.color='#ccc';this.style.borderColor='#ffffff14'">
      LEADERBOARD
    </button>

    <button onclick="confirmRestart()" style="
      background:transparent;border:1px solid #ffffff14;color:#ccc;
      font-family:'Orbitron',system-ui,sans-serif;font-size:10px;letter-spacing:2px;padding:9px 12px;
      cursor:pointer;border-radius:5px;text-align:left;width:100%;transition:all 0.15s;
    " onmouseenter="this.style.background='#ffffff0a';this.style.color='#fff';this.style.borderColor='#ffffff33'"
       onmouseleave="this.style.background='transparent';this.style.color='#ccc';this.style.borderColor='#ffffff14'">
      RESTART GAME
    </button>

    <button id="forfeitBtn" onclick="forfeitGame();closeMenu()" style="
      display:none;background:transparent;border:1px solid #ff333322;color:#ff4444;
      font-family:'Orbitron',system-ui,sans-serif;font-size:10px;letter-spacing:2px;padding:9px 12px;
      cursor:pointer;border-radius:5px;text-align:left;width:100%;transition:all 0.15s;margin-bottom:0;
    " onmouseenter="this.style.background='#ff33330a';this.style.color='#ff6666';this.style.borderColor='#ff333344'"
       onmouseleave="this.style.background='transparent';this.style.color='#ff4444';this.style.borderColor='#ff333322'">
      FORFEIT GAME
    </button>

    <button onclick="confirmDeckNav()" style="
      background:transparent;border:1px solid #ffdd0033;color:#ffdd00;
      font-family:'Orbitron',system-ui,sans-serif;font-size:10px;letter-spacing:2px;padding:9px 12px;
      cursor:pointer;border-radius:5px;text-align:left;width:100%;transition:all 0.15s;
    " onmouseenter="this.style.background='#ffdd0012';this.style.color='#ffe844';this.style.borderColor='#ffdd0066'"
       onmouseleave="this.style.background='transparent';this.style.color='#ffdd00';this.style.borderColor='#ffdd0033'">
      BACK TO DECK SELECT
    </button>

  </div>
</div>

<!-- Menu backdrop: body level, just below the menu -->

<div id="menuBackdrop" onclick="closeMenu()" style="

  display:none;position:fixed;inset:0;z-index:99999;background:#00000066;

"></div>

<!-- TOOLTIP: shiny, tier-colored -->

<div id="tooltip" class="tooltip"></div>

<!-- ERROR TOOLTIP: red, invalid placement -->

<div id="errorTip" class="tip-error"></div>

</body>

</html>
