<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GALACTIC ZERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #080810;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* Lore backgrounds — contained to AI bar and player hand bar only */
.ai-area, .player-area {
  background-size: cover;
  background-position: center;
  position: relative;
  transition: background-image 0.8s ease;
}
/* Dark overlay on the UI areas so content stays readable */
.ai-area::before, .player-area::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
}
.ai-area::before {
  background: linear-gradient(to bottom, #020208cc 0%, #020208aa 100%);
}
.player-area::before {
  background: linear-gradient(to top, #020208cc 0%, #020208aa 100%);
}
/* Ensure all children sit above the overlay */
.ai-area > *, .player-area > * { position: relative; z-index: 1; }


/* Board card art overlay — gradient keeps edge values readable */
.cell.player::after, .cell.ai::after {
  content: ''; position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(to top, #000000cc 0%, #00000077 38%, transparent 70%);
  pointer-events: none;
}
.cell.player .edge, .cell.ai .edge,
.cell.player .tier-badge, .cell.ai .tier-badge,
.cell.player .cell-center, .cell.ai .cell-center,
.cell.player .ability-tag, .cell.ai .ability-tag {
  position: relative; z-index: 1;
}

/* Ensure layout areas sit above fixed lore backgrounds */
.header, .ai-area, .main-area, .player-area {
  position: relative; z-index: 10;
}

/* HEADER */
.header {
  background: linear-gradient(90deg, #0a0a1a, #160a28);
  border-bottom: 1px solid #00ffcc44;
  padding: 6px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.title { font-family:'Orbitron',monospace; color: #fff; font-size: 15px; letter-spacing: 5px; text-shadow: 0 0 16px #8855ffaa, 0 2px 4px #000; }
.score-bar { display: flex; gap: 14px; align-items: center; }
.score-p { color: #00ffcc; font-size: 15px; font-weight: bold; text-shadow: 0 0 8px #00ffcc; }
.score-a { color: #ff0080; font-size: 15px; font-weight: bold; text-shadow: 0 0 8px #ff0080; }
.score-lbl { font-size: 9px; color: #444; letter-spacing: 2px; }
.turn-tag { font-size: 10px; letter-spacing: 2px; padding: 3px 10px; border-radius: 3px; }
.turn-tag.player { color: #00ffcc; border: 1px solid #00ffcc44; }
.turn-tag.ai     { color: #ff0080; border: 1px solid #ff008044; }

/* AI TOP BAR */
.ai-area {
  display: flex; align-items: center; gap: 14px;
  padding: 7px 20px 4px;
  flex-shrink: 0;
  border-bottom: 1px solid #111120;
}
.ai-portrait {
  display: flex; align-items: center; gap: 10px;
  background: #0e0e1e; border: 1px solid #ff008033;
  border-radius: 5px; padding: 6px 12px; min-width: 185px;
}
.ai-avatar {
  width: 96px; height: 96px; flex-shrink: 0;
  background: linear-gradient(135deg, #2a0d0d, #180a18);
  border: 1px solid #ff008066; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; font-size: 36px;
  overflow: hidden;
}
.ai-name  { color: #ff0080; font-size: 11px; letter-spacing: 2px; }
.ai-sub   { color: #444; font-size: 8px; letter-spacing: 1px; margin-top: 2px; }
.ai-quote { color: #333; font-size: 8px; font-style: italic; margin-top: 3px; }
.ai-hand-row { display: flex; gap: 6px; align-items: center; }
.hand-lbl-v { font-size: 8px; color: #333; letter-spacing: 2px; writing-mode: vertical-lr; transform: rotate(180deg); }
.facedown {
  width: 50px; height: 66px; border-radius: 3px;
  background: repeating-linear-gradient(45deg,#110820,#110820 4px,#160a28 4px,#160a28 8px);
  border: 1px solid #ff008022;
  display: flex; align-items: center; justify-content: center;
  color: #ff008033; font-size: 18px; transition: opacity 0.3s;
}
.facedown.used { opacity: 0.18; }

/* MAIN AREA */
.main-area { flex: 1; display: flex; overflow: hidden; }

/* BOARD WRAP */
.board-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px;
  overflow: hidden;
}
.board-dir-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  width: 100%; max-width: 730px; justify-content: space-between;
  padding: 0 88px 0 0;
}
.dir-lbl { font-size: 9px; letter-spacing: 2px; }

/* Board + row scores side by side */
.board-and-scores {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

/* Column scores below grid */
.col-score-row {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}
.col-score-badge {
  width: 108px; height: 54px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; position: relative;
  transition: border-color 0.3s;
}
.col-score-badge.none   { background:#07070f; border:1px solid #111120; }
.col-score-badge.p-win  { background:#00ffcc08; border:1px solid #00ffcc44; }
.col-score-badge.a-win  { background:#ff008008; border:1px solid #ff008044; }
.col-score-badge.tie    { background:#0d0c18; border:1px solid #221a33; }

/* Row scores column */
.row-scores {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.row-score-badge {
  width: 90px; height: 144px;
  border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; overflow: hidden; position: relative;
  transition: border-color 0.3s;
}
.row-score-badge.none  { background:#07070f; border:1px solid #111120; }
.row-score-badge.p-win { background:#00ffcc08; border:1px solid #00ffcc44; }
.row-score-badge.a-win { background:#ff008008; border:1px solid #ff008044; }
.row-score-badge.tie   { background:#0d0c18; border:1px solid #221a33; }
/* avatar circles on badges */
.sbav { width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid transparent; }
.sbav.win  { filter:none;   opacity:1;   }
.sbav.lose { filter:grayscale(1); opacity:0.25; }
.sbav.none { filter:grayscale(1); opacity:0.15; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(7, 108px);
  grid-template-rows: repeat(5, 144px);
  gap: 6px;
  position: relative;
  flex-shrink: 0;
}

/* CELLS — 3:4 portrait ratio (108×144) matching hand card proportions */
.cell {
  width: 108px; height: 144px;
  border-radius: 5px;
  position: relative;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: all 0.15s;
}
.cell.empty { background: #0b0b17; border: 1px dashed #1a1a2e; }
.cell.valid { background: #0e1a10; border: 2px dashed #00ffcc55; cursor: pointer; }
.cell.valid:hover { background: #0e2214; border-color: #00ffcc; box-shadow: 0 0 16px #00ffcc22; }
/* Yellow zone preview overrides green valid cells — zone is more important */
.cell.future-valid { border: 2px solid #ffdd00 !important; background: #ffdd0018 !important; box-shadow: 0 0 12px #ffdd0044 !important; }
.cell.player { background: linear-gradient(145deg, #0a1c16, #08151e); border: 2px solid #00ffcc; box-shadow: 0 0 8px #00ffcc22; }
.cell.ai     { background: linear-gradient(145deg, #1c0a0a, #150818); border: 2px solid #ff0080; box-shadow: 0 0 8px #ff008022; }
.cell.just-placed { animation: placePulse 0.35s ease; }
@keyframes placePulse { 0%{transform:scale(0.8);opacity:0.4} 100%{transform:scale(1);opacity:1} }

/* Card face -- all elements absolutely positioned, zero overlap */
.edge { position: absolute; font-size: 16px; font-weight: bold; line-height: 1; z-index: 2;
        text-shadow: 0 0 6px #000, 0 1px 3px #000; }
.edge.n { top: 6px;    left: 50%; transform: translateX(-50%); }
.edge.s { bottom: 6px; left: 50%; transform: translateX(-50%); }
.edge.w { left: 6px;   top: 50%;  transform: translateY(-50%); }
.edge.e { right: 6px;  top: 50%;  transform: translateY(-50%); }

/* Power in absolute center, name removed from board cards */
.cell-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; z-index: 2;
}
.cell-power  { font-size: 24px; font-weight: bold; line-height: 1;
               text-shadow: 0 0 8px #000, 0 2px 4px #000; }
.cell-name   { display: none; } /* name shown in tooltip only — too small on board */
.tier-badge  { position: absolute; top: 5px; right: 6px; font-size: 9px; font-weight: bold; opacity: 0.45; z-index: 2; }
.ability-tag { position: absolute; bottom: 5px; left: 6px; font-size: 7px; letter-spacing: 1px; opacity: 0.6; white-space: nowrap; z-index: 2; }
/* Tier dot indicators — replace border color as tier signal */
.tier-dots { position: absolute; top: 6px; left: 6px; display: flex; gap: 3px; z-index: 2; }
.tier-dot  { width: 7px; height: 7px; border-radius: 50%; display: inline-block; box-shadow: 0 0 4px currentColor; }

/* HAND CARD -- card art as background, overlay shows stats */
.hand-card {
  width: 106px; height: 140px; border-radius: 6px; position: relative;
  cursor: pointer; flex-shrink: 0; overflow: hidden;
  /* DO NOT use background shorthand here — it wipes backgroundImage set by JS */
  background-color: #06050e;
  background-size: cover;
  background-position: center top;
  border: 1px solid #555;
  transition: transform 0.15s, box-shadow 0.15s;
}
/* Subtle dark overlay for readability, over the art */
.hand-card::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(to top, #000000cc 0%, #00000066 50%, transparent 100%);
}
/* All stat text floats above the overlay */
.hand-card .hc-e-n, .hand-card .hc-e-s, .hand-card .hc-e-w, .hand-card .hc-e-e,
.hand-card .hc-center, .hand-card .hc-tier-badge, .hand-card .hc-ability-tag {
  position: absolute; z-index: 2;
}
.hand-card:hover  { transform: translateY(-8px); }
.hand-card.selected { transform: translateY(-14px); }
.hand-card.used   { opacity: 0.18; cursor: default; pointer-events: none; }
.hand-card.tier-blocked { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.8); pointer-events: none; }

/* Hand card edge labels in cardinal positions */
.hc-e-n { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; }
.hc-e-s { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; }
.hc-e-w { position: absolute; left: 5px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; }
.hc-e-e { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; }

/* Hand card center block */
.hc-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.hc-power-center { font-size: 20px; font-weight: bold; line-height: 1; color: #00ffcc; }
.hc-name-small   { font-size: 7px; letter-spacing: 1px; opacity: 0.55; color: #00ffcc; }

/* Hand card badges */
.hc-tier-badge   { position: absolute; top: 3px; right: 5px; font-size: 9px; font-weight: bold; opacity: 0.4; color: #00ffcc; }
.hc-ability-tag  { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 7px; letter-spacing: 1px; opacity: 0.55; color: #00ffcc; white-space: nowrap; }

/* BATTLE INDICATOR in gap between adjacent enemy cards */
.bti {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; border-radius: 2px;
  text-shadow: 0 0 6px currentColor;
}

/* FLASH popup on comparison */
.flash {
  position: absolute;
  z-index: 20; pointer-events: none;
  font-size: 10px; letter-spacing: 1px; padding: 3px 8px;
  border-radius: 3px; font-weight: bold;
  animation: flashFade 1.8s ease forwards;
}
@keyframes flashFade {
  0%   { opacity:1; transform:translateY(0) scale(1); }
  60%  { opacity:1; transform:translateY(-10px) scale(1.05); }
  100% { opacity:0; transform:translateY(-20px) scale(0.9); }
}

/* LOG — hidden, board takes full width */
.log-panel {
  display: none !important;
}
.log-title { font-size: 9px; color: #444; letter-spacing: 2px; margin-bottom: 8px; }
.log-entries { flex:1; overflow:hidden; display:flex; flex-direction:column-reverse; gap:4px; }
.log-entry { font-size: 9px; color:#555; letter-spacing:0.5px; line-height:1.4; padding:3px 5px; border-left:2px solid #1a1a2e; }
.log-entry.system  { color:#666; border-left-color:#333; }
.log-entry.player  { color:#00ffcc99; border-left-color:#00ffcc44; }
.log-entry.ai      { color:#ff008099; border-left-color:#ff008044; }
.log-entry.compare { color:#aaa; border-left-color:#333; }
.log-entry.shield  { color:#aaaaff99; border-left-color:#aaaaff44; }

/* PLAYER AREA */
.player-area {
  background: #090912; border-top: 1px solid #131320;
  padding: 8px 20px;
  display: flex; align-items: flex-end; gap: 12px; flex-shrink: 0;
}
.player-portrait {
  display: flex; align-items: center; gap: 10px;
  background: #0e0e1e; border: 1px solid #00ffcc22;
  border-radius: 5px; padding: 6px 12px; min-width: 165px; align-self: center;
}
.player-avatar {
  width: 80px; height: 80px; flex-shrink: 0;
  background: linear-gradient(135deg, #0d2a1a, #0a1820);
  border: 1px solid #00ffcc44; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; font-size: 32px;
  overflow: hidden;
}
.player-name  { color: #00ffcc; font-size: 10px; letter-spacing: 2px; }
.player-sub   { color: #444; font-size: 8px; letter-spacing: 1px; margin-top: 2px; }
.hand-cards { display: flex; gap: 8px; align-items: flex-end; }

/* DRAG CARD -- follows cursor */
#dragCard {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  width: 100px;
  height: 130px;
  border-radius: 5px;
  background: linear-gradient(145deg, #0c2e1e, #092028);
  border: 2px solid #00ffcc;
  box-shadow: 0 0 20px #00ffcc66, 0 0 40px #00ffcc22;
  display: none;
}
/* Drag card edge labels */
.dc-e-n { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }
.dc-e-s { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }
.dc-e-w { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }
.dc-e-e { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }
.dc-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.dc-power { font-size: 22px; font-weight: bold; line-height: 1; color: #00ffcc; }
.dc-name  { font-size: 7px; letter-spacing: 1px; opacity: 0.6; color: #00ffcc; }
.dc-tier  { position: absolute; top: 4px; right: 6px; font-size: 9px; font-weight: bold; opacity: 0.4; color: #00ffcc; }

/* WIN OVERLAY */
.overlay { display:none; position:fixed; inset:0; background:#000000cc;
  align-items:center; justify-content:center; flex-direction:column; gap:20px; z-index:100; }
.overlay.show { display:flex; }
.overlay-title { font-size:36px; letter-spacing:6px; font-weight:bold; }
.overlay-title.win  { color:#00ffcc; text-shadow:0 0 30px #00ffcc; }
.overlay-title.lose { color:#ff0080; text-shadow:0 0 30px #ff0080; }
.overlay-title.draw { color:#888; }
.overlay-sub  { color:#888; font-size:13px; letter-spacing:3px; }
.overlay-breakdown { display:flex; gap:30px; margin-top:8px; }
.ob-col { text-align:center; }
.ob-label { font-size:9px; color:#444; letter-spacing:2px; margin-bottom:4px; }
.ob-val   { font-size:22px; font-weight:bold; }
.btn-restart {
  background:#0e1e16; border:1px solid #00ffcc; color:#00ffcc;
  padding:10px 30px; font-family:inherit; font-size:11px; letter-spacing:3px;
  cursor:pointer; border-radius:3px; margin-top:10px; transition:background 0.2s;
}
.btn-restart:hover { background:#1a3a26; }

/* TOOLTIP — shiny, tier-color-driven */
@keyframes tipGlow {
  0%,100% { box-shadow: 0 0 0 1px var(--tc-dim,#8855ff33), 0 24px 64px #000000cc, 0 0 22px var(--tc-glow,#8855ff18); }
  50%     { box-shadow: 0 0 0 2px var(--tc-dim,#8855ff44), 0 24px 64px #000000cc, 0 0 52px var(--tc-glow,#8855ff28); }
}
@keyframes tipScan {
  0%   { transform: translateY(-110%); }
  100% { transform: translateY(350%); }
}
@keyframes tipShineSwipe {
  0%   { transform: translateX(-200%) skewX(-18deg); opacity:0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateX(400%) skewX(-18deg); opacity:0; }
}
.tooltip {
  --tc: #8855ff; --tc-dim: #8855ff33; --tc-glow: #8855ff18;
  display:none; position:fixed;
  background: linear-gradient(148deg, #0e0c24 0%, #07070f 55%, #0b0916 100%);
  border: 1px solid var(--tc);
  border-radius:10px; padding:0;
  font-size:13px; color:#e0e0e0; letter-spacing:0.4px; line-height:1.5;
  z-index:9500; pointer-events:none; width:310px;
  animation: tipGlow 2.5s ease-in-out infinite;
  overflow:hidden;
}
.tip-shine-layer {
  position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:10px; z-index:2;
}
.tip-shine-layer::before {
  content:''; position:absolute; top:0; left:0; width:50px; height:200%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);
  animation: tipShineSwipe 4s ease-in-out infinite 1s;
}
.tip-body { position:relative; z-index:3; }
@keyframes errGlow {
  0%,100% { box-shadow: 0 0 0 1px #ff333322, 0 16px 40px #000000cc, 0 0 18px #ff333318; }
  50%     { box-shadow: 0 0 0 2px #ff333344, 0 16px 40px #000000cc, 0 0 36px #ff333328; }
}
.tip-error {
  display:none; position:fixed;
  background: linear-gradient(148deg, #1c0808 0%, #0d0505 60%);
  border:1px solid #ff333366;
  border-radius:10px; padding:0;
  z-index:9500; pointer-events:none; min-width:180px; max-width:240px;
  animation: errGlow 2.5s ease-in-out infinite;
  overflow:hidden; font-family:'Courier New',monospace;
}

/* Tier indicator dots — upper-left of each empty cell, always visible */
.tri-dots {
  position: absolute; top: 7px; left: 7px;
  display: flex; align-items: center; gap: 3px; pointer-events: none;
}
.tri-d {
  width: 6px; height: 6px; border-radius: 50%; transition: background 0.2s;
}
.tri-d.white { background: #ffffff55; }
.tri-d.green { background: #44cc6655; }
.tri-plus    { font-size: 9px; color: #44cc6655; line-height: 1; transition: color 0.2s; font-weight:bold; }
/* brighten when this cell is a valid drop target */
.cell.valid .tri-d.white { background: #ffffffcc; }
.cell.valid .tri-d.green { background: #44cc66cc; }
.cell.valid .tri-plus    { color: #44cc66cc; }

/* ══════════════════════════════════════
   MOBILE / TABLET RESPONSIVE
══════════════════════════════════════ */

/* Touch & iOS baseline */
html { -webkit-text-size-adjust: 100%; }
button, [onclick] { touch-action: manipulation; }

/* ── TABLET (600px – 900px) ── */
@media (max-width: 900px) {

  /* Grid cells */
  .grid {
    grid-template-columns: repeat(7, 72px);
    grid-template-rows:    repeat(5, 96px);
    gap: 4px;
  }
  .cell { width: 72px; height: 96px; }

  /* Cell edge values */
  .edge { font-size: 13px; }
  .edge.n { top: 4px; }
  .edge.s { bottom: 4px; }
  .edge.w { left: 4px; }
  .edge.e { right: 4px; }

  /* Cell power */
  .cell-power { font-size: 18px; }

  /* Tier dots: slightly smaller */
  .tier-dot { width: 6px; height: 6px; }

  /* Row score badge: match reduced cell height */
  .row-score-badge { width: 72px; height: 96px; }

  /* Column score badge: match reduced cell width */
  .col-score-badge { width: 72px; height: 40px; }

  /* Hand cards */
  .hand-card { width: 80px; height: 106px; }
  .hc-e-n, .hc-e-s, .hc-e-w, .hc-e-e { font-size: 12px; }
  .hc-power-center { font-size: 16px; }
  .hc-tier-badge   { font-size: 8px; }

  /* AI facedown */
  .facedown { width: 42px; height: 56px; font-size: 14px; }

  /* AI avatar */
  .ai-avatar { width: 72px; height: 72px; font-size: 28px; }

  /* Header font */
  .title { font-size: 12px; letter-spacing: 3px; }

  /* AI area gap tighten */
  .ai-area { gap: 10px; padding: 6px 14px 4px; }
  .ai-portrait { padding: 5px 8px; min-width: 140px; }

  /* Player area */
  .player-area { padding: 6px 14px; gap: 8px; }
  .player-portrait { padding: 5px 8px; min-width: 130px; }
  .player-avatar { width: 60px; height: 60px; font-size: 24px; }

  /* Board direction row */
  .board-dir-row { max-width: none; padding: 0 64px 0 0; }
  .dir-lbl { font-size: 8px; }
}

/* ── MOBILE (< 600px) ── */
@media (max-width: 599px) {

  body { overflow-y: auto; height: auto; }

  /* Grid cells — tight fit for 7-column layout */
  .grid {
    grid-template-columns: repeat(7, 52px);
    grid-template-rows:    repeat(5, 70px);
    gap: 3px;
  }
  .cell { width: 52px; height: 70px; border-radius: 3px; }

  /* Cell edges */
  .edge { font-size: 10px; }
  .edge.n { top: 2px; }
  .edge.s { bottom: 2px; }
  .edge.w { left: 2px; }
  .edge.e { right: 2px; }

  /* Cell power center */
  .cell-power { font-size: 14px; }

  /* Tier badge + ability tag on cells */
  .tier-badge  { font-size: 7px; top: 3px; right: 3px; }
  .ability-tag { font-size: 6px; bottom: 3px; left: 3px; }
  .tier-dot    { width: 5px; height: 5px; }
  .tier-dots   { gap: 2px; top: 4px; left: 4px; }

  /* Hide board direction row */
  .board-dir-row { display: none; }

  /* Row scores: match small cell height */
  .row-score-badge { width: 52px; height: 70px; gap: 3px; }
  .rsb-pts  { font-size: 11px; }
  .rsb-who  { font-size: 7px; }
  .rsb-divider { width: 44px; }
  .rsb-line    { width: 44px; }
  .rsb-winner-tag { font-size: 6px; padding: 1px 4px; }

  /* Col scores: match small cell width */
  .col-score-badge { width: 52px; height: 34px; font-size: 7px; }
  .csb-row { gap: 3px; font-size: 7px; }
  .csb-winner { font-size: 7px; }

  /* Hand cards */
  .hand-card { width: 60px; height: 80px; border-radius: 4px; }
  .hc-e-n, .hc-e-s, .hc-e-w, .hc-e-e { font-size: 10px; }
  .hc-e-n { top: 2px; }
  .hc-e-s { bottom: 2px; }
  .hc-e-w { left: 3px; }
  .hc-e-e { right: 3px; }
  .hc-power-center { font-size: 13px; }
  .hc-name-small   { font-size: 6px; }
  .hc-tier-badge   { font-size: 7px; top: 2px; right: 3px; }
  .hc-ability-tag  { font-size: 6px; bottom: 2px; }

  /* Hand card hover: smaller lift on mobile */
  .hand-card:hover    { transform: translateY(-5px); }
  .hand-card.selected { transform: translateY(-9px); }

  /* AI facedown cards */
  .facedown { width: 32px; height: 42px; font-size: 13px; border-radius: 2px; }

  /* AI area */
  .ai-area { gap: 8px; padding: 5px 10px 3px; flex-wrap: wrap; }
  .ai-portrait {
    padding: 4px 8px; min-width: unset;
    flex-shrink: 0;
  }
  .ai-avatar {
    width: 48px; height: 48px; font-size: 20px;
    border-radius: 3px;
  }
  .ai-name  { font-size: 9px; letter-spacing: 1px; }
  .ai-sub   { font-size: 7px; }
  .ai-quote { font-size: 7px; }
  .hand-lbl-v { font-size: 7px; }
  .ai-hand-row { gap: 3px; flex-wrap: wrap; }

  /* Player area */
  .player-area { padding: 5px 10px; gap: 6px; flex-wrap: wrap; }
  .player-portrait { padding: 4px 8px; min-width: unset; flex-shrink: 0; }
  .player-avatar { width: 48px; height: 48px; font-size: 20px; }
  .player-name { font-size: 9px; letter-spacing: 1px; }
  .player-sub  { font-size: 7px; }
  .hand-cards  { gap: 5px; flex-wrap: wrap; }

  /* Header */
  .title { font-size: 11px; letter-spacing: 2px; }
  .turn-tag { font-size: 8px; letter-spacing: 1px; padding: 2px 7px; }
  .header { padding: 4px 10px; }

  /* Score HUD — compact on mobile */
  #scoreHud {
    bottom: 8px !important; right: 8px !important;
    padding: 6px 10px !important;
    min-width: 130px !important;
  }
  #hudPlayerScore, #hudAiScore { font-size: 14px !important; }
  #hudPlayerName,  #hudAiName  { font-size: 8px !important; }
  #hudWinner { font-size: 7px !important; }

  /* Volume + mute controls — tuck closer to hud */
  #scoreHud + div {
    right: 148px !important;
    bottom: 10px !important;
  }

  /* Board wrap: reduce padding so board fits */
  .board-wrap { padding: 4px 4px; }

  /* Drag card — smaller on mobile */
  #dragCard { width: 70px; height: 90px; }
  .dc-e-n, .dc-e-s, .dc-e-w, .dc-e-e { font-size: 11px; }
  .dc-power { font-size: 15px; }
  .dc-name  { font-size: 6px; }
  .dc-tier  { font-size: 7px; }

  /* Win overlay */
  .overlay-title { font-size: 24px; letter-spacing: 3px; }
  .overlay-sub   { font-size: 11px; }
  .ob-val        { font-size: 18px; }

  /* Tooltip: don't let it overflow on narrow screens */
  .tooltip { max-width: min(260px, 90vw); font-size: 11px; }

  /* Game menu */
  #gameMenu { min-width: 180px !important; }
}

/* ── LANDSCAPE MOBILE (short viewport, wide) ── */
@media (max-height: 500px) and (max-width: 900px) {
  .ai-area    { padding: 3px 10px 2px; }
  .player-area { padding: 3px 10px; }
  .ai-avatar  { width: 40px; height: 40px; }
  .player-avatar { width: 40px; height: 40px; }

}

<script>
// ── RACE LOOKUP (for lore backgrounds + portraits) ────────────────
const RACE_DATA = {
  terran:     { name:'THE TERRAN ACCORD',      sub:'UNITED COLONIAL FEDERATION',     color:'#7ab8e8', avatar:'★',  avatarImg:'assets/avatars/terran.png',    quote:'"We are many worlds, one purpose."',            loreBg:'assets/lore_terran.png'     },
  crystallis: { name:'THE CRYSTALLIS',          sub:'SILICON LATTICE CIVILIZATION',   color:'#a8d8ff', avatar:'💎', avatarImg:'assets/avatars/crystallis.png', quote:'"You will fracture against us."',                loreBg:'assets/lore_crystallis.png' },
  mycos:      { name:'THE MYCOS DRIFT',         sub:'DISTRIBUTED FUNGAL INTELLIGENCE',color:'#9dcf6e', avatar:'🍄', avatarImg:'assets/avatars/mycos.png',      quote:'"We have already begun."',                      loreBg:'assets/lore_mycos.png'      },
  veil:       { name:'THE VEIL',                sub:'COHERENT LIGHT ENTITIES',        color:'#fff5a0', avatar:'✦',  avatarImg:'assets/avatars/veil.png',       quote:'"You cannot strike what you cannot see."',       loreBg:'assets/lore_veil.png'       },
  entropy:    { name:'THE ENTROPY CULT',        sub:'ANCIENT DECAY WORSHIPPERS',      color:'#c4723a', avatar:'☄',  avatarImg:'assets/avatars/entropy.png',    quote:'"Everything ends. We simply hasten it."',        loreBg:'assets/lore_entropy.png'    },
  brood:      { name:'THE BROOD SOVEREIGN',     sub:'INSECTOID HIVE-MIND',            color:'#88cc44', avatar:'🪲', avatarImg:'assets/avatars/brood.png',      quote:'"The Sovereign sees through ten thousand eyes."', loreBg:'assets/lore_brood.png'      },
  void:       { name:'THE VOID HUNTERS',        sub:'DARK MATTER PREDATORS',          color:'#9b59b6', avatar:'▪',  avatarImg:'assets/avatars/void.png',       quote:'"We come from the dark between stars."',         loreBg:'assets/lore_void.png'       },
  gas:        { name:'THE GAS NOMADS',          sub:'PLASMA STORM BEINGS',            color:'#ffd700', avatar:'⚡', avatarImg:'assets/avatars/gas.png',        quote:'"You have angered the storm."',                  loreBg:'assets/lore_gas.png'        },
  lithos:     { name:'THE LITHOS',              sub:'GEOLOGICAL ANCIENTS',            color:'#a0896a', avatar:'⬡',  avatarImg:'assets/avatars/lithos.png',     quote:'"We were here before your stars ignited."',      loreBg:'assets/lore_lithos.png'     },
  quantum:    { name:'THE QUANTUM THREAD',      sub:'SUPERPOSITION ENTITIES',         color:'#ff69b4', avatar:'◈',  avatarImg:'assets/avatars/quantum.png',    quote:'"We are all possibilities at once."',            loreBg:'assets/lore_quantum.png'    },
  choir:      { name:'THE CHOIR',               sub:'RESONANT FREQUENCY ENTITIES',    color:'#c8c8ff', avatar:'〜', avatarImg:'assets/avatars/choir.png',      quote:'"The note that breaks everything."',             loreBg:'assets/lore_choir.png'      },
};

function initRaceTheme() {
  const params   = new URLSearchParams(window.location.search);
  const raceId   = params.get('race') || 'terran';
  const allRaces = Object.keys(RACE_DATA);
  // Persist AI race across refreshes — only randomize on first visit or change deck
  let aiRaceId = sessionStorage.getItem('gz_ai_race');
  if (!aiRaceId || aiRaceId === raceId) {
    aiRaceId = allRaces.filter(r => r !== raceId)[Math.floor(Math.random() * (allRaces.length - 1))];
    sessionStorage.setItem('gz_ai_race', aiRaceId);
  }

  const player = RACE_DATA[raceId]   || RACE_DATA.terran;
  const ai     = RACE_DATA[aiRaceId] || RACE_DATA.entropy;

  // Apply lore backgrounds to fixed full-screen top/bottom divs
  const topBg = document.getElementById('game-top-bg');
  const botBg = document.getElementById('game-bottom-bg');
  if (topBg) { topBg.style.backgroundImage = `url('${ai.loreBg}')`; topBg.style.opacity = '0.75'; }
  if (botBg) { botBg.style.backgroundImage = `url('${player.loreBg}')`; botBg.style.opacity = '0.75'; }
  // Remove background from ai-area and player-area
  const aiBar = document.querySelector('.ai-area');
  const playerBar = document.querySelector('.player-area');
  if (aiBar) aiBar.style.backgroundImage = '';
  if (playerBar) playerBar.style.backgroundImage = '';

  // Panels removed — portraits live in ai-area/player-area headers

  // Update player color throughout
  const pColor = player.color;
  document.documentElement.style.setProperty('--player-color', pColor);

  // Update player portrait — avatar image + labels
  const pAvEl = document.querySelector('.player-avatar');
  if (pAvEl) {
    pAvEl.innerHTML = player.avatarImg
      ? `<img src="${player.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`
      : player.avatar;
    pAvEl.style.borderColor = player.color + '88';
  }
  const pNameEl = document.querySelector('.player-name');
  const pTitleEl = document.querySelector('.player-sub');
  if (pNameEl)  { pNameEl.textContent = player.name; pNameEl.style.color = player.color; }
  if (pTitleEl) pTitleEl.textContent = player.sub;

  const aiAvEl = document.querySelector('.ai-avatar');
  const aiNmEl = document.querySelector('.ai-name');
  const aiSubEl = document.querySelector('.ai-sub');
  if (aiAvEl) {
    // Use generated avatar portrait image if available
    aiAvEl.innerHTML = ai.avatarImg
      ? `<img src="${ai.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;">`
      : ai.avatar;
    aiAvEl.style.borderColor = ai.color + '88';
  }
  if (aiNmEl)  { aiNmEl.textContent = ai.name; aiNmEl.style.color = ai.color; }
  if (aiSubEl) aiSubEl.textContent = ai.sub;
  const aiQuoteEl = document.getElementById('aiQuote');
  if (aiQuoteEl) aiQuoteEl.textContent = ai.quote;

  // Store short faction names (first 2 words) for score badge display
  const playerWords = player.name.replace(/^THE /, '').split(' ');
  const aiWords     = ai.name.replace(/^THE /, '').split(' ');
  window.playerFactionName  = playerWords.slice(0, 2).join(' ');
  window.aiFactionName      = aiWords.slice(0, 2).join(' ');
  window.playerRaceId       = raceId;
  window.aiRaceId           = aiRaceId;
  window.playerAvatarImg    = player.avatarImg || `assets/avatars/${raceId}.png`;
  window.aiAvatarImg        = ai.avatarImg     || `assets/avatars/${aiRaceId}.png`;

  // Update faction labels below avatars
  const aiFactionLbl = document.getElementById('aiFactionLabel');
  const playerFactionLbl = document.getElementById('playerFactionLabel');
  if (aiFactionLbl) { aiFactionLbl.textContent = window.aiFactionName; aiFactionLbl.style.color = ai.color + '88'; }
  if (playerFactionLbl) { playerFactionLbl.textContent = window.playerFactionName; playerFactionLbl.style.color = player.color + '88'; }

  // Store faction colors globally for use in renderGrid
  window.playerFactionColor = player.color;
  window.aiFactionColor     = ai.color;

  return { player, ai, raceId, aiRaceId };
}

// ── BROOD SOVEREIGN DECK ──────────────────────────────────────────
// Same design rule: strong attack direction = weak rear (S low on aggressive cards)
// Brood: hive anchors (T1) → warrior clusters (T2) → skimmers (T3) → The Sovereign (T4)
const BROOD_CARDS = [
  { id:'br_t1a', name:'HIVE NODE',       tier:'I',  tierLabel:'HIVE NODE',       zone:'wide_cross', edges:{n:4,s:2,e:5,w:5}, power:1, ability:null,          abilityText:'Basic Hive Node', art:'assets/cards/brood/hive-node.png' },
  { id:'br_t1b', name:'HIVE NODE',       tier:'I',  tierLabel:'HIVE NODE',       zone:'wide_cross', edges:{n:5,s:2,e:4,w:5}, power:1, ability:null,          abilityText:'Basic Hive Node', art:'assets/cards/brood/hive-node.png' },
  { id:'br_t1c', name:'HIVE NODE',       tier:'I',  tierLabel:'HIVE NODE',       zone:'wide_cross', edges:{n:4,s:2,e:5,w:4}, power:1, ability:null,          abilityText:'Basic Hive Node', art:'assets/cards/brood/hive-node.png' },

// ── H/V BATTLE SCORING ────────────────────────
// Each card fights in 2 directions independently.
// WIN   = power counts for that row/col
// LOSE  = power does NOT count (show ✗)
// TIE   = both cards cancel, neither counts (show ✗ on both)
// NONE  = uncontested, always counts

function computeBattleResults() {
  // battle[r][c] = { h: 'win'|'lose'|'tie'|'none', v: 'win'|'lose'|'tie'|'none' }
  const b = Array(5).fill(null).map(() =>
    Array(7).fill(null).map(() => ({ h: 'none', v: 'none' }))
  );

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = G.grid[r][c];
      if (!cell.card) continue;

      // H battle: this cell vs East neighbor
      if (c < 6) {
        const east = G.grid[r][c+1];
        if (east.card && east.owner !== cell.owner) {
          // SURGE: +3 if currently losing more rows (uses stored surge state)
          const surgeBonus = (cell.card.ability === 'surge' && G.surgeTrigger?.[cell.owner]) ? 3 : 0;
          const me = (cell.card.edges.e + (cell.card.edgeMod?.e || 0) + surgeBonus);
          const them = (east.card.edges.w + (east.card.edgeMod?.w || 0));
          // PIERCE: ties go to this card
          const pierce = cell.card.ability === 'pierce';
          const pierceThem = east.card.ability === 'pierce';
          if (me > them || (me === them && pierce && !pierceThem)) {
            b[r][c].h = 'win';
            // Shield: block the first loss if east card has shield
            if (east.card.ability === 'shield' && !east.card.shieldExpended) {
              east.card.shieldExpended = true; // consume shield
              // loss blocked — east card stays at 'none'
            } else if (b[r][c+1].h !== 'win') b[r][c+1].h = 'lose';
            // DOUBLE STRIKE: also contest the cell beyond the beaten card
            if (cell.card.ability === 'double_strike' && c < 4) {
              const far = G.grid[r][c+2];
              if (far.card && far.owner !== cell.owner) {
                const me2 = me, them2 = (far.card.edges.w + (far.card.edgeMod?.w || 0));
                if (me2 > them2) { if (b[r][c+2].h !== 'win') b[r][c+2].h = 'lose'; }
              }
            }
          } else if (them > me || (me === them && pierceThem && !pierce)) {
            b[r][c+1].h = 'win';
            // Shield: block the first loss if west card has shield
            if (cell.card.ability === 'shield' && !cell.card.shieldExpended) {
              cell.card.shieldExpended = true;
              // loss blocked
            } else if (b[r][c].h !== 'win') b[r][c].h = 'lose';
            if (east.card.ability === 'double_strike' && c > 0) {
              const far = G.grid[r][c-1];
              if (far.card && far.owner !== east.owner) {
                const me2 = them, them2 = (far.card.edges.e + (far.card.edgeMod?.e || 0));
                if (me2 > them2) { if (b[r][c-1].h !== 'win') b[r][c-1].h = 'lose'; }
              }
            }
          } else { b[r][c].h = 'tie'; b[r][c+1].h = 'tie'; }
        }
      }

      // V battle: this cell vs South neighbor
      if (r < 4) {
        const south = G.grid[r+1][c];
        if (south.card && south.owner !== cell.owner) {
          const me = cell.card.edges.s, them = south.card.edges.n;
          if (me > them)      { b[r][c].v = 'win';  if (b[r+1][c].v !== 'win')  b[r+1][c].v = 'lose'; }
          else if (me < them) { b[r+1][c].v = 'win'; if (b[r][c].v   !== 'win')  b[r][c].v   = 'lose'; }
          else                { b[r][c].v = 'tie'; b[r+1][c].v = 'tie'; }
        }
      }
    }
  }
  return b;
}

function computeScores() {
  const battles = computeBattleResults();
  // Store on grid for rendering
  for (let r = 0; r < 5; r++)
    for (let c = 0; c < 7; c++)
      if (G.grid[r][c].card) G.grid[r][c].battle = battles[r][c];

  const rows = Array(5).fill(null).map(() => ({ p:0, a:0 }));
  const cols = Array(7).fill(null).map(() => ({ p:0, a:0 }));

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = G.grid[r][c];
      if (!cell.card) continue;
      const bat = battles[r][c];
      const countsH = bat.h === 'win' || bat.h === 'none';
      const countsV = bat.v === 'win' || bat.v === 'none';
      if (countsH) { if (cell.owner==='player') rows[r].p += cell.card.power; else rows[r].a += cell.card.power; }
      if (countsV) { if (cell.owner==='player') cols[c].p += cell.card.power; else cols[c].a += cell.card.power; }
    }
  }

  let pWins = 0, aWins = 0;
  const rowResults = rows.map(r => r.p > r.a ? 'p' : r.a > r.p ? 'a' : 'tie');
  const colResults = cols.map(c => c.p > c.a ? 'p' : c.a > c.p ? 'a' : 'tie');
  rowResults.forEach(r => { if(r==='p')pWins++; if(r==='a')aWins++; });
  colResults.forEach(c => { if(c==='p')pWins++; if(c==='a')aWins++; });

  return { rows, cols, rowResults, colResults, pWins, aWins };
}

// ── RENDERING ─────────────────────────────────
const CS_W = 114;  // cell width + gap = 108 + 6
const CS_H = 150;  // cell height + gap = 144 + 6
const CS = CS_W;   // legacy alias for horizontal calc

// Tier border colors — immediately readable at a glance
const TIER_COLORS = { 'I':'#d0d0d0', 'II':'#44cc66', 'III':'#4488ff', 'IV':'#aa44ff' };

function renderAll() {
  renderGrid();
  renderHand();
  renderScoreBadges();
  renderScoreHeader();
  renderAiHand();
}

function renderGrid() {
  const el = document.getElementById('grid');
  el.innerHTML = '';
  const valid = (G.turn === 'player' && G.selectedCard)
    ? getValidPlacements('player', G.selectedCard) : [];

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = G.grid[r][c];
      const div  = document.createElement('div');
      div.className = 'cell';
      div.dataset.r = r; div.dataset.c = c;

      if (cell.card) {
        div.classList.add(cell.owner);
        div.style.backgroundImage = `url('${cell.card.art || ''}')`;
        div.style.backgroundSize = 'cover';
        div.style.backgroundPosition = 'center';
        // Border = faction color (whose card), dots = tier indicator
        const factionCol = cell.owner === 'player'
          ? (window.playerFactionColor || '#00ffcc')
          : (window.aiFactionColor     || '#ff0080');
        div.style.borderColor = factionCol;
        div.style.boxShadow = `0 0 10px ${factionCol}44`;
        const tierDotCol = TIER_COLORS[cell.card.tier] || '#888';
        const tierNum    = {'I':1,'II':2,'III':3,'IV':4}[cell.card.tier] || 1;
        const col = cell.owner === 'player' ? '#00ffcc' : '#ff0080';
        const bat = cell.battle || { h: 'none', v: 'none' };

        // Edge opacity: dim if losing/tied in that direction (color only — no ✗ marks)
        const hLost = bat.h === 'lose' || bat.h === 'tie';
        const vLost = bat.v === 'lose' || bat.v === 'tie';
        const hAlpha = hLost ? '30' : 'ee';
        const vAlpha = vLost ? '30' : 'ee';

        // Power dims if BOTH directions are lost
        const bothLost = hLost && vLost;
        const pwrColor = bothLost ? col + '44' : col;

        div.innerHTML = `
          <span class="edge n" style="color:${col}${vAlpha}">${cell.card.edges.n}</span>
          <span class="edge s" style="color:${col}${vAlpha}">${cell.card.edges.s}</span>
          <span class="edge w" style="color:${col}${hAlpha}">${cell.card.edges.w}</span>
          <span class="edge e" style="color:${col}${hAlpha}">${cell.card.edges.e}</span>
          <!-- Tier dots: top-left, color = tier, count = tier number -->
          <div class="tier-dots">
            ${Array.from({length: tierNum}, () =>
              `<span class="tier-dot" style="background:${tierDotCol};color:${tierDotCol};"></span>`
            ).join('')}
          </div>
          <div class="cell-center">
            <span class="cell-power" style="color:${pwrColor}">${cell.card.power}</span>
          </div>
          ${cell.card.ability ? `<span class="ability-tag" style="color:${factionCol}88">${ab(cell.card.ability)}</span>` : ''}
        `;

        // Show tooltip on placed board cards (shows card info + buff status)
        div.onmouseenter = (ev) => {
          const cardWithBuf = {...cell.card};
          // Include current edge modifiers in displayed values
          if (cell.battle) {
            const hStr = cell.battle.h === 'win' ? '✓ H WIN' : cell.battle.h === 'lose' ? '✗ H LOSE' : cell.battle.h === 'tie' ? '= TIE' : '';
            const vStr = cell.battle.v === 'win' ? '✓ V WIN' : cell.battle.v === 'lose' ? '✗ V LOSE' : cell.battle.v === 'tie' ? '= TIE' : '';
            cardWithBuf._battleStatus = `${hStr}  ${vStr}`.trim();
          }
          showTip(ev, cardWithBuf);
        };
        div.onmouseleave = hideTip;
      } else {
        div.classList.add('empty');
        // Tier indicator dots — always faint, brighten when cell is valid
        const _triHtml = r === 4
          ? `<div class="tri-dots"><span class="tri-d white"></span></div>`
          : r === 3
          ? `<div class="tri-dots"><span class="tri-d green"></span><span class="tri-d green"></span></div>`
          : `<div class="tri-dots"><span class="tri-d green"></span><span class="tri-d green"></span><span class="tri-plus">+</span></div>`;
        div.innerHTML = _triHtml;
        if (valid.some(v => v.r===r && v.c===c)) {
          div.classList.add('valid');
          div.onclick = () => onCellClick(r, c);
          // Zone preview: show future valid cells on hover
          if (G.selectedCard) {
            const preview = getZonePreview(r, c, G.selectedCard, 'player');
            div.onmouseenter = () => {
              preview.forEach(({r: pr, c: pc}) => {
                const targetCell = document.querySelector(`.cell[data-r="${pr}"][data-c="${pc}"]`);
                if (targetCell && !targetCell.classList.contains('valid')) {
                  targetCell.classList.add('future-valid');
                }
              });
            };
            div.onmouseleave = () => {
              document.querySelectorAll('.cell.future-valid').forEach(el => el.classList.remove('future-valid'));
            };
          }
        } else if (G.selectedCard) {
          // Show red tooltip explaining WHY this cell is invalid
          div.style.cursor = 'not-allowed';
          const _r = r, _c = c, _card = G.selectedCard;
          div.onmouseenter = ev => {
            const homeRow = 4;
            let reason = 'No friendly card adjacent — place next to your cards';
            const tier = _card.tier;
            if (G.grid[_r][_c] && G.grid[_r][_c].owner) {
              reason = 'Cell is occupied';
            } else if (tier === 'I' && _r !== homeRow) {
              reason = 'Tier I: home row only';
            } else if (tier !== 'I' && _r === homeRow) {
              reason = 'Tier II+ cannot go in the home row';
            } else if ((tier === 'III' || tier === 'IV') && _r === 3) {
              reason = 'Tier III/IV: skip the advance row — go to rows 1-3';
            }
            showErrorTip(ev, reason);
          };
          div.onmouseleave = hideTip;
        }
      }
      el.appendChild(div);
    }
  }

  // Battle comparison indicators in gaps
  renderBattleIndicators(el);
}

function ab(a) {
  return {shield:'SHD', phantom:'PHT', chain:'CHN', double_strike:'DBL'}[a] || '';
}

function renderBattleIndicators(el) {
  const pairs = [
    {dr:1,dc:0,myE:'s',theirE:'n',axis:'v'},
    {dr:0,dc:1,myE:'e',theirE:'w',axis:'h'},
  ];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) {
    const cell = G.grid[r][c];
    if (!cell.card) continue;
    for (const d of pairs) {
      const nr = r+d.dr, nc = c+d.dc;
      if (nr<0||nr>=5||nc<0||nc>=7) continue;
      const nb = G.grid[nr][nc];
      if (!nb.card || nb.owner === cell.owner) continue;

      const mv = cell.card.edges[d.myE], tv = nb.card.edges[d.theirE];
      const winner = mv>tv ? cell.owner : tv>mv ? nb.owner : null;
      const col = winner==='player'?'#00ffcc': winner==='ai'?'#ff0080':'#444';
      let sym;
      if (d.axis === 'v') sym = mv>tv?'&#x25BC;': tv>mv?'&#x25B2;': '&#x2550;';
      else                sym = mv>tv?'&#x25BA;': tv>mv?'&#x25C4;': '&#x2016;';

      const ind = document.createElement('div');
      ind.className = 'bti';
      if (d.axis === 'v') {
        // Between rows — use CS_H for vertical positioning, CS_W for horizontal
        ind.style.cssText = `top:${r*CS_H+144-1}px;left:${c*CS_W+42}px;width:24px;height:8px;color:${col};background:${col}18;font-size:9px;`;
      } else {
        ind.style.cssText = `top:${r*CS_H+52}px;left:${c*CS_W+108-1}px;width:8px;height:24px;color:${col};background:${col}18;font-size:9px;writing-mode:vertical-lr;`;
      }
      ind.innerHTML = sym;
      el.appendChild(ind);
    }
  }
}

// Helper: has the player placed at least one card of the given tier on the board?
function hasPlacedTier(tier) {
  return G.playerHand.some(c =>
    c.tier === tier && c.used &&
    G.grid.flat().some(cell => cell.card?.id === c.id && cell.owner === 'player')
  );
}

function renderHand() {
  const el = document.getElementById('handCards');
  el.innerHTML = '';
  // Only render UNUSED cards, sorted by tier (T1→T2→T3→T4)
  const TIER_ORDER = {'I':1,'II':2,'III':3,'IV':4};
  const sortedHand = G.playerHand.filter(c => !c.used)
    .sort((a,b) => (TIER_ORDER[a.tier]||9) - (TIER_ORDER[b.tier]||9));
  sortedHand.forEach(card => {
    const div = document.createElement('div');
    const isSelected = G.selectedCard === card;
    const isUsed = false; // filtered above

    // Tier prerequisite check
    let isBlocked = false;
    let blockedTitle = '';
    if (!isUsed) {
      if (card.tier === 'II' && !hasPlacedTier('I')) {
        isBlocked = true;
        blockedTitle = 'Requires a Tier I card to be placed first';
      } else if (card.tier === 'III' && !hasPlacedTier('II')) {
        isBlocked = true;
        blockedTitle = 'Requires a Tier II card to be placed first';
      } else if (card.tier === 'IV' && !hasPlacedTier('III')) {
        isBlocked = true;
        blockedTitle = 'Requires a Tier III card to be placed first';
      }
    }

    div.className = 'hand-card' + (isUsed ? ' used' : '') + (isSelected ? ' selected' : '') + (isBlocked ? ' tier-blocked' : '');
    if (isBlocked) div.title = blockedTitle;

    // Card art background — border = player faction color, dots on card show tier
    if (card.art) div.style.backgroundImage = `url('${card.art}')`;
    const factionC = window.playerFactionColor || '#00ffcc';
    const tierDotC = TIER_COLORS[card.tier] || '#888888';
    div.style.borderColor = factionC;
    div.style.boxShadow = isSelected
      ? `0 0 22px ${factionC}88, 0 0 44px ${factionC}44`
      : `0 0 8px ${factionC}33`;

    const col = factionC;
    const tdCol = tierDotC;
    const tdNum = {'I':1,'II':2,'III':3,'IV':4}[card.tier] || 1;
    div.innerHTML = `
      <span class="hc-e-n" style="color:${col}">${card.edges.n}</span>
      <span class="hc-e-s" style="color:${col}">${card.edges.s}</span>
      <span class="hc-e-w" style="color:${col}">${card.edges.w}</span>

      <div style="position:absolute;top:4px;left:4px;display:flex;gap:2px;z-index:2;">
        ${Array.from({length:tdNum},()=>`<span style="width:5px;height:5px;border-radius:50%;background:${tdCol};box-shadow:0 0 3px ${tdCol};display:inline-block;"></span>`).join('')}
      </div>
      <div class="hc-center">
        <span class="hc-power-center" style="color:${col}">${card.power}</span>
      </div>
      ${card.ability ? `<span class="hc-ability-tag" style="color:${col}">${ab(card.ability)}</span>` : ''}

    }
    el.appendChild(div);
  });

// ── ZONE EXPANSION PATTERNS ────────────────────
// dr = forward/back (player: -1=forward, +1=backward; AI mirrors)
// dc = sideways (same for both)
const ZONES = {
  // Tier 1 WORLDS — liberal, open territory in all directions
  wide_cross:  [{dr:-1,dc:0},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:0,dc:-1},{dr:0,dc:1},{dr:1,dc:0},{dr:-2,dc:0}],
  // Supply hub — full ring around the card (most open)
  full_ring:   [{dr:-1,dc:-1},{dr:-1,dc:0},{dr:-1,dc:1},{dr:0,dc:-1},{dr:0,dc:1},{dr:1,dc:-1},{dr:1,dc:0},{dr:1,dc:1}],
  // Frontier post — holds ground, opens horizontal spread + 1 forward
  wall:        [{dr:-1,dc:0},{dr:0,dc:-1},{dr:0,dc:-2},{dr:0,dc:1},{dr:0,dc:2},{dr:1,dc:0}],
  // Battle group — opens wide front (2 wide × 2 deep forward)
  command:     [{dr:-1,dc:-1},{dr:-1,dc:0},{dr:-1,dc:1},{dr:-2,dc:0},{dr:-2,dc:-1},{dr:-2,dc:1}],
  // Carrier wing — forward lanes for fighters to launch through
  launch:      [{dr:-1,dc:0},{dr:-2,dc:0},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:-3,dc:0}],
  // Strike force / interceptor — punches directly forward, 2 deep
  lance:       [{dr:-1,dc:0},{dr:-2,dc:0}],
  // Flanker / fast runner — forward + diagonals
  flanker:     [{dr:-1,dc:0},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:-2,dc:0}],
  // Dreadnaught — expands everywhere, 2 deep in all directions
  dreadnaught: [{dr:-1,dc:0},{dr:-2,dc:0},{dr:0,dc:-1},{dr:0,dc:1},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:1,dc:0}],
};

// ── PLACEMENT RULES ───────────────────────────
function getValidPlacements(owner, card) {
  // PHANTOM: free placement within OWN 2 home rows
  if (card.ability === 'phantom') {
    const [minR, maxR] = owner === 'player' ? [3,4] : [0,1];
    const cells = [];
    for (let r = minR; r <= maxR; r++)
      for (let c = 0; c < 7; c++)
        if (!G.grid[r][c].card) cells.push({r,c});
    return cells;
  }

  const homeRow = owner === 'player' ? 4 : 0;
  const fwd     = owner === 'player' ? 1 : -1; // zone dr=-1 means "forward toward enemy" for player, so multiply by 1; AI flips
  const set     = new Set();

  // Home row is always available
  for (let c = 0; c < 7; c++)
    if (!G.grid[homeRow][c].card) set.add(`${homeRow},${c}`);

  // Zone expansion from each placed friendly card
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = G.grid[r][c];
      if (cell.owner !== owner || !cell.card) continue;

      const zoneKey   = cell.card.zone || 'wide_cross';
      const zoneOffsets = ZONES[zoneKey] || ZONES.wide_cross;

      for (const {dr, dc} of zoneOffsets) {
        // Mirror dr for player (forward = up = -1) vs AI (forward = down = +1)
        const nr = r + dr * fwd;
        const nc = c + dc;
        if (nr >= 0 && nr < 5 && nc >= 0 && nc < 7 && !G.grid[nr][nc].card)
          set.add(`${nr},${nc}`);
      }
    }
  }

  // Tier placement rules (player perspective: home=row4, advance=row3, deep=rows0-2)
  //   T1 = home row only
  //   T2 = anywhere non-home (including T2 advance row and deep)
  //   T3/T4 = deep territory only (rows 0-2 for player; rows 2-4 for AI)
  //           they CANNOT use the T2 advance row (row3 player / row1 AI)
  let minAllowed, maxAllowed;
  if (card.tier === 'I') {
    minAllowed = homeRow; maxAllowed = homeRow;
  } else if (card.tier === 'II') {
    minAllowed = owner === 'player' ? 0 : 1;
    maxAllowed = owner === 'player' ? 3 : 4;
  } else {
    // T3/T4 — skip the T2 advance row, go deeper
    minAllowed = owner === 'player' ? 0 : 2;
    maxAllowed = owner === 'player' ? 2 : 4;
  }

  return [...set]
    .map(s => { const [r,c] = s.split(',').map(Number); return {r,c}; })
    .filter(({r}) => r >= minAllowed && r <= maxAllowed);
}

// ── ZONE PREVIEW (yellow cells showing future placements if placed here) ───
function getZonePreview(r, c, card, owner) {
  const zoneKey   = card.zone || 'wide_cross';
  const zoneOffsets = ZONES[zoneKey] || ZONES.wide_cross;
  const fwd = owner === 'player' ? 1 : -1; // dr=-1 = forward for player, so multiply by 1
  const cells = [];
  for (const {dr, dc} of zoneOffsets) {
    const nr = r + dr * fwd, nc = c + dc;
    if (nr >= 0 && nr < 5 && nc >= 0 && nc < 7 && !G.grid[nr][nc].card)
      cells.push({r: nr, c: nc});
  }
  return cells;
}

// ── COMPARISON FLASH (no ownership change) ───
const DIRS4 = [
  {dr:-1,dc:0,myE:'n',theirE:'s',lbl:'north'},
  {dr: 1,dc:0,myE:'s',theirE:'n',lbl:'south'},
  {dr: 0,dc:1,myE:'e',theirE:'w',lbl:'east'},
  {dr: 0,dc:-1,myE:'w',theirE:'e',lbl:'west'},
];

function doComparisons(r, c, owner, card, depth=0) {
  if (depth > 3) return;
  const enemy = owner==='player'?'ai':'player';

  for (const d of DIRS4) {
    const nr=r+d.dr, nc=c+d.dc;
    if (nr<0||nr>=5||nc<0||nc>=7) continue;
    const target = G.grid[nr][nc];
    if (!target.card || target.owner !== enemy) continue;

    // Shield: absorbs first comparison
    if (target.card.ability==='shield' && !target.card.shieldExpended) {
      target.card.shieldExpended = true;
      addLog('shield', `${target.card.name} SHIELD absorbs comparison`);
      showFlash(r,c,nr,nc, card.edges[d.myE], target.card.edges[d.theirE], false);
      continue;
    }

    const mv = card.edges[d.myE], tv = target.card.edges[d.theirE];
    const iWin = mv > tv;
    showFlash(r, c, nr, nc, mv, tv, iWin);

    addLog('compare', `${card.name} ${mv}${iWin?'>':'<'}${tv} vs ${target.card.name} (${d.lbl})`);

    // CHAIN: cascade comparison from adjacent cell
    if (card.ability==='chain' && iWin && depth===0) {
      addLog('compare', `CHAIN from ${card.name}...`);
      doComparisons(nr, nc, owner, target.card, depth+1);
    }

    // DOUBLE STRIKE: also compare one step further in same direction
    if (card.ability==='double_strike' && iWin) {
      const nr2=nr+d.dr, nc2=nc+d.dc;
      if (nr2>=0&&nr2<5&&nc2>=0&&nc2<6) {
        const t2 = G.grid[nr2][nc2];
        if (t2.card && t2.owner===enemy) {
          const mv2=mv, tv2=t2.card.edges[d.theirE];
          showFlash(nr,nc,nr2,nc2,mv2,tv2,mv2>tv2);
          addLog('compare', `DOUBLE STRIKE: ${mv2}${mv2>tv2?'>':'<='}${tv2} vs ${t2.card.name}`);
        }
      }
    }
  }
}

// ── NO-VALID-MOVES PASS RULE ──────────────────
function hasAnyMoves(owner) {
  const hand = owner === 'player' ? G.playerHand : G.aiHand;
  return hand.filter(c => !c.used).some(card => getValidPlacements(owner, card).length > 0);
}

// ── PLACE CARD ────────────────────────────────
function playCardSfx() {
  const sfx = document.getElementById('cardSfx');
  if (!sfx) return;
  sfx.currentTime = 0; sfx.volume = 0.7;
  sfx.play().catch(() => {});
}

// Apply ability effects when a card is placed on the board
function applyPlacementAbility(card, r, c, owner) {
  const dirs = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
  if (card.ability === 'boost' || card.ability === 'commander') {
    const bonus = card.ability === 'commander' ? 2 : 1;
    dirs.forEach(({dr,dc}) => {
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>=5||nc<0||nc>=7) return;
      const nb = G.grid[nr][nc];
      if (nb.card && nb.owner === owner) {
        if (card.ability === 'commander' && nb.card.tier !== card.tier) return;
        nb.card.edgeMod = nb.card.edgeMod || {n:0,s:0,e:0,w:0};
        nb.card.edgeMod.n += bonus; nb.card.edgeMod.s += bonus;
        nb.card.edgeMod.e += bonus; nb.card.edgeMod.w += bonus;
      }
    });
  }
  // Update surge trigger state (used in computeBattleResults)
  if (!G.surgeTrigger) G.surgeTrigger = {player:false, ai:false};
  const s = computeScores();
  G.surgeTrigger.player = s.rowResults.filter(r=>r==='a').length > s.rowResults.filter(r=>r==='p').length;
  G.surgeTrigger.ai     = s.rowResults.filter(r=>r==='p').length > s.rowResults.filter(r=>r==='a').length;
}

function placeCard(card, r, c, owner) {
  G.grid[r][c] = { card, owner };   // owner NEVER changes after this
  card.used = true;
  applyPlacementAbility(card, r, c, owner);
  // Play card placement sound for both players (AI slightly softer + delayed)
  if (owner === 'player') {
    playCardSfx();
  } else {
    setTimeout(() => {
      const sfx = document.getElementById('cardSfx');
      if (sfx) { sfx.currentTime = 0; sfx.volume = 0.35; sfx.play().catch(()=>{}); }
    }, 400);
  }
  addLog(owner==='player'?'player':'ai',
    `${owner==='player'?'YOU':'AI'} place ${card.name}[${card.tier}] at [${r},${c}]`);

  doComparisons(r, c, owner, card);
  renderAll();

  setTimeout(() => {
    const cells = document.querySelectorAll('.cell');
    if (cells[r*6+c]) cells[r*6+c].classList.add('just-placed');
  }, 10);

  checkWin();
}

// ── AI CARD FLY ANIMATION ─────────────────────
function animateAiCard(card, r, c) {
  const grid   = document.getElementById('grid');
  const target = grid?.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  // Source: first unused face-down AI deck card, or fall back to AI avatar
  const srcEl  = document.querySelector('.fd-card:not(.used)') ||
                 document.querySelector('.ai-avatar');

  if (!target || !srcEl) { placeCard(card, r, c, 'ai'); return; }

  const src  = srcEl.getBoundingClientRect();
  const tgt  = target.getBoundingClientRect();
  const aCol = window.aiFactionColor || '#ff0080';

  // Start position: center of source element
  const startL = src.left + src.width  / 2 - tgt.width  / 2;
  const startT = src.top  + src.height / 2 - tgt.height / 2;

  const floater = document.createElement('div');
  floater.style.cssText = `
    position:fixed; z-index:9200; pointer-events:none;
    width:${tgt.width}px; height:${tgt.height}px;
    left:${startL}px; top:${startT}px;
    border-radius:6px;
    background:#050510 center/cover no-repeat;
    ${card.art ? `background-image:url('${card.art}');` : ''}
    border:2px solid ${aCol}99;
    box-shadow: 0 0 28px ${aCol}66, 0 8px 32px #000000cc;
    opacity:1;
    transition: left 0.42s cubic-bezier(0.4,0,0.2,1),
                top  0.42s cubic-bezier(0.4,0,0.2,1),
                opacity 0.18s ease;
  `;
  document.body.appendChild(floater);

  // Double rAF: first frame paints start pos; second starts the transition
  requestAnimationFrame(() => requestAnimationFrame(() => {
    floater.style.left = tgt.left + 'px';
    floater.style.top  = tgt.top  + 'px';
  }));

  // Fade out as it arrives, then place
  setTimeout(() => { floater.style.opacity = '0'; }, 360);
  setTimeout(() => {
    floater.remove();
    placeCard(card, r, c, 'ai');
  }, 580);
}

// ── AI TURN ───────────────────────────────────
function aiTurn() {
  const avail = G.aiHand.filter(c => !c.used);
  if (!avail.length) { checkWin(); return; }

  let best = -Infinity, bestCard = null, bestR = -1, bestC = -1;

  for (const card of avail) {
    for (const {r,c} of getValidPlacements('ai', card)) {
      let score = card.power;
      const s = computeScores();
      if (s.rowResults[r] !== 'a') score += 2;
      if (s.colResults[c] !== 'a') score += 2;
      for (const d of DIRS4) {
        const nr=r+d.dr, nc=c+d.dc;
        if (nr<0||nr>=5||nc<0||nc>=7) continue;
        const t = G.grid[nr][nc];
        if (t.card && t.owner==='player' && card.edges[d.myE] > t.card.edges[d.theirE])
          score += 1;
      }
      score += r * 0.2 + (2.5-Math.abs(2.5-c)) * 0.1 + Math.random()*0.5;
      if (score > best) { best=score; bestCard=card; bestR=r; bestC=c; }
    }
  }

  if (bestCard && bestR >= 0) animateAiCard(bestCard, bestR, bestC);
  if (G.gameOver) return;
  G.turn = 'player';
  renderScoreHeader();

  if (!hasAnyMoves('player')) {
    G.turn = 'ai';
    addLog('system', 'You have no moves -- AI goes again');
    setTimeout(aiTurn, 1200);
    return;
  }
}

// ── WIN CHECK ─────────────────────────────────
function checkWin() {
  if (G.gameOver) return;
  // Early win: majority of 35 cells (18+) controlled by one side
  let pCells = 0, aCells = 0;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) {
    const cell = G.grid[r][c];
    if (cell.owner === 'player') pCells++;
    else if (cell.owner === 'ai') aCells++;
  }
  if (pCells >= 17 || aCells >= 17) {
    // fall through to show result
  } else {
    const allDone = G.playerHand.every(c=>c.used) && G.aiHand.every(c=>c.used);
    if (!allDone) return;
  }

  G.gameOver = true;
  const s = computeScores();
  const overlay = document.getElementById('overlay');
  const title   = document.getElementById('overlayTitle');
  const sub     = document.getElementById('overlaySub');
  const bkdn    = document.getElementById('overlayBreakdown');

  overlay.classList.add('show');

  if (s.pWins > s.aWins) {
    title.className = 'overlay-title win';
    title.textContent = 'BREACH COMPLETE';
    sub.textContent   = `You dominated ${s.pWins} of 11 lines`;
  } else if (s.aWins > s.pWins) {
    title.className = 'overlay-title lose';
    title.textContent = 'BREACH FAILED';
    sub.textContent   = `AI dominated ${s.aWins} of 11 lines`;
  } else {
    title.className = 'overlay-title draw';
    title.textContent = 'STALEMATE';
    sub.textContent   = `${s.pWins} lines each`;
  }

  const rowW_p = s.rowResults.filter(r=>r==='p').length;
  const rowW_a = s.rowResults.filter(r=>r==='a').length;
  const colW_p = s.colResults.filter(c=>c==='p').length;
  const colW_a = s.colResults.filter(c=>c==='a').length;

  bkdn.innerHTML = `
    <div class="ob-col">
      <div class="ob-label">ROWS WON</div>
      <div class="ob-val" style="color:#00ffcc">${rowW_p}</div>
    </div>
    <div class="ob-col">
      <div class="ob-label">COLS WON</div>
      <div class="ob-val" style="color:#00ffcc">${colW_p}</div>
    </div>
    <div class="ob-col">
      <div class="ob-label">TOTAL</div>
      <div class="ob-val" style="color:#00ffcc">${s.pWins}/12</div>
    </div>
  `;
}

function onCellClick(r, c) {
  if (!G.selectedCard || G.turn !== 'player' || G.gameOver) return;
  if (!getValidPlacements('player', G.selectedCard).some(v=>v.r===r&&v.c===c)) return;

  placeCard(G.selectedCard, r, c, 'player');

function buildZoneGrid(card) {
  // Build a 5-row × 6-col mini-grid showing which cells this card unlocks
  const ROWS = 5, COLS = 6;
  const cardR = ROWS - 1; // player home row (bottom)
  const cardC = Math.floor(COLS / 2); // place in middle column for illustration
  const fwd = 1; // dr=-1 means "one row up/forward" for player, multiply by 1 to preserve direction

  const zoneKey = card.zone || 'wide_cross';
  const zoneOffsets = ZONES[zoneKey] || ZONES.wide_cross;
  const zoneCells = new Set();
  for (const {dr, dc} of zoneOffsets) {
    const nr = cardR + dr * fwd, nc = cardC + dc;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) zoneCells.add(`${nr},${nc}`);
  }

  const tierCol = TIER_COLORS[card.tier] || '#888';
  let html = `<div style="margin-top:10px;">
    <div style="font-size:9px;letter-spacing:2px;color:#555;margin-bottom:5px;">EXPANSION ZONE</div>
    <div style="display:grid;grid-template-columns:repeat(${COLS},12px);gap:2px;">`;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let bg, border;
      if (r === cardR && c === cardC) {
        bg = tierCol; border = 'none'; // card position
      } else if (zoneCells.has(`${r},${c}`)) {
        bg = '#ffdd0055'; border = '1px solid #ffdd00'; // zone cells
      } else {
        bg = '#0e0c18'; border = '1px solid #1a1428'; // empty
      }
      html += `<div style="width:12px;height:12px;border-radius:2px;background:${bg};border:${border};"></div>`;
    }
  }
  html += `</div>
    <div style="display:flex;gap:10px;margin-top:5px;">
      <span style="font-size:9px;color:#666;">■ <span style="color:${tierCol}">this card</span></span>
      <span style="font-size:9px;color:#666;">■ <span style="color:#ffdd00">opens for next card</span></span>
    </div>
  </div>`;
  return html;
}

// ── GAMEPLAY MUSIC — random rotating playlist ─────────────
const PLAYLIST = [
  'assets/music1.mp3',
  'assets/music2.mp3',
  'assets/music3.mp3',
  'assets/music4.mp3',
];
let playlistOrder = [];
let trackIdx = 0;
let musicStarted = false;
let musicMuted = false;

function shufflePlaylist() {
  playlistOrder = [...PLAYLIST];
  for (let i = playlistOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [playlistOrder[i], playlistOrder[j]] = [playlistOrder[j], playlistOrder[i]];
  }
  trackIdx = 0;
}

function playNextTrack() {
  if (musicMuted) return;
  if (trackIdx >= playlistOrder.length) shufflePlaylist();
  const audio = document.getElementById('bgTrack');
  audio.src = playlistOrder[trackIdx++];
  audio.volume = 0.4;
  audio.play().catch(() => {});
}

function startGameMusic() {
  if (musicStarted) return;
  musicStarted = true;
  shufflePlaylist();
  const audio = document.getElementById('bgTrack');
  audio.addEventListener('ended', playNextTrack);
  playNextTrack();
}

function setVolume(val) {
  const audio = document.getElementById('bgTrack');
  if (audio) audio.volume = val / 100;
  // Sync both sliders
  const s1 = document.getElementById('volSlider');
  const s2 = document.getElementById('volSlider2');
  if (s1) s1.value = val;
  if (s2) s2.value = val;
}

function toggleMenu() {
  const m = document.getElementById('gameMenu');
  const b = document.getElementById('menuBackdrop');
  const open = m && m.style.display !== 'none';
  if (m) m.style.display = open ? 'none' : 'block';
  if (b) b.style.display = open ? 'none' : 'block';
}
function closeMenu() {
  const m = document.getElementById('gameMenu');
  const b = document.getElementById('menuBackdrop');
  if (m) m.style.display = 'none';
  if (b) b.style.display = 'none';
}
function updateMuteLabel() {
  const btn = document.getElementById('muteMenuBtn');
  if (btn) btn.textContent = musicMuted ? '🔇 UNMUTE' : '🔊 MUTE';
}
// Menu closes via backdrop click (see menuBackdrop div)

function goToMenu() {
  G.gameOver = true;
  window.location.href = 'index.html?screen=deck';
}
function goToMenuNow() { closeMenu(); goToMenu(); }

function confirmRestart() {
  closeMenu();
  const m = document.createElement('div');
  m.id = 'restartConfirm';
  m.style.cssText = `position:fixed;inset:0;z-index:150000;background:#000000bb;
    display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;`;
  m.innerHTML = `
    <div style="background:#0a0a18;border:1px solid #8855ffaa;border-radius:10px;
      padding:28px 36px;text-align:center;box-shadow:0 0 48px #8855ff22;">
      <div style="font-family:'Orbitron',monospace;font-size:14px;letter-spacing:3px;
        color:#fff;margin-bottom:6px;">RESTART GAME?</div>
      <div style="font-size:10px;color:#444;letter-spacing:2px;margin-bottom:22px;">
        Current battle will be lost</div>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button onclick="document.getElementById('restartConfirm').remove();initGame();"
          style="background:#0a1a14;border:1px solid #226644;color:#00ffcc;
          font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 22px;
          cursor:pointer;border-radius:4px;transition:all 0.2s;"
          onmouseenter="this.style.background='#0e2a1e'"
          onmouseleave="this.style.background='#0a1a14'">CONFIRM</button>
        <button onclick="document.getElementById('restartConfirm').remove();"
          style="background:#1a0a2e;border:1px solid #443366;color:#8866aa;
          font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 22px;
          cursor:pointer;border-radius:4px;transition:all 0.2s;"
          onmouseenter="this.style.background='#2a1040'"
          onmouseleave="this.style.background='#1a0a2e'">CANCEL</button>
      </div>
    </div>`;
  document.body.appendChild(m);
}

function toggleGameMusic() {
  const audio = document.getElementById('bgTrack');
  const btn   = document.getElementById('gameMuteBtn');
  musicMuted = !musicMuted;
  audio.muted = musicMuted;
  if (btn) btn.textContent = musicMuted ? '🔇' : '🔊';
  if (!musicStarted && !musicMuted) startGameMusic();
}

// Start on first click (browser autoplay policy)
document.addEventListener('click', startGameMusic, { once: true });

// Disable right-click context menu on game board
document.addEventListener('contextmenu', e => e.preventDefault());

// Intercept F5 / Ctrl+R with a STYLED modal (must intercept keydown before browser acts)
document.addEventListener('keydown', e => {
  if ((e.key === 'F5') || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'R')) {
    if (!G.gameOver) {
      e.preventDefault();
      showRestartModal();
    }
  }
});

function showRestartModal() {
  const m = document.createElement('div');
  m.id = 'restartModal';
  m.style.cssText = `
    position:fixed;inset:0;z-index:1000;
    background:#000000cc;backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  `;
  m.innerHTML = `
    <div style="
      background:#07070fee;border:1px solid #8855ff55;border-radius:8px;
      padding:36px 48px;text-align:center;font-family:'Courier New',monospace;
      box-shadow:0 0 60px #8855ff33;
    ">
      <div style="font-family:'Orbitron',monospace;font-size:18px;letter-spacing:4px;color:#fff;margin-bottom:8px;">RESTART GAME?</div>
      <div style="font-size:11px;color:#555;letter-spacing:2px;margin-bottom:28px;">Current battle will be lost</div>
      <div style="display:flex;gap:16px;justify-content:center;">
        <button onclick="document.getElementById('restartModal').remove();initGame();" style="
          background:transparent;border:1px solid #00ffcc;color:#00ffcc;
          font-family:inherit;font-size:10px;letter-spacing:3px;
          padding:10px 28px;cursor:pointer;border-radius:3px;
          transition:all 0.2s;
        " onmouseenter="this.style.background='#00ffcc22'" onmouseleave="this.style.background='transparent'">
          ↺ NEW GAME
        </button>
        <button onclick="document.getElementById('restartModal').remove();" style="
          background:transparent;border:1px solid #443366;color:#7755aa;
          font-family:inherit;font-size:10px;letter-spacing:3px;
          padding:10px 28px;cursor:pointer;border-radius:3px;
          transition:all 0.2s;
        " onmouseenter="this.style.borderColor='#8855ff';this.style.color='#aa88ff'" onmouseleave="this.style.borderColor='#443366';this.style.color='#7755aa'">
          CANCEL
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  // Also close on backdrop click
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
}

// Keep beforeunload for tab close / navigation (browser dialog, can't style)
window.addEventListener('beforeunload', e => {
  if (!G.gameOver) { e.preventDefault(); e.returnValue = ''; }
});

// ── START ─────────────────────────────────────
// Set active deck from URL param BEFORE initGame reads it
(function() {
  const raceId = new URLSearchParams(window.location.search).get('race') || 'terran';
  window.__activeDeck = { terran: PLAYER_CARDS, brood: BROOD_CARDS }[raceId] || PLAYER_CARDS;
})();
initRaceTheme();
initGame();

// F5 / Ctrl+R → deck selection instead of hard refresh
document.addEventListener('keydown', e => {
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
    e.preventDefault();
    goToMenu();
  }
});
</script>

<!-- GAME MENU — at body level so z-index always wins over everything -->
<div id="gameMenu" style="
  display:none;position:fixed;top:44px;right:16px;z-index:100000;
  background:#0a0a18;border:1px solid #8855ffaa;border-radius:8px;
  padding:14px;min-width:230px;font-family:'Courier New',monospace;
  box-shadow:0 12px 48px #000000ee, 0 0 28px #8855ff33, 0 0 0 1px #8855ff22;
">
  <div style="font-size:10px;letter-spacing:3px;color:#aa88ff;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2a1a44;">⚙ MENU</div>
  <!-- Volume -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
    <span style="font-size:10px;color:#aaa;letter-spacing:1px;white-space:nowrap;min-width:32px;">VOL</span>
    <input id="volSlider2" type="range" min="0" max="100" value="40"
      oninput="setVolume(this.value)"
      style="flex:1;accent-color:#8855ff;cursor:pointer;">
  </div>
  <!-- Buttons -->
  <div style="display:flex;flex-direction:column;gap:8px;">
    <button onclick="toggleGameMusic();updateMuteLabel()" id="muteMenuBtn" style="
      background:#1a0a2e;border:1px solid #6644aa;color:#ffffff;
      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;
      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;
    " onmouseenter="this.style.background='#2a1040';this.style.borderColor='#aa77ff'"
       onmouseleave="this.style.background='#1a0a2e';this.style.borderColor='#6644aa'">
      🔊 MUTE / UNMUTE
    </button>
    <button onclick="confirmRestart()" style="
      background:#0a1a14;border:1px solid #226644;color:#ffffff;
      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;
      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;
    " onmouseenter="this.style.background='#0e2a1e';this.style.borderColor='#00ffcc'"
       onmouseleave="this.style.background='#0a1a14';this.style.borderColor='#226644'">
      ↺ RESTART GAME
    </button>
    <button onclick="goToMenuNow()" style="
      background:#1a0a2e;border:1px solid #6644aa;color:#ffffff;
      font-family:inherit;font-size:11px;letter-spacing:2px;padding:9px 14px;
      cursor:pointer;border-radius:4px;text-align:left;width:100%;transition:all 0.2s;
    " onmouseenter="this.style.background='#2a1040';this.style.borderColor='#aa77ff'"
       onmouseleave="this.style.background='#1a0a2e';this.style.borderColor='#6644aa'">
      ← BACK TO DECK SELECT
    </button>
  </div>
</div>

<!-- Menu backdrop — body level, just below the menu -->
<div id="menuBackdrop" onclick="closeMenu()" style="
  display:none;position:fixed;inset:0;z-index:99999;background:#00000066;
"></div>

<!-- TOOLTIP — shiny, tier-colored -->
<div id="tooltip" class="tooltip"></div>
<!-- ERROR TOOLTIP — red, invalid placement -->
<div id="errorTip" class="tip-error"></div>

</body>
</html>
