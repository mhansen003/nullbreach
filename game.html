<!DOCTYPE html>


<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1">


<title>GALACTIC ZERO</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>


* { box-sizing: border-box; margin: 0; padding: 0; }


body {


  background: #080810;


  color: #e0e0e0;


  font-family: 'Courier New', monospace;


  min-height: 100vh;


  display: flex;


  flex-direction: column;


  /* Allow vertical scroll when monitor is reduced */


  overflow-x: hidden;


  overflow-y: auto;


  user-select: none;


}





/* Lore backgrounds — contained to AI bar and player hand bar only */


.ai-area, .player-area {


  background-size: cover;


  background-position: center;


  position: relative;


  transition: background-image 0.8s ease;


}


/* Dark overlay on the UI areas so content stays readable */


.ai-area::before, .player-area::before {


  content: '';


  position: absolute; inset: 0; z-index: 0;


  pointer-events: none;


}


.ai-area::before {


  background: linear-gradient(to bottom, #020208cc 0%, #020208aa 100%);


}


.player-area::before {


  /* fully transparent so lore image bleeds through edge to edge */


  background: transparent;


}


/* Ensure all children sit above the overlay */


.ai-area > *, .player-area > * { position: relative; z-index: 1; }








/* Board card art overlay — gradient keeps edge values readable */


.cell.player::after, .cell.ai::after {


  content: ''; position: absolute; inset: 0; z-index: 0;


  background: linear-gradient(to top, #000000cc 0%, #00000077 38%, transparent 70%);


  pointer-events: none;


}


/* z-index only — do NOT override position (these are all position:absolute) */


.cell.player .edge, .cell.ai .edge,


.cell.player .tier-badge, .cell.ai .tier-badge,


.cell.player .cell-center, .cell.ai .cell-center,


.cell.player .ability-tag, .cell.ai .ability-tag {


  z-index: 2;


}





/* Ensure layout areas sit above fixed lore backgrounds */


.header, .ai-area, .main-area, .player-area {


  position: relative; z-index: 10;


}





/* HEADER */


.header {


  background: linear-gradient(90deg, #0a0a1a, #160a28);


  border-bottom: 1px solid #00ffcc44;


  padding: 6px 20px;


  display: flex;


  justify-content: space-between;


  align-items: center;


  flex-shrink: 0;


}


.title { font-family:'Orbitron',monospace; color: #fff; font-size: 15px; letter-spacing: 5px; text-shadow: 0 0 16px #8855ffaa, 0 2px 4px #000; }


.score-bar { display: flex; gap: 14px; align-items: center; }


.score-p { color: #00ffcc; font-size: 15px; font-weight: bold; text-shadow: 0 0 8px #00ffcc; }


.score-a { color: #ff0080; font-size: 15px; font-weight: bold; text-shadow: 0 0 8px #ff0080; }


.score-lbl { font-size: 9px; color: #444; letter-spacing: 2px; }


.turn-tag { font-size: 10px; letter-spacing: 2px; padding: 3px 10px; border-radius: 3px; }


.turn-tag.player { color: #00ffcc; border: 1px solid #00ffcc44; }


.turn-tag.ai     { color: #ff0080; border: 1px solid #ff008044; }





/* AI area — invisible spacer only, portrait moved to fixed HUD */


.ai-area {


  display: none;


}


.ai-portrait {


  display: flex; align-items: center; gap: 8px;


  background: #08080faa; border: 1px solid #ff008033;


  border-radius: 6px; padding: 4px 10px;


  backdrop-filter: blur(4px);


}


.ai-avatar {


  width: 48px; height: 48px; flex-shrink: 0;


  background: linear-gradient(135deg, #2a0d0d, #180a18);


  border: 1px solid #ff008066; border-radius: 50%;


  display: flex; align-items: center; justify-content: center; font-size: 20px;


  overflow: hidden;


}


.ai-name  { color: #ff0080; font-size: 10px; letter-spacing: 1px; }


.ai-sub   { display: none; }


.ai-quote { display: none; }


.ai-hand-row { display: none; } /* hidden — opponent deck not shown */


.hand-lbl-v { font-size: 8px; color: #333; letter-spacing: 2px; writing-mode: vertical-lr; transform: rotate(180deg); }


.facedown {


  width: 50px; height: 66px; border-radius: 3px;


  background: repeating-linear-gradient(45deg,#110820,#110820 4px,#160a28 4px,#160a28 8px);


  border: 1px solid #ff008022;


  display: flex; align-items: center; justify-content: center;


  color: #ff008033; font-size: 18px; transition: opacity 0.3s;


}


.facedown.used { opacity: 0.18; }





/* MAIN AREA */


.main-area { flex: 1; display: flex; overflow: visible; min-height: 0; }





/* BOARD WRAP */


.board-wrap {


  flex: 1;


  display: flex; flex-direction: column;


  align-items: center; justify-content: flex-end;


  padding: 0 8px 0;


  overflow: hidden;


}


.board-dir-row {


  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;


  width: 100%; max-width: 730px; justify-content: space-between;


  padding: 0 88px 0 0;


}


.dir-lbl { font-size: 9px; letter-spacing: 2px; }





/* Board + row scores side by side */


.board-and-scores {


  display: flex;


  gap: 8px;


  align-items: flex-start;


}





/* Column scores below grid */


.col-score-row {


  display: flex;


  gap: 6px;


  margin-top: 4px;


}


.col-score-badge {


  width: 124px; height: 54px;


  border-radius: 4px;


  display: flex; align-items: center; justify-content: center;


  flex-shrink: 0; overflow: hidden; position: relative;


  transition: border-color 0.3s;


  /* All col badges same fixed size — no flex-grow */


  box-sizing: border-box;


}


.col-score-badge.none   { background:#07070f; border:1px solid #111120; }


.col-score-badge.p-win  { background:#00ffcc08; border:1px solid #00ffcc44; }


.col-score-badge.a-win  { background:#ff008008; border:1px solid #ff008044; }


.col-score-badge.tie    { background:#0d0c18; border:1px solid #221a33; }





/* Row scores column */


.row-scores {


  display: flex;


  flex-direction: column;


  gap: 6px;


}


.row-score-badge {


  width: 68px; height: 152px;


  border-radius: 4px;


  display: flex; flex-direction: column; align-items: center; justify-content: center;


  gap: 4px; overflow: hidden; position: relative;


  transition: border-color 0.3s;


  box-sizing: border-box; flex-shrink: 0;


}


.row-score-badge.none  { background:#07070f; border:1px solid #111120; }


.row-score-badge.p-win { background:#00ffcc08; border:1px solid #00ffcc44; }


.row-score-badge.a-win { background:#ff008008; border:1px solid #ff008044; }


.row-score-badge.tie   { background:#0d0c18; border:1px solid #221a33; }


/* avatar circles on badges */


.sbav { width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid transparent; }


.sbav.win  { filter:none;   opacity:1;   }


.sbav.lose { filter:grayscale(1); opacity:0.25; }


.sbav.none { filter:grayscale(1); opacity:0.15; }





/* GRID */


.grid {


  display: grid;


  grid-template-columns: repeat(7, 124px);


  grid-template-rows: repeat(5, 152px);


  gap: 6px;


  position: relative;


  flex-shrink: 0;


}





/* CELLS — 3:4 portrait ratio (114×152) matching hand card proportions */


.cell {


  width: 124px; height: 152px;


  border-radius: 5px;


  position: relative;


  display: flex; flex-direction: column;


  align-items: center; justify-content: center;


  transition: all 0.15s;


}


.cell.empty { background: #0b0b17; border: 1px dashed #1a1a2e; }


.cell.valid { background: #0e1a10; border: 2px dashed #00ffcc55; cursor: pointer; }


.cell.valid:hover { background: #0e2214; border-color: #00ffcc; box-shadow: 0 0 16px #00ffcc22; }


/* Yellow zone preview overrides green valid cells — zone is more important */


.cell.future-valid { border: 2px solid #ffdd00 !important; background: #ffdd0018 !important; box-shadow: 0 0 12px #ffdd0044 !important; }


.cell.player { background: linear-gradient(145deg, #0a1c16, #08151e); border: 2px solid #00ffcc; box-shadow: 0 0 8px #00ffcc22; }


.cell.ai     { background: linear-gradient(145deg, #1c0a0a, #150818); border: 2px solid #ff0080; box-shadow: 0 0 8px #ff008022; }


.cell.just-placed { animation: placePulse 0.35s ease; }


@keyframes placePulse { 0%{transform:scale(0.8);opacity:0.4} 100%{transform:scale(1);opacity:1} }


/* Battle outcome preview — shown on adjacent enemy cells when hovering a valid placement */


.bpv-win  { outline: 3px solid #00ff8888 !important; box-shadow: 0 0 18px #00ff8844, inset 0 0 14px #00ff8822 !important; }


.bpv-lose { outline: 3px solid #ff222288 !important; box-shadow: 0 0 18px #ff222244, inset 0 0 14px #ff222222 !important; }


.bpv-tie  { outline: 3px solid #ffdd0088 !important; box-shadow: 0 0 18px #ffdd0044, inset 0 0 14px #ffdd0022 !important; }


/* Safe zone bars — player home (row 4) gets top bar, AI home (row 0) gets bottom bar */


.cell[data-r="4"]::before {


  content:''; position:absolute; top:0;left:0;right:0; height:3px; z-index:3; pointer-events:none;


  background:linear-gradient(90deg,transparent,var(--player-safe-col,#00ffcc44),transparent);


}


.cell[data-r="0"]::after {


  content:''; position:absolute; bottom:0;left:0;right:0; height:3px; z-index:3; pointer-events:none;


  background:linear-gradient(90deg,transparent,var(--ai-safe-col,#ff008044),transparent);


}


/* Battle result chip — positioned in gap between battling cells */


.bti {


  position:absolute; z-index:8; pointer-events:all; cursor:help;


  border-radius:50%; display:flex; align-items:center; justify-content:center;


  transition:transform 0.15s, box-shadow 0.15s;


}


.bti:hover { transform:scale(1.5) !important; z-index:12; }


.bti img  { width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;pointer-events:none; }


/* Tie chip */


.bti.tie-chip { background:#1a1a2a; border:1px solid #333344;


  font-size:9px; font-weight:bold; letter-spacing:1px; color:#cccccc; }


/* Win chip glow pulse */


@keyframes chipPulse {


  0%,100% { box-shadow: 0 0 0 2px var(--wc,#fff4), 0 0 8px var(--wc,#fff2); }


  50%     { box-shadow: 0 0 0 3px var(--wc,#fff6), 0 0 16px var(--wc,#fff4); }


}


.bti.win-chip { animation: chipPulse 2.5s ease-in-out infinite; }





@keyframes starPulse {


  0%,100% { color:#bb44ff; filter:drop-shadow(0 0 3px #bb44ffcc); }


  50%      { color:#ffffff; filter:drop-shadow(0 0 9px #ffffffdd); }


}


.ability-star { animation: starPulse 2s ease-in-out infinite; }


/* Card face -- all absolutely positioned inside position:relative .cell */


.edge {


  position: absolute; font-size: 15px; font-weight: bold; line-height: 1; z-index: 2;


  min-width: 22px; text-align: center;


  background: rgba(0,0,0,0.72);


  border-radius: 50%;


  padding: 2px 3px;


  box-shadow: 0 0 0 1px rgba(0,0,0,0.5);


}


.edge.n { top: 5px;    left: 50%; transform: translateX(-50%); }


.edge.s { bottom: 5px; left: 50%; transform: translateX(-50%); }


.edge.w { left: 4px;   top: 50%;  transform: translateY(-50%); }


.edge.e { right: 4px;  top: 50%;  transform: translateY(-50%); }





/* Power in absolute center */


.cell-center {


  position: absolute; top: 50%; left: 50%;


  transform: translate(-50%, -50%);


  display: flex; flex-direction: column; align-items: center; z-index: 2;


  pointer-events: none;


}


.cell-power {


  font-size: 28px; font-weight: bold; line-height: 1;


  background: #000000cc; padding: 3px 7px; border-radius: 5px;


}


.cell-name   { display: none; } /* name shown in tooltip only — too small on board */


.tier-badge  { position: absolute; top: 5px; right: 6px; font-size: 9px; font-weight: bold; opacity: 0.45; z-index: 2; }


.ability-tag { position: absolute; bottom: 5px; left: 6px; font-size: 7px; letter-spacing: 1px; opacity: 0.6; white-space: nowrap; z-index: 2; }


/* Tier dot indicators — replace border color as tier signal */


.tier-dots { position: absolute; top: 6px; left: 6px; display: flex; gap: 3px; z-index: 2; }


.tier-dot  { width: 7px; height: 7px; border-radius: 50%; display: inline-block; box-shadow: 0 0 4px currentColor; }





/* HAND CARD -- card art as background, overlay shows stats */


.hand-card {


  width: 122px; height: 148px; border-radius: 6px; position: relative;


  cursor: pointer; flex-shrink: 0; overflow: hidden;


  /* Slightly brighter dark background so card art is more visible */


  background-color: #10101e;


  background-size: cover;


  background-position: center top;


  border: 1px solid #555;


  transition: transform 0.15s, box-shadow 0.15s;


}


/* Subtle dark overlay for readability, over the art */


.hand-card::before {


  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;


  background: linear-gradient(to top, #00000088 0%, #00000033 50%, transparent 100%);


}


/* All stat text floats above the overlay */


.hand-card .hc-e-n, .hand-card .hc-e-s, .hand-card .hc-e-w, .hand-card .hc-e-e,


.hand-card .hc-center, .hand-card .hc-tier-badge, .hand-card .hc-ability-tag {


  position: absolute; z-index: 2;


}


.hand-card:hover  { transform: translateY(-8px); }


.hand-card.selected { transform: translateY(-14px); }


.hand-card.used   { opacity: 0.18; cursor: default; pointer-events: none; }


.hand-card.tier-blocked { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.8); pointer-events: none; }





/* Hand card edge labels in cardinal positions */


.hc-e-n { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; background:rgba(0,0,0,0.72); border-radius:50%; min-width:22px; text-align:center; padding:2px 3px; }


.hc-e-s { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; background:rgba(0,0,0,0.72); border-radius:50%; min-width:22px; text-align:center; padding:2px 3px; }


.hc-e-w { position: absolute; left: 5px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; background:rgba(0,0,0,0.72); border-radius:50%; min-width:22px; text-align:center; padding:2px 3px; }


.hc-e-e { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #00ffcc; background:rgba(0,0,0,0.72); border-radius:50%; min-width:22px; text-align:center; padding:2px 3px; }





/* Hand card center block */


.hc-center {


  position: absolute;


  top: 50%; left: 50%;


  transform: translate(-50%, -50%);


  display: flex; flex-direction: column; align-items: center; gap: 2px;


}


.hc-power-center { font-size: 20px; font-weight: bold; line-height: 1; color: #00ffcc; }


.hc-name-small   { font-size: 7px; letter-spacing: 1px; opacity: 0.55; color: #00ffcc; }





/* Hand card badges */


.hc-tier-badge   { position: absolute; top: 3px; right: 5px; font-size: 9px; font-weight: bold; opacity: 0.4; color: #00ffcc; }


.hc-ability-tag  { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 7px; letter-spacing: 1px; opacity: 0.55; color: #00ffcc; white-space: nowrap; }





/* .bti: see definition above */





/* FLASH popup on comparison */


.flash {


  position: absolute;


  z-index: 20; pointer-events: none;


  font-size: 10px; letter-spacing: 1px; padding: 3px 8px;


  border-radius: 3px; font-weight: bold;


  animation: flashFade 1.8s ease forwards;


}


@keyframes flashFade {


  0%   { opacity:1; transform:translateY(0) scale(1); }


  60%  { opacity:1; transform:translateY(-10px) scale(1.05); }


  100% { opacity:0; transform:translateY(-20px) scale(0.9); }


}





/* AMBUSH / STONEWALL hit flash */


@keyframes ambushHit {


  0%   { box-shadow: 0 0 0 3px #cc44ff, 0 0 22px #cc44ff88, inset 0 0 18px #cc44ff44; border-color: #cc44ff !important; }


  50%  { box-shadow: 0 0 0 5px #ff0088, 0 0 36px #ff008888, inset 0 0 28px #ff008844; border-color: #ff0088 !important; }


  100% { box-shadow: none; border-color: inherit; }


}


.ambush-hit {


  animation: ambushHit 0.8s ease forwards !important;


}





/* LOG — hidden, board takes full width */


.log-panel {


  display: none !important;


}


.log-title { font-size: 9px; color: #444; letter-spacing: 2px; margin-bottom: 8px; }


.log-entries { flex:1; overflow:hidden; display:flex; flex-direction:column-reverse; gap:4px; }


.log-entry { font-size: 9px; color:#555; letter-spacing:0.5px; line-height:1.4; padding:3px 5px; border-left:2px solid #1a1a2e; }


.log-entry.system  { color:#666; border-left-color:#333; }


.log-entry.player  { color:#00ffcc99; border-left-color:#00ffcc44; }


.log-entry.ai      { color:#ff008099; border-left-color:#ff008044; }


.log-entry.compare { color:#aaa; border-left-color:#333; }


.log-entry.shield  { color:#aaaaff99; border-left-color:#aaaaff44; }





/* PLAYER AREA — column: portrait strip above, hand cards below */


.player-area {


  background: transparent; border-top: 1px solid #0a0a1a44;


  padding: 2px 14px 8px;  /* reduced top gap */


  overflow: visible;


  display: flex; flex-direction: column; align-items: center;


  gap: 5px; flex-shrink: 0;


}


.player-portrait {


  display: flex; align-items: center; justify-content: center; gap: 8px;


  background: transparent; padding: 1px 0;


  width: 100%; flex-shrink: 0;


}


.player-avatar {


  width: 80px; height: 80px; flex-shrink: 0;


  background: linear-gradient(135deg, #0d2a1a, #0a1820);


  border: 1px solid #00ffcc44; border-radius: 5px;


  display: flex; align-items: center; justify-content: center; font-size: 32px;


  overflow: hidden;


}


.player-name  { color: #00ffcc; font-size: 10px; letter-spacing: 2px; }


.player-sub   { color: #444; font-size: 8px; letter-spacing: 1px; margin-top: 2px; }


/* HAND: column layout — card tray on top, tier nav below */


.hand-cards {


  display: flex; flex-direction: row; align-items: flex-end;


  gap: 14px; overflow-x: auto; overflow-y: visible;


  max-width: 100%; padding: 10px 4px 6px;


  scrollbar-width: thin; scrollbar-color: #2a2a3a transparent;


}


.hand-cards::-webkit-scrollbar { height: 3px; }


.hand-cards::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }


.tier-pill {


  display: flex; flex-direction: column; align-items: center; justify-content: center;


  gap: 4px; width: 64px; height: 52px; border-radius: 8px;


  cursor: pointer; transition: all 0.2s; flex-shrink: 0; position: relative;


  background: #06050e; border: 1px solid #1a1a28; user-select: none;


}


.tier-pill:hover { border-color: #2a2a3a; background: #0a0916; }


.tier-pill.active { background: #0a0a1e; }


.tier-pill.locked { opacity: 0.3; cursor: default; pointer-events: none; }


.tier-pill-dots { display: flex; gap: 3px; }


.tier-pill-dot { width: 8px; height: 8px; border-radius: 50%; }


.tier-pill-label { font-size: 8px; letter-spacing: 2px; font-family: 'Courier New', monospace; }


.tier-pill-count {


  position: absolute; top: -6px; right: -6px;


  background: #0a0a18; border-radius: 10px; padding: 1px 5px;


  font-size: 9px; font-weight: bold; font-family: 'Courier New', monospace;


  border: 1px solid #2a2a3a; min-width: 18px; text-align: center;


}


@keyframes tierPillFlash {


  0%,100% { box-shadow: none; }


  50%     { box-shadow: 0 0 16px var(--tp-col,#44cc66), 0 0 0 2px var(--tp-col,#44cc66); }


}


.tier-pill.new-unlock { animation: tierPillFlash 0.55s ease 3; }





/* Card pop-in: newly eligible cards fly in from below */


@keyframes cardPopIn {


  0%   { transform: scale(0.3) translateY(32px) rotate(-4deg); opacity: 0; }


  55%  { transform: scale(1.1) translateY(-6px) rotate(1.5deg); opacity: 1; }


  80%  { transform: scale(0.97) translateY(2px) rotate(0deg); }


  100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }


}


.hand-card.card-pop-in {


  animation: cardPopIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;


}


/* Locked card count badge at end of hand */


.hand-locked-badge {


  display: flex; flex-direction: column; align-items: center; justify-content: center;


  width: 36px; height: 140px; border-radius: 6px;


  background: #05050e; border: 1px dashed #1a1a28;


  flex-shrink: 0; gap: 5px; cursor: default;


  opacity: 0.7;


}





/* DRAG CARD -- follows cursor */


#dragCard {


  position: fixed;


  pointer-events: none;


  z-index: 999;


  width: 100px;


  height: 130px;


  border-radius: 5px;


  background: linear-gradient(145deg, #0c2e1e, #092028);


  border: 2px solid #00ffcc;


  box-shadow: 0 0 20px #00ffcc66, 0 0 40px #00ffcc22;


  display: none;


}


/* Drag card edge labels */


.dc-e-n { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; color: #ffffff; }


.dc-e-s { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }


.dc-e-w { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }


.dc-e-e { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: bold; color: #00ffcc; }


.dc-center {


  position: absolute;


  top: 50%; left: 50%;


  transform: translate(-50%, -50%);


  display: flex; flex-direction: column; align-items: center; gap: 2px;


}


.dc-power { font-size: 22px; font-weight: bold; line-height: 1; color: #ffffff; }


.dc-name  { font-size: 7px; letter-spacing: 1px; opacity: 0.6; color: #ffffff; }


.dc-tier  { position: absolute; top: 4px; right: 6px; font-size: 9px; font-weight: bold; opacity: 0.4; color: #ffffff; }





/* WIN OVERLAY */


.overlay { display:none; position:fixed; inset:0; background:#000000cc;


  align-items:center; justify-content:center; flex-direction:column; gap:20px; z-index:100; }


.overlay.show { display:flex; }


.overlay-title { font-size:36px; letter-spacing:6px; font-weight:bold; }

.btn-restart {

  padding:10px 30px; font-family:inherit; font-size:11px; letter-spacing:3px;


  cursor:pointer; border-radius:3px; margin-top:10px; transition:background 0.2s;


}


.btn-restart:hover { background:#1a3a26; }





@keyframes badgeFlip {


  0%   { transform: rotateY(0deg) scale(1); }


  40%  { transform: rotateY(90deg) scale(1.1); }


  60%  { transform: rotateY(-90deg) scale(1.1); }


  100% { transform: rotateY(0deg) scale(1); }


}


.badge-flip { animation: badgeFlip 0.45s ease-in-out; }





/* TOOLTIP — shiny, tier-color-driven */


@keyframes tipGlow {


  0%,100% { box-shadow: 0 0 0 1px var(--tc-dim,#8855ff33), 0 24px 64px #000000cc, 0 0 22px var(--tc-glow,#8855ff18); }


  50%     { box-shadow: 0 0 0 2px var(--tc-dim,#8855ff44), 0 24px 64px #000000cc, 0 0 52px var(--tc-glow,#8855ff28); }


}


@keyframes tipScan {


  0%   { transform: translateY(-110%); }


  100% { transform: translateY(350%); }


}


@keyframes tipShineSwipe {


  0%   { transform: translateX(-200%) skewX(-18deg); opacity:0; }


  20%  { opacity: 1; }


  80%  { opacity: 1; }


  100% { transform: translateX(400%) skewX(-18deg); opacity:0; }


}


.tooltip {


  --tc: #8855ff; --tc-dim: #8855ff33; --tc-glow: #8855ff18;


  display:none; position:fixed;


  background: linear-gradient(148deg, #0e0c24 0%, #07070f 55%, #0b0916 100%);


  border: 1px solid var(--tc);


  border-radius:10px; padding:0;


  font-size:13px; color:#e0e0e0; letter-spacing:0.2px; line-height:1.6;

  font-family: Inter, system-ui, -apple-system, sans-serif;


  z-index:9500; pointer-events:none; width:250px; max-height:65vh;


  animation: tipGlow 2.5s ease-in-out infinite;


  overflow:hidden;


}


.tip-shine-layer {


  position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:10px; z-index:2;


}


.tip-shine-layer::before {


  content:''; position:absolute; top:0; left:0; width:50px; height:200%;


  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);


  animation: tipShineSwipe 4s ease-in-out infinite 1s;


}


.tip-body { position:relative; z-index:3; }


@keyframes errGlow {


  0%,100% { box-shadow: 0 0 0 1px #ff333322, 0 16px 40px #000000cc, 0 0 18px #ff333318; }


  50%     { box-shadow: 0 0 0 2px #ff333344, 0 16px 40px #000000cc, 0 0 36px #ff333328; }


}


.tip-error {


  display:none; position:fixed;


  background: linear-gradient(148deg, #1c0808 0%, #0d0505 60%);


  border:1px solid #ff333366;


  border-radius:10px; padding:0;


  z-index:9500; pointer-events:none; min-width:180px; max-width:240px;


  animation: errGlow 2.5s ease-in-out infinite;


  overflow:hidden; font-family:'Courier New',monospace;


}





/* Tooltip redesign — wide portrait card layout */

/* Tier indicator dots — upper-left of each empty cell, always visible */

.cell.valid .tri-d.green { background: #44cc66cc; }


.cell.valid .tri-plus    { color: #44cc66cc; }

/* ── TABLET (600px – 900px) ── */


@media (max-width: 900px) {

    grid-template-columns: repeat(7, 72px);


    grid-template-rows:    repeat(5, 96px);

  .edge.s { bottom: 4px; }

  /* AI avatar */

  /* Header font */


  .title { font-size: 12px; letter-spacing: 3px; }

  .ai-portrait { padding: 5px 8px; min-width: 140px; }





  /* Player area */


  .player-area { padding: 6px 14px; gap: 8px; }


  .player-portrait { padding: 5px 8px; min-width: 130px; left: 14px; bottom: 6px; }


  .player-avatar { width: 60px; height: 60px; font-size: 24px; }





  /* Board direction row */


  .board-dir-row { max-width: none; padding: 0 64px 0 0; }


  .dir-lbl { font-size: 8px; }


}





/* ── MOBILE (< 600px) ── */


@media (max-width: 599px) {





  body { overflow-y: auto; height: auto; }

  /* Cell edges */

  .tooltip { max-width: min(260px, 90vw); font-size: 11px; }





  /* Game menu */


  #gameMenu { min-width: 180px !important; }

function initRaceTheme() {


  const params   = new URLSearchParams(window.location.search);


  const raceId   = params.get('race') || 'terran';


  const allRaces = Object.keys(RACE_DATA);


  // Persist AI race across refreshes — only randomize on first visit or change deck


  let aiRaceId = sessionStorage.getItem('gz_ai_race');


  if (!aiRaceId || aiRaceId === raceId) {


    aiRaceId = allRaces.filter(r => r !== raceId)[Math.floor(Math.random() * (allRaces.length - 1))];


    sessionStorage.setItem('gz_ai_race', aiRaceId);


  }





  const player = RACE_DATA[raceId]   || RACE_DATA.terran;


  const ai     = RACE_DATA[aiRaceId] || RACE_DATA.entropy;





  // Apply lore backgrounds to fixed full-screen top/bottom divs


  const topBg = document.getElementById('game-top-bg');


  const botBg = document.getElementById('game-bottom-bg');


  if (topBg) { topBg.style.backgroundImage = `url('${ai.loreBg}')`; topBg.style.opacity = '0.95'; }


  if (botBg) { botBg.style.backgroundImage = `url('${player.loreBg}')`; botBg.style.opacity = '0.95'; }


  // Remove background from ai-area and player-area


  const aiBar = document.querySelector('.ai-area');


  const playerBar = document.querySelector('.player-area');


  if (aiBar) aiBar.style.backgroundImage = '';


  if (playerBar) playerBar.style.backgroundImage = '';





  // Panels removed — portraits live in ai-area/player-area headers





  // Update player color throughout


  const pColor = player.color;


  document.documentElement.style.setProperty('--player-color', pColor);





  // Update player portrait — avatar image + labels


  const pAvEl = document.querySelector('.player-avatar');


  if (pAvEl) {


    pAvEl.innerHTML = player.avatarImg


      ? `<img src="${player.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`


      : player.avatar;


    pAvEl.style.borderColor = player.color + '88';


  }


  const pNameEl = document.querySelector('.player-name');


  const pTitleEl = document.querySelector('.player-sub');


  if (pNameEl)  { pNameEl.textContent = player.name; pNameEl.style.color = player.color; }


  if (pTitleEl) pTitleEl.textContent = player.sub;





  const aiAvEl = document.querySelector('.ai-avatar');


  const aiNmEl = document.querySelector('.ai-name');


  const aiSubEl = document.querySelector('.ai-sub');


  if (aiAvEl) {


    // Use generated avatar portrait image if available


    aiAvEl.innerHTML = ai.avatarImg


      ? `<img src="${ai.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;">`


      : ai.avatar;


    aiAvEl.style.borderColor = ai.color + '88';


  }


  if (aiNmEl)  { aiNmEl.textContent = ai.name; aiNmEl.style.color = ai.color; }


  if (aiSubEl) aiSubEl.textContent = ai.sub;


  const aiQuoteEl = document.getElementById('aiQuote');


  if (aiQuoteEl) aiQuoteEl.textContent = ai.quote;





  // Store short faction names (first 2 words) for score badge display


  const playerWords = player.name.replace(/^THE /, '').split(' ');


  const aiWords     = ai.name.replace(/^THE /, '').split(' ');


  window.playerFactionName  = playerWords.slice(0, 2).join(' ');


  window.aiFactionName      = aiWords.slice(0, 2).join(' ');


  window.playerRaceId       = raceId;


  window.aiRaceId           = aiRaceId;


  window.playerAvatarImg    = player.avatarImg || `assets/avatars/${raceId}.png`;


  window.aiAvatarImg        = ai.avatarImg     || `assets/avatars/${aiRaceId}.png`;





  // Safe zone bar colors — CSS custom properties on :root


  document.documentElement.style.setProperty('--player-safe-col', player.color + 'bb');


  document.documentElement.style.setProperty('--ai-safe-col',     ai.color     + 'bb');





  // Seed faction HUD immediately


  const sbAi = document.getElementById('sbAiAvatar');


  const sbPl = document.getElementById('sbPlayerAvatar');


  if (sbAi) sbAi.src = ai.avatarImg || `assets/avatars/${aiRaceId}.png`;


  if (sbPl) sbPl.src = player.avatarImg || `assets/avatars/${raceId}.png`;


  const sbAN = document.getElementById('sbAiName');


  const sbPN = document.getElementById('sbPlayerName');


  if (sbAN) { sbAN.textContent = aiWords.slice(0,2).join(' '); sbAN.style.color = ai.color+'bb'; }


  if (sbPN) { sbPN.textContent = playerWords.slice(0,2).join(' '); sbPN.style.color = player.color+'bb'; }





  // Update faction labels below avatars


  const aiFactionLbl = document.getElementById('aiFactionLabel');


  const playerFactionLbl = document.getElementById('playerFactionLabel');


  if (aiFactionLbl) { aiFactionLbl.textContent = window.aiFactionName; aiFactionLbl.style.color = ai.color + '88'; }


  if (playerFactionLbl) { playerFactionLbl.textContent = window.playerFactionName; playerFactionLbl.style.color = player.color + '88'; }





  // Store faction colors globally for use in renderGrid


  window.playerFactionColor = player.color;


  window.aiFactionColor     = ai.color;





  window.aiDifficulty = new URLSearchParams(window.location.search).get('difficulty') || 'balanced';


  return { player, ai, raceId, aiRaceId };


}

// ── H/V BATTLE SCORING ────────────────────────


// Each card fights in 2 directions independently.


// WIN   = power counts for that row/col


// LOSE  = power does NOT count (show ✗)


// TIE   = both cards cancel, neither counts (show ✗ on both)


// NONE  = uncontested, always counts





function computeBattleResults() {


  // Use win/loss COUNTERS per axis — handles sandwiched cards correctly.


  // A card winning one V but losing another gets net=0 → no contribution (floor(½)).


  const b = Array(5).fill(null).map(() =>


    Array(7).fill(null).map(() => ({ hW:0, hL:0, vW:0, vL:0 }))


  );





  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (!cell.card) continue;





      // H battle: this cell vs East neighbor


      if (c < 6) {


        const east = G.grid[r][c+1];


        if (east.card && east.owner !== cell.owner && cell.owner !== "hazard" && east.owner !== "hazard") {


          const surgeBonus = (cell.card.ability === 'surge' && G.surgeTrigger?.[cell.owner]) ? 3 : 0;


          const _aiBuff = (window.aiDifficulty==='aggressive' && cell.owner==='ai') ? 1.1 : 1.0;


          if (cell.card.ability === 'cloak') cell.card.cloakRevealed = true;


          if (east.card.ability === 'cloak') east.card.cloakRevealed = true;


          const me = Math.round((cell.card.edges.e + (cell.card.edgeMod?.e || 0) + surgeBonus) * _aiBuff);


          const them = (east.card.edges.w + (east.card.edgeMod?.w || 0));


          const pierce = cell.card.ability === 'pierce';


          const pierceThem = east.card.ability === 'pierce';


          if (me > them || (me === them && pierce && !pierceThem)) {


            b[r][c].hW++;


            const hMargin = me - them;


            // OVERWHELM: H win by 3+ → bonus V win


            if (cell.card.ability === 'overwhelm' && hMargin >= 3) b[r][c].vW++;


            if (east.card.ability === 'shield' && !east.card.shieldExpended) {


              east.card.shieldExpended = true;


              east.card.shieldBlockH = true; // permanently block H losses


            }


            if (!east.card.shieldBlockH) b[r][c+1].hL++;


            // DOUBLE STRIKE 2nd hit at half strength


            if (cell.card.ability === 'double_strike' && c < 5) {


              const far = G.grid[r][c+2];


              if (far.card && far.owner !== cell.owner) {


                const me2 = Math.max(1, Math.floor(me / 2));


                if (me2 > (far.card.edges.w + (far.card.edgeMod?.w||0))) b[r][c+2].hL++;


              }


            }


          } else if (them > me || (me === them && pierceThem && !pierce)) {


            b[r][c+1].hW++;


            const hMargin = them - me;


            // OVERWHELM on east card


            if (east.card.ability === 'overwhelm' && hMargin >= 3) b[r][c+1].vW++;


            if (cell.card.ability === 'shield' && !cell.card.shieldExpended) {


              cell.card.shieldExpended = true;


              cell.card.shieldBlockH = true; // permanently block H losses


            }


            if (!cell.card.shieldBlockH) b[r][c].hL++;


            if (east.card.ability === 'double_strike' && c > 0) {


              const far = G.grid[r][c-1];


              if (far.card && far.owner !== east.owner) {


                const me2 = Math.max(1, Math.floor(them / 2));


                if (me2 > (far.card.edges.e + (far.card.edgeMod?.e||0))) b[r][c-1].hL++;


              }


            }


          } else { b[r][c].hL++; b[r][c+1].hL++; } // tie = neither wins


        }


      }





      // V battle: this cell vs South neighbor


      if (r < 4) {


        const south = G.grid[r+1][c];


        if (south.card && south.owner !== cell.owner && cell.owner !== "hazard" && south.owner !== "hazard") {


          if (cell.card.ability === 'cloak')  cell.card.cloakRevealed = true;


          if (south.card.ability === 'cloak') south.card.cloakRevealed = true;


          const surgeVBonus  = (cell.card.ability === 'surge'  && G.surgeTrigger?.[cell.owner])  ? 3 : 0;


          const surgeVBonusS = (south.card.ability === 'surge' && G.surgeTrigger?.[south.owner]) ? 3 : 0;


          const me = (cell.card.edges.s + (cell.card.edgeMod?.s || 0) + surgeVBonus);


          const them = (south.card.edges.n + (south.card.edgeMod?.n || 0) + surgeVBonusS);


          if (me > them) {


            b[r][c].vW++;


            const margin = me - them;


            // OVERWHELM: win by 3+ → bonus win on H axis too


            if (cell.card.ability === 'overwhelm' && margin >= 3) b[r][c].hW++;


            // SHIELD V: south card blocks first V loss — permanently


            if (south.card.ability === 'shield' && !south.card.shieldExpended) {


              south.card.shieldExpended = true;


              south.card.shieldBlockV = true;


            }


            if (!south.card.shieldBlockV) b[r+1][c].vL++;


            // DOUBLE STRIKE downward at half strength


            if (cell.card.ability === 'double_strike' && r < 3) {


              const far = G.grid[r+2][c];


              if (far.card && far.owner !== cell.owner) {


                const me2 = Math.max(1, Math.floor(me / 2));


                if (me2 > (far.card.edges.n + (far.card.edgeMod?.n||0))) b[r+2][c].vL++;


              }


            }


          } else if (me < them) {


            b[r+1][c].vW++;


            const margin = them - me;


            // OVERWHELM on south card


            if (south.card.ability === 'overwhelm' && margin >= 3) b[r+1][c].hW++;


            // SHIELD V: cell (north card) blocks first V loss — permanently


            if (cell.card.ability === 'shield' && !cell.card.shieldExpended) {


              cell.card.shieldExpended = true;


              cell.card.shieldBlockV = true;


            }


            if (!cell.card.shieldBlockV) b[r][c].vL++;


            // DOUBLE STRIKE upward at half strength


            if (south.card.ability === 'double_strike' && r > 0) {


              const far = G.grid[r-1][c];


              if (far.card && far.owner !== south.owner) {


                const me2 = Math.max(1, Math.floor(them / 2));


                if (me2 > (far.card.edges.s + (far.card.edgeMod?.s||0))) b[r-1][c].vL++;


              }


            }


          } else { b[r][c].vL++; b[r+1][c].vL++; } // tie = neither wins


        }


      }


    }


  }





  // ── EDGE PLAY: border cards fight opposite-edge enemies (wrap) ────────


  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (!cell.card || cell.card.ability !== 'edge_play') continue;


      const thisOwner = cell.owner;


      // West border: wrap fight with col 6


      // Far card gets no hL — the battle is invisible to it (non-local VP rule)


      if (c === 0) {


        const opp = G.grid[r][6];


        if (opp.card && opp.owner !== thisOwner) {


          const me = cell.card.edges.w + (cell.card.edgeMod?.w||0);


          const them = opp.card.edges.e + (opp.card.edgeMod?.e||0);


          if (me > them) { b[r][c].hW++; }           // edge_play wins, far card unaffected


          else if (me < them) { b[r][c].hL++; }      // edge_play loses, far card unaffected


        }


      }


      // East border: wrap fight with col 0


      if (c === 6) {


        const opp = G.grid[r][0];


        if (opp.card && opp.owner !== thisOwner) {


          const me = cell.card.edges.e + (cell.card.edgeMod?.e||0);


          const them = opp.card.edges.w + (opp.card.edgeMod?.w||0);


          if (me > them) { b[r][c].hW++; }


          else if (me < them) { b[r][c].hL++; }


        }


      }


      // North border: wrap fight with row 4


      if (r === 0) {


        const opp = G.grid[4][c];


        if (opp.card && opp.owner !== thisOwner) {


          const me = cell.card.edges.n + (cell.card.edgeMod?.n||0);


          const them = opp.card.edges.s + (opp.card.edgeMod?.s||0);


          if (me > them) { b[r][c].vW++; }


          else if (me < them) { b[r][c].vL++; }


        }


      }


      // South border: wrap fight with row 0


      if (r === 4) {


        const opp = G.grid[0][c];


        if (opp.card && opp.owner !== thisOwner) {


          const me = cell.card.edges.s + (cell.card.edgeMod?.s||0);


          const them = opp.card.edges.n + (opp.card.edgeMod?.n||0);


          if (me > them) { b[r][c].vW++; }


          else if (me < them) { b[r][c].vL++; }


        }


      }


    }


  }





  // ── Derive h/v strings from net counters (net win rule) ──────────────


  // H: win if hW > hL; lose if hL > hW; tie if equal but > 0; none if both 0


  // V: same. Win one / lose one = tie = 0 contribution (floor of ½ power).


  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const bb = b[r][c];


      bb.h = bb.hW > bb.hL ? 'win'


           : bb.hL > bb.hW ? 'lose'


           : (bb.hW > 0)   ? 'tie'


           : 'none';


      bb.v = bb.vW > bb.vL ? 'win'


           : bb.vL > bb.vW ? 'lose'


           : (bb.vW > 0)   ? 'tie'


           : 'none';


    }


  }


  return b;


}





function computeScores() {


  const battles = computeBattleResults();


  // Store on grid for rendering


  for (let r = 0; r < 5; r++)


    for (let c = 0; c < 7; c++)


      if (G.grid[r][c].card) G.grid[r][c].battle = battles[r][c];





  const rows = Array(5).fill(null).map(() => ({ p:0, a:0 }));


  const cols = Array(7).fill(null).map(() => ({ p:0, a:0 }));





  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (!cell.card) continue;


      // STONEWALL: this card or victim contributes 0 VP


      if (cell.card.stonewalled || cell.card.stonewall_victim) continue;


      // SNIPER: sniped card contributes 0 VP


      if (cell.card.sniped) continue;


      const bat = battles[r][c];


      const countsH = bat.h === 'win' || bat.h === 'none';


      const countsV = bat.v === 'win' || bat.v === 'none';


      // DENSITY: 1.5x power


      const basePower = cell.card.ability === 'density'


        ? Math.ceil(cell.card.power * 1.5) : cell.card.power;


      // COSMIC HAZARD penalty: -2 per adjacent hazard card


      const _adjHazards = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}]


        .filter(({dr,dc}) => { const rr=r+dr,cc=c+dc; return rr>=0&&rr<5&&cc>=0&&cc<7&&G.grid[rr][cc].owner==='hazard'; }).length;


      const effPower = Math.max(0, basePower - _adjHazards * 2);


      if (countsH) { if (cell.owner==='player') rows[r].p += effPower; else rows[r].a += effPower; }


      if (countsV) { if (cell.owner==='player') cols[c].p += effPower; else cols[c].a += effPower; }


    }


  }





  // Who wins each row/col (for badge coloring + chip display)


  let rowResults = rows.map(r => r.p > r.a ? 'p' : r.a > r.p ? 'a' : 'tie');


  let colResults = cols.map(c => c.p > c.a ? 'p' : c.a > c.p ? 'a' : 'tie');





  // DECIDING FACTOR: player ties become player wins


  for (let r = 0; r < 5; r++) {


    if (rowResults[r] === 'tie') {


      const hasDf = G.grid[r].some(cell => cell.card && cell.owner === 'player' && cell.card.ability === 'deciding_factor' && !cell.card.stonewalled && !cell.card.sniped);


      if (hasDf) { rowResults[r] = 'p'; continue; }


      const hasAiDfRow = G.grid[r].some(cell => cell.card && cell.owner === 'ai' && cell.card.ability === 'deciding_factor' && !cell.card.stonewalled && !cell.card.sniped);


      if (hasAiDfRow) rowResults[r] = 'a';


    }


  }


  for (let c = 0; c < 7; c++) {


    if (colResults[c] === 'tie') {


      let hasDf = false;


      for (let r = 0; r < 5; r++) {


        const cell = G.grid[r][c];


        if (cell.card && cell.owner === 'player' && cell.card.ability === 'deciding_factor' && !cell.card.stonewalled && !cell.card.sniped) { hasDf = true; break; }


      }


      if (hasDf) colResults[c] = 'p';


    // AI DECIDING_FACTOR


    let hasAiDf3 = false;


    for (let _r3=0; _r3<5; _r3++) {


      const _c2 = G.grid[_r3][c];


      if (_c2.card && _c2.owner==='ai' && _c2.card.ability==='deciding_factor' && !_c2.card.stonewalled && !_c2.card.sniped) hasAiDf3 = true;


    }


    if (hasAiDf3 && colResults[c]==='tie') colResults[c] = 'a';


    }


  }





  // Net VP scoring: winner earns (their power − loser power) for each line


  let pWins = 0, aWins = 0;


  rowResults.forEach(r => { if(r==='p')pWins++; if(r==='a')aWins++; });


  colResults.forEach(c => { if(c==='p')pWins++; if(c==='a')aWins++; });





  // Delta scoring: winner gets (their power - loser power) per line


  let pVP = 0, aVP = 0;


  rows.forEach((row, ri) => {


    const net = row.p - row.a;


    if (net > 0) pVP += net;


    else if (net < 0) aVP += (-net);


  });


  cols.forEach((col, ci) => {


    const net = col.p - col.a;


    if (net > 0) pVP += net;


    else if (net < 0) aVP += (-net);


  });





  // Snapshot results before DECIDING_FACTOR mutates them — ECHO must use raw wins


  const rawRowResults = rowResults.slice();


  const rawColResults = colResults.slice();





  // ECHO: player card with echo in a row AND col both won → count its power again


  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (!cell.card || cell.owner !== 'player' || cell.card.ability !== 'echo') continue;


      if (cell.card.stonewalled || cell.card.stonewall_victim || cell.card.sniped) continue;


      if (rawRowResults[r] === 'p' && rawColResults[c] === 'p') {


        pVP += cell.card.power; // count once more (double total)


      }


    }


  }


  // AI ECHO too


  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (!cell.card || cell.owner !== 'ai' || cell.card.ability !== 'echo') continue;


      if (cell.card.stonewalled || cell.card.stonewall_victim || cell.card.sniped) continue;


      if (rawRowResults[r] === 'a' && rawColResults[c] === 'a') {


        aVP += cell.card.power;


      }


    }


  }





  return { rows, cols, rowResults, colResults, pWins, aWins, pVP, aVP };


}

    const el = document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if (el) mkOverlay(el);
  });
}

                else if (dr===-1) badge.style.cssText+=`bottom:4px;left:50%;transform:translateX(-50%);`;

                else              badge.style.cssText+=`right:4px;top:50%;transform:translateY(-50%);`;


                const labelCol = result==='tie'?'#ffee44':col; // bright yellow for TIE


                badge.innerHTML = `


                  <span style="font-size:10px;font-weight:bold;color:${labelCol};letter-spacing:1px;">${result.toUpperCase()}</span>


                  <span style="font-size:8px;color:${col}bb;">${myVal}v${theirVal}</span>`;


                adjEl.appendChild(badge);


              });


              // Hazard adjacency warning


              const _hzDirs = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}]


                .filter(({dr,dc})=>{const hr=_pRow+dr,hc=_pCol+dc;return hr>=0&&hr<5&&hc>=0&&hc<7&&G.grid[hr][hc].owner==='hazard';});


              if (_hzDirs.length > 0) {


                const wb = document.createElement('div');


                wb.dataset.bpv = '1';


                wb.style.cssText = 'position:absolute;z-index:14;top:4px;left:50%;transform:translateX(-50%);pointer-events:none;background:#1a0800;border:1px solid #ff660099;border-radius:4px;padding:3px 8px;font-family:\'Courier New\',monospace;white-space:nowrap;';


                wb.innerHTML = '<span style="font-size:9px;color:#ff8800;font-weight:bold;letter-spacing:1px;">⚠ HAZARD -2VP</span>';


                div.appendChild(wb);


                _hzDirs.forEach(({dr,dc})=>{


                  const hz=document.querySelector(`.cell[data-r="${_pRow+dr}"][data-c="${_pCol+dc}"]`);


                  if (hz) { hz.dataset.hzglow='1'; hz.style.boxShadow='0 0 36px #ff660099,inset 0 0 20px #ff440055'; }


                });


              }


            };


            div.onmouseleave = () => {


              document.querySelectorAll('.cell.future-valid').forEach(el => el.classList.remove('future-valid'));


              document.querySelectorAll('.bpv-win,.bpv-lose,.bpv-tie').forEach(el => {


                el.classList.remove('bpv-win','bpv-lose','bpv-tie');


              });


              document.querySelectorAll('[data-bpv]').forEach(el => el.remove());


              document.querySelectorAll('[data-hzglow]').forEach(el => {


                el.removeAttribute('data-hzglow');


                el.style.boxShadow = '0 0 18px #ff440066, inset 0 0 12px #ff220022';


              });


            };


          }


        } else if (G.selectedCard) {


          // Show red tooltip explaining WHY this cell is invalid


          div.style.cursor = 'not-allowed';


          const _r = r, _c = c, _card = G.selectedCard;


          div.onmouseenter = ev => {


            const tier = _card.tier;


            let reason = 'No friendly card adjacent — place next to your cards';


            if (G.grid[_r]?.[_c]?.owner) {


              reason = 'Cell is occupied';


            } else if (tier === 'I' && _r !== 4) {


              reason = 'Tier I: your home row only (bottom row)';


            } else if (tier !== 'I' && _r === 4) {


              reason = 'Tier II+ cannot go in your home row';


            } else if (_r === 0) {


              reason = 'Enemy home row — no placement allowed here';


            } else if (tier !== 'I' && (_r === 4 || _r === 0)) {


              reason = 'Tier II+: battle zone only (rows 1–3)';


            }


            showErrorTip(ev, reason);


          };


          div.onmouseleave = hideTip;


        }


      }


      el.appendChild(div);


    }


  }





  // Battle comparison indicators in gaps


  renderBattleIndicators(el);


}





function ab(a) {


  return {


    shield:'SHD', phantom:'PHT', chain:'CHN', double_strike:'DBL',


    intimidate:'INT', mirror:'MRR', ambush:'AMB', stonewall:'STW',


    sniper:'SNP', birthright:'BRT', deciding_factor:'DF', echo:'ECH',


    overwhelm:'OVR', density:'DNS', hat_trick:'HAT', edge_play:'EPY',


    boost:'BST', commander:'CMD', sweep:'SWP', flank:'FLK',


    rush:'RSH', pierce:'PRC', spawn:'SPN', surge:'SRG'


  }[a] || (a ? a.slice(0,3).toUpperCase() : '');


}





function renderBattleIndicators(el) {


  const CHIP = 40; // chip diameter px


  const pAvg = window.playerAvatarImg || '';


  const aAvg = window.aiAvatarImg    || '';


  const pCol = window.playerFactionColor || '#00ffcc';


  const aCol = window.aiFactionColor     || '#ff0080';


  const pName= window.playerFactionName  || 'YOU';


  const aName= window.aiFactionName      || 'AI';





  const pairs = [


    { dr:0, dc:1, myE:'e', theirE:'w', axis:'h',


      label: (c) => `E → W`,


      // center in horizontal gap: x = c*CS_W + 114 + 3, y = r*CS_H + 76


      chipX: (r,c) => c*CS_W + 124 + 3 - CHIP/2,


      chipY: (r,c) => r*CS_H + 76 - CHIP/2 },


    { dr:1, dc:0, myE:'s', theirE:'n', axis:'v',


      label: (c) => `S → N`,


      // center in vertical gap: x = c*CS_W + 57, y = r*CS_H + 152 + 3


      chipX: (r,c) => c*CS_W + 62 - CHIP/2,


      chipY: (r,c) => r*CS_H + 152 + 3 - CHIP/2 },


  ];





  for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) {


    const cell = G.grid[r][c];


    if (!cell.card) continue;





    for (const d of pairs) {


      const nr = r+d.dr, nc = c+d.dc;


      if (nr<0||nr>=5||nc<0||nc>=7) continue;


      const nb = G.grid[nr][nc];


      if (!nb.card || nb.owner === cell.owner) continue;


      if (cell.owner === 'hazard' || nb.owner === 'hazard') continue;





      // Recompute edge values with mods + surge bonus


      const surgeBonus = (cell.card.ability==='surge' && G.surgeTrigger?.[cell.owner]) ? 3 : 0;


      const nbSurgeBonus = (nb.card.ability==='surge' && G.surgeTrigger?.[nb.owner]) ? 3 : 0;


      let mv = cell.card.edges[d.myE] + (cell.card.edgeMod?.[d.myE]||0) + surgeBonus;


      let tv = nb.card.edges[d.theirE] + (nb.card.edgeMod?.[d.theirE]||0) + nbSurgeBonus;





      // PIERCE tiebreak


      const pierce = cell.card.ability==='pierce', pierceThem = nb.card.ability==='pierce';


      const isTie = mv === tv && !pierce && !pierceThem;


      const iWin  = mv > tv || (mv===tv && pierce && !pierceThem);





      const winnerOwner = isTie ? null : iWin ? cell.owner : nb.owner;


      const winAvg  = winnerOwner==='player' ? pAvg : aAvg;


      const winCol  = winnerOwner==='player' ? pCol : aCol;


      const winName = winnerOwner==='player' ? pName : aName;


      const losName = winnerOwner==='player' ? aName : pName;


      const losAvg  = winnerOwner==='player' ? aAvg : pAvg;


      const cellName = cell.owner==='player' ? pName : aName;


      const nbName   = nb.owner==='player' ? pName : aName;





      const chip = document.createElement('div');


      chip.className = `bti ${isTie?'tie-chip':'win-chip'}`;


      const x = d.chipX(r,c), y = d.chipY(r,c);





      // Build ability note for tooltip


      const abilities = [];


      if (cell.card.ability==='shield'&&cell.card.shieldExpended) abilities.push(`${cellName} SHIELD absorbed a loss`);


      if (nb.card.ability==='shield'&&nb.card.shieldExpended)     abilities.push(`${nbName} SHIELD absorbed a loss`);


      if (surgeBonus)   abilities.push(`${cellName} SURGE +3`);


      if (nbSurgeBonus) abilities.push(`${nbName} SURGE +3`);


      if (pierce&&mv===tv)    abilities.push(`${cellName} PIERCE: tie → win`);


      if (pierceThem&&mv===tv)abilities.push(`${nbName} PIERCE: tie → win`);


      if (cell.card.ability==='double_strike') abilities.push(`${cellName} DOUBLE STRIKE extends reach`);


      if (nb.card.ability==='double_strike')   abilities.push(`${nbName} DOUBLE STRIKE extends reach`);





      // Encode tooltip data as JSON in dataset


      const tipData = JSON.stringify({


        axis: d.axis, myE: d.myE, theirE: d.theirE,


        mv, tv, isTie, winName, losName, winCol, winAvg, losAvg,


        abilities, winnerOwner,


        pAvg, aAvg, pCol, aCol,


        cellName, nbName,


        cellOwner: cell.owner, nbOwner: nb.owner


      });


      chip.dataset.tip = tipData;





      if (isTie) {


        chip.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${CHIP}px;height:${CHIP}px;z-index:6;`;


        chip.innerHTML = `<span style="pointer-events:none;font-size:9px;">TIE</span>`;


      } else {


        chip.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${CHIP}px;height:${CHIP}px;border:3px solid ${winCol};--wc:${winCol};background:${winCol}18;z-index:6;`;


        chip.innerHTML = `<img src="${winAvg}" style="width:${CHIP-6}px;height:${CHIP-6}px;border-radius:50%;object-fit:cover;object-position:top;pointer-events:none;">`;


      }





      chip.onmouseenter = (ev) => showBattleTip(ev, JSON.parse(chip.dataset.tip));


      chip.onmouseleave = hideTip;


      el.appendChild(chip);


    }


  }


}





function showBattleTip(e, d) {

        <span style="font-size:18px;font-weight:bold;color:${d.cellOwner===d.winnerOwner?cCol:'#444455'};


          ${d.cellOwner===d.winnerOwner?`text-shadow:0 0 8px ${cCol};`:''}">${d.mv}</span>


      </div>

        <img src="${cIsP?d.aAvg:d.pAvg}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:2px solid ${nCol};flex-shrink:0;">


        <span style="font-size:10px;color:${nCol};letter-spacing:1px;flex:1;">${d.nbName}</span>


        <span style="font-size:9px;color:#555;letter-spacing:1px;">${edgeLabels[1]}:</span>


        <span style="font-size:18px;font-weight:bold;color:${d.nbOwner===d.winnerOwner?nCol:'#444455'};


          ${d.nbOwner===d.winnerOwner?`text-shadow:0 0 8px ${nCol};`:''}">${d.tv}</span>


      </div>


    </div>


    <!-- Result -->


    <div style="height:1px;background:linear-gradient(90deg,transparent,var(--tc-dim),transparent);margin:0 12px;"></div>


    <div style="padding:6px 10px 8px;">


      ${d.isTie


        ? `<div style="font-size:11px;color:#555;letter-spacing:2px;text-align:center;">TIE — no edge advantage</div>`


        : `<div style="display:flex;align-items:center;gap:8px;">


            <img src="${d.winAvg}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid ${d.winCol};">


            <span style="font-size:12px;font-weight:bold;color:${d.winCol};letter-spacing:1px;">${d.winName} WINS</span>


            <span style="font-size:10px;color:#555;margin-left:auto;">+${diff}</span>


          </div>`}


      ${d.abilities.length ? `


        <div style="margin-top:6px;border-top:1px solid #1a1a2a;padding-top:6px;display:flex;flex-direction:column;gap:3px;">


          ${d.abilities.map(a => `<div style="font-size:10px;color:#aa88ff;letter-spacing:0.5px;">⚡ ${a}</div>`).join('')}


        </div>` : ''}


    </div>


  </div>`;





  tt.style.display = 'block';


  const ttH = tt.offsetHeight || 220;


  const ttW = tt.offsetWidth  || 315;


  const spaceBelow = window.innerHeight - e.clientY;


  const top  = spaceBelow > ttH + 20 ? e.clientY + 14 : e.clientY - ttH - 14;


  const left = e.clientX + ttW + 20 > window.innerWidth ? e.clientX - ttW - 14 : e.clientX + 14;


  tt.style.top  = Math.max(8, top)  + 'px';


  tt.style.left = Math.max(8, left) + 'px';


}





const _prevBadgeRes = { rows: Array(5).fill(null), cols: Array(7).fill(null) };


function renderScoreBadges(_precomputed) {


  const s = _precomputed || computeScores();

  const tP = document.getElementById('totalP');


  const tA = document.getElementById('totalA');


  const pLabel = window.playerFactionName || 'YOU';


  const aLabel = window.aiFactionName    || 'AI';


  if (tP) tP.textContent = `${pLabel}: ${s.pVP} VP`;

      </div>`;

    const wAvg = pWin ? pAvatar : aAvatar;

function renderHand() {

  const eligibleNow = new Set(eligible.map(c => c.id));


  const prev = G._prevEligibleIds;


  const newlyEligible = (prev instanceof Set) ? eligible.filter(c => !prev.has(c.id)) : [];

  wall:        [{dr:-1,dc:0},{dr:0,dc:-1},{dr:0,dc:-2},{dr:0,dc:1},{dr:0,dc:2},{dr:1,dc:0}],


  // Battle group — opens wide front (2 wide × 2 deep forward)


  command:     [{dr:-1,dc:-1},{dr:-1,dc:0},{dr:-1,dc:1},{dr:-2,dc:0},{dr:-2,dc:-1},{dr:-2,dc:1}],


  // Carrier wing — forward lanes for fighters to launch through


  launch:      [{dr:-1,dc:0},{dr:-2,dc:0},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:-3,dc:0}],


  // Strike force / interceptor — punches directly forward, 2 deep


  lance:       [{dr:-1,dc:0},{dr:-2,dc:0}],


  // Flanker / fast runner — forward + diagonals


  flanker:     [{dr:-1,dc:0},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:-2,dc:0}],


  // Dreadnaught — expands everywhere, 2 deep in all directions


  dreadnaught: [{dr:-1,dc:0},{dr:-2,dc:0},{dr:0,dc:-1},{dr:0,dc:1},{dr:-1,dc:-1},{dr:-1,dc:1},{dr:1,dc:0}],


};





// ── PLACEMENT RULES ───────────────────────────


function getValidPlacements(owner, card) {


  // PHANTOM: free placement within OWN 2 home rows


  if (card.ability === 'phantom') {


    const [minR, maxR] = owner === 'player' ? [3,4] : [0,1];


    const cells = [];


    for (let r = minR; r <= maxR; r++)


      for (let c = 0; c < 7; c++)


        if (!G.grid[r][c].card) cells.push({r,c});


    return cells;


  }





  const homeRow = owner === 'player' ? 4 : 0;


  const fwd     = owner === 'player' ? 1 : -1; // zone dr=-1 means "forward toward enemy" for player, so multiply by 1; AI flips


  const set     = new Set();





  // Home row is always available


  for (let c = 0; c < 7; c++)


    if (!G.grid[homeRow][c].card) set.add(`${homeRow},${c}`);





  // RUSH: also add cells adjacent to enemy cards (aggressive placement bypass)


  if (card.ability === 'rush') {


    const enemy = owner === 'player' ? 'ai' : 'player';


    for (let r = 0; r < 5; r++) {


      for (let c = 0; c < 7; c++) {


        if (G.grid[r][c].owner !== enemy || !G.grid[r][c].card) continue;


        [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}].forEach(({dr,dc}) => {


          const nr=r+dr, nc=c+dc;


          if (nr>=0&&nr<5&&nc>=0&&nc<7&&!G.grid[nr][nc].card) set.add(`${nr},${nc}`);


        });


      }


    }


  }





  // Zone expansion from each placed friendly card


  for (let r = 0; r < 5; r++) {


    for (let c = 0; c < 7; c++) {


      const cell = G.grid[r][c];


      if (cell.owner !== owner || !cell.card) continue;





      const zoneKey   = cell.card.zone || 'wide_cross';


      const zoneOffsets = ZONES[zoneKey] || ZONES.wide_cross;





      for (const {dr, dc} of zoneOffsets) {


        // Mirror dr for player (forward = up = -1) vs AI (forward = down = +1)


        const nr = r + dr * fwd;


        const nc = c + dc;


        if (nr >= 0 && nr < 5 && nc >= 0 && nc < 7 && !G.grid[nr][nc].card)


          set.add(`${nr},${nc}`);


      }


    }


  }





  // Tier placement rules — symmetric, no side may enter the opponent's home row


  let minAllowed, maxAllowed;


  if (card.tier === 'I') {


    minAllowed = homeRow; maxAllowed = homeRow;


  } else {


    minAllowed = 1; maxAllowed = 3;


  }





  // RUSH bypasses tier zone restrictions — can go anywhere adjacent to an enemy


  // (still can't go into opponent home row)


  const enemyHome = owner === 'player' ? 0 : 4;


  if (card.ability === 'rush') {


    return [...set]


      .map(s => { const [r,c] = s.split(',').map(Number); return {r,c}; })


      .filter(({r}) => r !== enemyHome); // only restriction: can't enter enemy home


  }





  return [...set]


    .map(s => { const [r,c] = s.split(',').map(Number); return {r,c}; })


    .filter(({r}) => r >= minAllowed && r <= maxAllowed);


}





// ── ZONE PREVIEW (yellow cells showing future placements if placed here) ───


function getZonePreview(r, c, card, owner) {


  const zoneKey   = card.zone || 'wide_cross';


  const zoneOffsets = ZONES[zoneKey] || ZONES.wide_cross;


  const fwd = owner === 'player' ? 1 : -1; // dr=-1 = forward for player, so multiply by 1


  const cells = [];


  for (const {dr, dc} of zoneOffsets) {


    const nr = r + dr * fwd, nc = c + dc;


    if (nr >= 0 && nr < 5 && nc >= 0 && nc < 7 && !G.grid[nr][nc].card)


      cells.push({r: nr, c: nc});


  }


  return cells;


}





// ── COMPARISON FLASH (no ownership change) ───


const DIRS4 = [


  {dr:-1,dc:0,myE:'n',theirE:'s',lbl:'north'},


  {dr: 1,dc:0,myE:'s',theirE:'n',lbl:'south'},


  {dr: 0,dc:1,myE:'e',theirE:'w',lbl:'east'},


  {dr: 0,dc:-1,myE:'w',theirE:'e',lbl:'west'},


];





function doComparisons(r, c, owner, card, depth=0) {


  if (depth > 3) return;


  const enemy = owner==='player'?'ai':'player';





  for (const d of DIRS4) {


    const nr=r+d.dr, nc=c+d.dc;


    if (nr<0||nr>=5||nc<0||nc>=7) continue;


    const target = G.grid[nr][nc];


    if (!target.card || target.owner !== enemy) continue;





    // Shield: absorbs first comparison


    if (target.card.ability==='shield' && !target.card.shieldExpended) {


      target.card.shieldExpended = true;


      addLog('shield', `${target.card.name} SHIELD absorbs comparison`);


      showFlash(r,c,nr,nc, card.edges[d.myE], target.card.edges[d.theirE], false);


      continue;


    }





    const mv = card.edges[d.myE], tv = target.card.edges[d.theirE];


    const iWin = mv > tv;


    showFlash(r, c, nr, nc, mv, tv, iWin);





    addLog('compare', `${card.name} ${mv}${iWin?'>':'<'}${tv} vs ${target.card.name} (${d.lbl})`);





    // DOUBLE STRIKE: contest 2nd cell at HALF strength


    if (card.ability==='double_strike' && iWin) {


      const nr2=nr+d.dr, nc2=nc+d.dc;


      if (nr2>=0&&nr2<5&&nc2>=0&&nc2<7) {


        const t2 = G.grid[nr2][nc2];


        if (t2.card && t2.owner===enemy) {


          const mv2=Math.max(1,Math.floor(mv/2)), tv2=t2.card.edges[d.theirE];


          showFlash(nr,nc,nr2,nc2,mv2,tv2,mv2>tv2);


          addLog('compare', `DOUBLE STRIKE (\u00bd): ${mv2} vs ${tv2} → ${t2.card.name}`);


        }


      }


    }


  }


}





// ── NO-VALID-MOVES PASS RULE ──────────────────


function hasAnyMoves(owner) {


  const hand = owner === 'player' ? G.playerHand : G.aiHand;


  return hand.filter(c => !c.used).some(card => getValidPlacements(owner, card).length > 0);


}

function playHoverSfx() {

  if (!sfx || _sfxMuted) return;

}

// Apply ability effects when a card is placed on the board


function applyPlacementAbility(card, r, c, owner) {


  const dirs = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];


  const enemy = owner === 'player' ? 'ai' : 'player';





  // Ensure edgeMod is initialized on the placed card


  card.edgeMod = card.edgeMod || {n:0,s:0,e:0,w:0};





  // BOOST: adjacent friendly cards +1 all edges


  // COMMANDER: adjacent same-tier friendly cards +2 all edges


  // SPAWN (Brood): identical math to COMMANDER — Brood-unique name


  if (card.ability === 'boost' || card.ability === 'commander' || card.ability === 'spawn') {


    const bonus = (card.ability === 'commander' || card.ability === 'spawn') ? 2 : 1;


    const requireSameTier = card.ability === 'commander' || card.ability === 'spawn';


    dirs.forEach(({dr,dc}) => {


      const nr=r+dr, nc=c+dc;


      if (nr<0||nr>=5||nc<0||nc>=7) return;


      const nb = G.grid[nr][nc];


      if (nb.card && nb.owner === owner) {


        if (requireSameTier && nb.card.tier !== card.tier) return;


        nb.card.edgeMod = nb.card.edgeMod || {n:0,s:0,e:0,w:0};


        nb.card.edgeMod.n += bonus; nb.card.edgeMod.s += bonus;


        nb.card.edgeMod.e += bonus; nb.card.edgeMod.w += bonus;


      }


    });


    if (card.ability === 'spawn') addLog('compare', `SPAWN: ${card.name} coordinates the hive — adjacent same-tier allies +2`);


  }





  // SWEEP: normalise all edges to the 2nd highest edge value


  if (card.ability === 'sweep') {


    const base = card.edges;


    const existing = card.edgeMod || {n:0,s:0,e:0,w:0};


    const effN = base.n + existing.n, effS = base.s + existing.s;


    const effE = base.e + existing.e, effW = base.w + existing.w;


    const sorted = [effN, effS, effE, effW].sort((a,b) => b-a);


    const target = sorted[1];


    card.edgeMod = {


      n: target - base.n, s: target - base.s,


      e: target - base.e, w: target - base.w,


    };


    addLog('compare', `SWEEP: ${card.name} normalises all edges to ${target} (2nd highest was ${sorted[0]}→${target})`);


  }





  // INTIMIDATE: find adjacent enemies, reduce their highest edge by -1 via edgeMod


  if (card.ability === 'intimidate') {


    dirs.forEach(({dr,dc}) => {


      const nr=r+dr, nc=c+dc;


      if (nr<0||nr>=5||nc<0||nc>=7) return;


      const nb = G.grid[nr][nc];


      if (!nb.card || nb.owner === owner) return;


      nb.card.edgeMod = nb.card.edgeMod || {n:0,s:0,e:0,w:0};


      const effN = nb.card.edges.n + nb.card.edgeMod.n;


      const effS = nb.card.edges.s + nb.card.edgeMod.s;


      const effE = nb.card.edges.e + nb.card.edgeMod.e;


      const effW = nb.card.edges.w + nb.card.edgeMod.w;


      const max = Math.max(effN, effS, effE, effW);


      let edgeName = 'N';


      if (effN === max) { nb.card.edgeMod.n -= 1; edgeName = 'N'; }


      else if (effS === max) { nb.card.edgeMod.s -= 1; edgeName = 'S'; }


      else if (effE === max) { nb.card.edgeMod.e -= 1; edgeName = 'E'; }


      else { nb.card.edgeMod.w -= 1; edgeName = 'W'; }


      addLog('compare', `INTIMIDATE — ${nb.card.name} loses 1 from ${edgeName}`);


    });


  }





  // MIRROR: sandwiched between enemies on same axis — swap their facing edges


  if (card.ability === 'mirror') {


    const northCell = (r > 0) ? G.grid[r-1][c] : null;


    const southCell = (r < 4) ? G.grid[r+1][c] : null;


    const westCell  = (c > 0) ? G.grid[r][c-1] : null;


    const eastCell  = (c < 6) ? G.grid[r][c+1] : null;


    const nEnemy = northCell && northCell.card && northCell.owner !== owner;


    const sEnemy = southCell && southCell.card && southCell.owner !== owner;


    const wEnemy = westCell  && westCell.card  && westCell.owner  !== owner;


    const eEnemy = eastCell  && eastCell.card  && eastCell.owner  !== owner;


    if (nEnemy && sEnemy) {


      const nc = northCell.card, sc = southCell.card;


      nc.edgeMod = nc.edgeMod || {n:0,s:0,e:0,w:0};


      sc.edgeMod = sc.edgeMod || {n:0,s:0,e:0,w:0};


      // Swap their facing edge effective values: nc's S and sc's N


      const ncSeff = nc.edges.s + nc.edgeMod.s;


      const scNeff = sc.edges.n + sc.edgeMod.n;


      nc.edgeMod.s = scNeff - nc.edges.s;


      sc.edgeMod.n = ncSeff - sc.edges.n;


      addLog('compare', `MIRROR — ${nc.name} and ${sc.name} edges reversed (V)`);


    }


    if (wEnemy && eEnemy) {


      const wc = westCell.card, ec = eastCell.card;


      wc.edgeMod = wc.edgeMod || {n:0,s:0,e:0,w:0};


      ec.edgeMod = ec.edgeMod || {n:0,s:0,e:0,w:0};


      // Swap: wc's E and ec's W


      const wcEeff = wc.edges.e + wc.edgeMod.e;


      const ecWeff = ec.edges.w + ec.edgeMod.w;


      wc.edgeMod.e = ecWeff - wc.edges.e;


      ec.edgeMod.w = wcEeff - ec.edges.w;


      addLog('compare', `MIRROR — ${wc.name} and ${ec.name} edges reversed (H)`);


    }


  }





  // AMBUSH: randomly pick up to 2 adjacent enemies, weaken all 4 edges -1


  if (card.ability === 'ambush') {


    const adjEnemies = [];


    dirs.forEach(({dr,dc}) => {


      const nr=r+dr, nc=c+dc;


      if (nr<0||nr>=5||nc<0||nc>=7) return;


      const nb = G.grid[nr][nc];


      if (nb.card && nb.owner !== owner) adjEnemies.push({r:nr, c:nc, card:nb.card});


    });


    // Shuffle and pick up to 2


    const _rng = window._mpSeed || Math.random;


    adjEnemies.sort(() => _rng() - 0.5);


    const targets = adjEnemies.slice(0, 2);


    const names = [];


    targets.forEach(({r:nr, c:nc, card:tc}) => {


      tc.edgeMod = tc.edgeMod || {n:0,s:0,e:0,w:0};


      tc.edgeMod.n -= 1; tc.edgeMod.s -= 1;


      tc.edgeMod.e -= 1; tc.edgeMod.w -= 1;


      names.push(tc.name);


      // Visual flash


      const cellEl = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);


      if (cellEl) {


        cellEl.classList.add('ambush-hit');


        setTimeout(() => cellEl.classList.remove('ambush-hit'), 850);


      }


    });


    if (targets.length === 0) { addLog('compare','AMBUSH — no adjacent enemies to weaken'); return; }


    if (names.length) addLog('compare', `AMBUSH — ${names.join(', ')} weakened`);


  }





  // STONEWALL: mark this card + up to 2 adjacent enemies as VP-silent


  if (card.ability === 'stonewall') {


    card.stonewalled = true;


    const adjEnemies = [];


    dirs.forEach(({dr,dc}) => {


      const nr=r+dr, nc=c+dc;


      if (nr<0||nr>=5||nc<0||nc>=7) return;


      const nb = G.grid[nr][nc];


      if (nb.card && nb.owner !== owner) adjEnemies.push({r:nr, c:nc, card:nb.card});


    });


    const _rng2 = window._mpSeed || Math.random;


    adjEnemies.sort(() => _rng2() - 0.5);


    const targets = adjEnemies.slice(0, 2);


    targets.forEach(({r:nr, c:nc, card:tc}) => {


      tc.stonewall_victim = true;


      const cellEl = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);


      if (cellEl) {


        cellEl.classList.add('ambush-hit');


        setTimeout(() => cellEl.classList.remove('ambush-hit'), 850);


      }


    });


    if (targets.length === 0) { addLog('compare','STONEWALL — self silenced, no adjacent enemies'); } else { addLog('compare', `STONEWALL — ${targets.length} enemies silenced (and self)`); }


  }





  // SNIPER: silence enemy home-row card in this column


  if (card.ability === 'sniper') {


    const enemyHomeRow = owner === 'player' ? 0 : 4;


    const target = G.grid[enemyHomeRow][c];


    if (target.card && target.owner !== owner) {


      target.card.sniped = true;


      addLog('compare', `SNIPER — ${target.card.name} at row ${enemyHomeRow} col ${c} silenced`);


    }


  }





  // HAT TRICK: middle of 3-card vertical line — spread N/S edges to flankers


  function _applyHatTrick(htCard, htR, htC, htOwner) {


    if (htCard._hatTrickApplied) return;


    if (htR < 1 || htR > 3) return;


    const northCell = G.grid[htR-1][htC];


    const southCell = G.grid[htR+1][htC];


    if (!northCell.card || northCell.owner !== htOwner) return;


    if (!southCell.card || southCell.owner !== htOwner) return;


    htCard._hatTrickApplied = true;


    const bonusN = Math.floor(htCard.edges.n / 3);


    northCell.card.edgeMod = northCell.card.edgeMod || {n:0,s:0,e:0,w:0};


    northCell.card.edgeMod.s += bonusN; northCell.card.edgeMod.e += bonusN; northCell.card.edgeMod.w += bonusN;


    const bonusS = Math.floor(htCard.edges.s / 3);


    southCell.card.edgeMod = southCell.card.edgeMod || {n:0,s:0,e:0,w:0};


    southCell.card.edgeMod.n += bonusS; southCell.card.edgeMod.e += bonusS; southCell.card.edgeMod.w += bonusS;


    addLog('compare', `HAT TRICK — formation bonus applied (+${bonusN}/${bonusS})`);


  }


  if (card.ability === 'hat_trick') _applyHatTrick(card, r, c, owner);


  // Retroactive: if this card completes a HAT_TRICK formation for an adjacent middle card


  [-1, 1].forEach(dr => {


    const nr = r + dr;


    if (nr < 0 || nr >= 5) return;


    const adj = G.grid[nr][c];


    if (adj.card && adj.card.ability === 'hat_trick' && adj.owner === owner) {


      _applyHatTrick(adj.card, nr, c, owner);


    }


  });





  // Update surge trigger state (used in computeBattleResults)


  if (!G.surgeTrigger) G.surgeTrigger = {player:false, ai:false};


  const s = computeScores();


  G.surgeTrigger.player = s.rowResults.filter(r=>r==='a').length > s.rowResults.filter(r=>r==='p').length;


  G.surgeTrigger.ai     = s.rowResults.filter(r=>r==='p').length > s.rowResults.filter(r=>r==='a').length;


}





function placeCard(card, r, c, owner) {


  G.grid[r][c] = { card, owner };   // owner NEVER changes after this


  card.used = true;


  applyPlacementAbility(card, r, c, owner);


  // Play card placement sound for both players (AI slightly softer + delayed)


  if (owner === 'player') {


    playCardSfx();


  } else {


    setTimeout(() => {


      const sfx = document.getElementById('cardSfx');


      if (sfx && !_sfxMuted) { sfx.currentTime = 0; sfx.volume = 0.35 * _sfxVol; sfx.play().catch(()=>{}); }


    }, 400);


  }


  addLog(owner==='player'?'player':'ai',


    `${owner==='player'?'YOU':'AI'} place ${card.name}[${card.tier}] at [${r},${c}]`);


  if (G) G._flankTriggered = (card.ability === 'flank') ? owner : null;





  doComparisons(r, c, owner, card);


  renderAll();





  setTimeout(() => {


    const cells = document.querySelectorAll('.cell');


    if (cells[r*7+c]) cells[r*7+c].classList.add('just-placed');


  }, 10);





  checkWin();


}





// ── AI CARD FLY ANIMATION ─────────────────────


// noTurnFlip: true when opponent played a FLANK card — don't give turn back yet


function animateAiCard(card, r, c, noTurnFlip = false) {


  const grid   = document.getElementById('grid');


  const target = grid?.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);


  // Source: AI avatar in the faction HUD (top-left), or top-center of viewport


  const srcEl  = document.getElementById('sbAiAvatar') ||


                 document.getElementById('fhAi');





  if (!target || !srcEl) { placeCard(card, r, c, 'ai'); return; }





  const src  = srcEl.getBoundingClientRect();


  const tgt  = target.getBoundingClientRect();


  const aCol = window.aiFactionColor || '#ff0080';





  // Start position: center of source element


  const startL = src.left + src.width  / 2 - tgt.width  / 2;


  const startT = src.top  + src.height / 2 - tgt.height / 2;





  const floater = document.createElement('div');


  floater.style.cssText = `


    position:fixed; z-index:9200; pointer-events:none;


    width:${tgt.width}px; height:${tgt.height}px;


    left:${startL}px; top:${startT}px;


    border-radius:6px;


    background:#050510 center/cover no-repeat;


    ${card.art ? `background-image:url('${card.art}');` : ''}


    border:2px solid ${aCol}99;


    box-shadow: 0 0 28px ${aCol}66, 0 8px 32px #000000cc;


    opacity:1;


    transition: left 0.42s cubic-bezier(0.4,0,0.2,1),


                top  0.42s cubic-bezier(0.4,0,0.2,1),


                opacity 0.18s ease;


  `;


  document.body.appendChild(floater);





  // Double rAF: first frame paints start pos; second starts the transition


  requestAnimationFrame(() => requestAnimationFrame(() => {


    floater.style.left = tgt.left + 'px';


    floater.style.top  = tgt.top  + 'px';


  }));





  // Fade out as it arrives, then place


  setTimeout(() => { floater.style.opacity = '0'; }, 360);


  setTimeout(() => {


    floater.remove();


    placeCard(card, r, c, 'ai');


    if (G._flankTriggered === 'ai' && !G.gameOver) {


      G._flankTriggered = null;


      if (_mpRoom && _mpPlayer) {


        addLog('ai', '\u21BA FLANK \u2014 opponent takes extra turn');


        mpStartPolling();


      } else {


        addLog('ai', '\u21BA FLANK \u2014 AI takes extra turn');


        setTimeout(aiTurn, 1000);


      }


      return;


    }


    if (!G.gameOver && !noTurnFlip) {


      G.turn = 'player';


      renderScoreHeader();


      if (!hasAnyMoves('player')) {


        G.turn = 'ai';


        if (_mpRoom && _mpPlayer) {


          addLog('system', 'You have no valid moves — opponent continues');


          mpStartPolling();


        } else {


          addLog('system', 'You have no moves -- AI goes again');


          setTimeout(aiTurn, 1200);


        }


      }


    }


  }, 580);


}





// ── AI TURN ───────────────────────────────────


function aiTurn() {


  const avail = G.aiHand.filter(c => !c.used);


  if (!avail.length) { checkWin(); return; }





  let best = -Infinity, bestCard = null, bestR = -1, bestC = -1;





  for (const card of avail) {


    for (const {r,c} of getValidPlacements('ai', card)) {


      let score = card.power;


      const s = computeScores();


      if (s.rowResults[r] !== 'a') score += 2;


      if (s.colResults[c] !== 'a') score += 2;


      // Penalise hazard-adjacent placements (-2 effective VP each)


      const _adjHz = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}]


        .filter(({dr,dc})=>{const hr=r+dr,hc=c+dc;return hr>=0&&hr<5&&hc>=0&&hc<7&&G.grid[hr][hc].owner==='hazard';}).length;


      score -= _adjHz * 2.5;


      for (const d of DIRS4) {


        const nr=r+d.dr, nc=c+d.dc;


        if (nr<0||nr>=5||nc<0||nc>=7) continue;


        const t = G.grid[nr][nc];


        if (t.card && t.owner==='player' && card.edges[d.myE] > t.card.edges[d.theirE])
