<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GALACTIC ZERO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #020208;
  --purple: #8855ff;
  --purple-dim: #4422aa;
}

body {
  background: var(--bg);
  color: #e0e0e0;
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  cursor: default;
}

/* ── LAYERS ── */
#starfield { position:fixed; inset:0; z-index:0; }

.splash-bg-img {
  position: fixed; inset: 0; z-index: 1;
  background: url('assets/splash.png') center/cover no-repeat;
  opacity: 0.9;
}
/* Galaxy video loop — replaces static image once generated */
#galaxyVideo {
  position: fixed; inset: 0; z-index: 1;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.9; display: none;
}
.splash-bg-dim {
  position: fixed; inset: 0; z-index: 2;
  background: radial-gradient(ellipse at 50% 100%, #020208cc 0%, transparent 60%);
}

/* Race background — fades in when a deck is selected */
#race-bg {
  position: fixed; inset: 0; z-index: 1;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 0.8s ease;
}
#race-bg-overlay {
  position: fixed; inset: 0; z-index: 2;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    transparent 38%,
    #020208aa 55%,
    #020208ee 75%,
    #020208f8 100%
  );
  opacity: 0; transition: opacity 0.8s ease;
}

/* ── SCREEN TRANSITIONS ── */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.screen.hidden {
  opacity: 0; pointer-events: none;
  transform: scale(0.98) translateY(8px);
}

/* ══════════════════════════════════════
   SCREEN 1 — SPLASH
══════════════════════════════════════ */
#splash { gap: 0; text-align: center; }

.splash-eyebrow {
  font-size: 10px; letter-spacing: 8px;
  color: #ffffffbb; margin-bottom: 24px;
  text-transform: uppercase;
  text-shadow: 0 0 12px #000000cc, 0 1px 3px #000000;
}

.splash-title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(48px, 8vw, 96px);
  letter-spacing: 12px;
  color: #fff;
  line-height: 1;
  text-shadow:
    0 0 20px #ffffff88,
    0 0 60px #8855ff66,
    0 0 120px #4422aa44,
    0 0 200px #22119922;
  animation: titleGlow 5s ease-in-out infinite;
  margin-bottom: 8px;
}
@keyframes titleGlow {
  0%,100% {
    text-shadow: 0 0 20px #fff8, 0 0 60px #8855ff55, 0 0 120px #4422aa33;
  }
  50% {
    text-shadow: 0 0 30px #ffff, 0 0 90px #aa77ffaa, 0 0 180px #6633cc66, 0 0 280px #33119944;
  }
}

.splash-tagline {
  font-size: 12px; letter-spacing: 6px;
  color: #ffffffee; margin-bottom: 5px;
  animation: fadeIn 2s ease forwards;
  text-shadow: 0 0 14px #000000cc, 0 1px 3px #000000;
}
.splash-tagline2 {
  font-size: 10px; letter-spacing: 4px;
  color: #ffffffaa; margin-bottom: 52px;
  text-shadow: 0 0 10px #000000cc, 0 1px 2px #000000;
}

/* Scanning line */
.splash-divider {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, transparent, #8855ff, transparent);
  margin: 0 auto 28px;
  animation: scanDown 2s ease-in-out infinite;
}
@keyframes scanDown {
  0%,100% { opacity:0.3; transform:scaleY(0.5); }
  50%      { opacity:1;   transform:scaleY(1); }
}

.btn-enter {
  position: relative;
  background: #000000cc;
  border: 1px solid #ffffff88;
  color: #ffffff;
  font-family: inherit;
  font-size: 11px; letter-spacing: 6px;
  padding: 16px 52px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.3s;
  overflow: hidden;
}
.btn-enter::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, #8855ff22 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.btn-enter:hover {
  border-color: #aa77ff;
  color: #fff;
  box-shadow: 0 0 24px #8855ff44, 0 0 60px #4422aa22;
  letter-spacing: 8px;
}
.btn-enter:hover::before { transform: translateX(100%); }
.btn-enter:active { transform: scale(0.98); }

/* Corner decorations */
.corner {
  position: absolute; width: 20px; height: 20px;
  opacity: 0.3;
}
.corner-tl { top: 10px; left: 10px; border-top: 1px solid #8855ff; border-left: 1px solid #8855ff; }
.corner-tr { top: 10px; right: 10px; border-top: 1px solid #8855ff; border-right: 1px solid #8855ff; }
.corner-bl { bottom: 10px; left: 10px; border-bottom: 1px solid #8855ff; border-left: 1px solid #8855ff; }
.corner-br { bottom: 10px; right: 10px; border-bottom: 1px solid #8855ff; border-right: 1px solid #8855ff; }

.splash-footer {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  text-align: center;
}
.splash-footer-lore {
  font-size: 9px; letter-spacing: 3px; color: #ffffffbb; margin-bottom: 4px;
  text-shadow: 0 0 10px #000000, 0 1px 2px #000000cc;
}
.splash-version { font-size: 8px; color: #ffffff88; letter-spacing: 2px; text-shadow: 0 0 8px #000000; }

/* ══════════════════════════════════════
   SCREEN 2 — DECK SELECT
══════════════════════════════════════ */
#deckselect { justify-content:flex-start; padding:0; overflow:hidden; }

.ds-header {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 16px 36px 10px; flex-shrink: 0;
  background: linear-gradient(to bottom, #020208ee, transparent);
  position: relative; z-index: 20;
}
.ds-title {
  font-family: 'Orbitron', monospace;
  font-size: 16px; letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 20px #8855ffaa, 0 2px 4px #000000aa;
}
.ds-header-right { display: flex; gap: 12px; align-items: center; }
.ds-logo { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:4px; color:#7755aa; }
.btn-back {
  background: #00000066; border: 1px solid #8855ff66;
  color: #aa88ff; font-family: inherit;
  font-size: 9px; letter-spacing: 3px;
  padding: 6px 16px; cursor: pointer; transition: all 0.2s;
}
.btn-back:hover { border-color: #aa77ff; color: #fff; }

/* ── CONVEYOR BELT ── */
.conveyor-section {
  position: relative; flex-shrink: 0; z-index: 20;
  border-top: 1px solid #8855ff33;
  border-bottom: 1px solid #8855ff33;
  background: linear-gradient(to bottom, #020208aa, transparent 20%, transparent 80%, #020208aa);
}
.conveyor-wrap {
  width: 100%;
  overflow: hidden;
  /* Top padding gives room for the hover jump without clipping */
  padding: 56px 0 20px;
}
.conveyor-track {
  display: flex; gap: 22px; width: max-content;
  padding: 0 28px;
  will-change: transform;
}

/* Navigation arrows */
.conveyor-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 80px; z-index: 30;
  background: #000000cc; border: 1px solid #8855ff66;
  color: #aa88ff; font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; border-radius: 4px;
  user-select: none;
}
.conveyor-arrow:hover { background: #1a0a2eee; border-color: #aa77ff; color: #fff; box-shadow: 0 0 20px #8855ff44; }
.conveyor-arrow.left  { left: 8px; }
.conveyor-arrow.right { right: 8px; }

/* ── RACE TILES ── */
.race-tile {
  width: 240px; height: 320px; flex-shrink: 0;
  border-radius: 8px; cursor: pointer;
  background: #06050e center/cover no-repeat;
  border: 2px solid transparent;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, border-color 0.2s;
  position: relative; overflow: hidden;
}
.race-tile::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, #000000f2 0%, #000000bb 38%, #00000066 65%, transparent 100%);
  z-index: 0;
}
/* Hover goes DOWN a little so it doesn't clip on top */
.race-tile:hover { transform: translateY(-28px) scale(1.12); z-index: 20; }
.race-tile.selected { transform: translateY(-14px) scale(1.07); }
.rt-text-group {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px 14px 14px; z-index: 2;
  display: flex; flex-direction: column; gap: 5px;
}
.rt-name {
  font-size: 16px; letter-spacing: 1px; line-height: 1.2; font-weight: bold;
  text-shadow: 0 0 16px #000, 0 2px 5px #000;
}
.rt-sub {
  font-size: 11px; letter-spacing: 0.5px; color: #ffffffcc; line-height: 1.3;
  text-shadow: 0 0 10px #000, 0 1px 2px #000;
}
.rt-starter-badge {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  font-size: 8px; letter-spacing: 2px; padding: 4px 8px; border-radius: 2px;
}

/* ── LORE PANEL (below conveyor) ── */
.ds-lore-panel {
  flex: 1; display: flex; padding: 16px 40px 14px;
  overflow: hidden; position: relative; z-index: 10;
}
.ds-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; gap: 14px;
}
.ds-empty.hidden { display: none; }
.ds-empty-icon { font-size: 40px; opacity: 0.5; }
.ds-empty-text {
  font-size: 13px; letter-spacing: 5px; color: #ffffffaa;
  text-shadow: 0 0 12px #000000cc;
}
.ds-lore-content { display: none; flex-direction: column; gap: 8px; width: 100%; }
.ds-lore-content.visible { display: flex; animation: loreIn 0.4s ease; }
@keyframes loreIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.ds-race-name {
  font-family: 'Orbitron', monospace;
  font-size: 28px; letter-spacing: 3px; font-weight: 700; line-height: 1.1;
  text-shadow: 0 0 24px currentColor;
}
.ds-race-sub { font-size: 13px; letter-spacing: 3px; color: #ffffffcc; margin-top: 4px; }
.ds-race-quote {
  font-size: 16px; letter-spacing: 0.5px; color: #ffffffee;
  font-style: italic; line-height: 1.6; padding-left: 16px;
  border-left: 3px solid currentColor; margin: 6px 0 6px;
}
.ds-abilities-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.ability-pill {
  font-size: 11px; letter-spacing: 2px;
  padding: 6px 14px; border-radius: 2px;
  border: 1px solid currentColor; opacity: 0.85;
}

/* Ability showcase cards */
.ability-cards-row { display: flex; gap: 10px; flex-shrink: 0; margin: 6px 0 4px; }
.ability-showcase {
  flex: 1; min-width: 0;
  background: #000000aa; border-radius: 5px;
  border: 1px solid currentColor;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
}
.absc-title { font-size: 10px; letter-spacing: 2px; font-weight: bold; opacity: 0.9; }
.absc-desc  { font-size: 10px; letter-spacing: 0.3px; color: #ffffffcc; line-height: 1.5; opacity: 0.8; }

.lore-divider { height: 1px; flex-shrink: 0; opacity: 0.3; }
/* Single column layout — all lore stacked vertically */
.lore-cols { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden; }
.lore-col { display: flex; flex-direction: column; gap: 5px; }
.lore-label { font-size: 12px; letter-spacing: 3px; opacity: 0.8; text-transform: uppercase; margin-bottom: 3px; }
.lore-text { font-size: 16px; letter-spacing: 0.2px; color: #ffffff; line-height: 1.85; }
.lore-weakness { font-size: 15px; letter-spacing: 0.2px; color: #ffffffbb; line-height: 1.8; font-style: italic; }

.ds-deploy-wrap { padding-top: 14px; display: none; }
.ds-deploy-wrap.visible { display: block; }
.btn-deploy {
  background: transparent; font-family: 'Orbitron', monospace;
  font-size: 13px; letter-spacing: 5px; padding: 16px 52px;
  cursor: pointer; text-transform: uppercase; transition: letter-spacing 0.3s;
  border-radius: 3px; position: relative;
  animation: deployPulse 2s ease-in-out infinite;
}
@keyframes deployPulse {
  0%,100% {
    box-shadow: 0 0 12px currentColor, 0 0 24px currentColor,
                inset 0 0 8px transparent;
    opacity: 1;
  }
  50% {
    box-shadow: 0 0 28px currentColor, 0 0 56px currentColor,
                0 0 80px currentColor, inset 0 0 12px currentColor;
    opacity: 0.88;
  }
}
.btn-deploy:hover {
  letter-spacing: 8px;
  animation: none;
  box-shadow: 0 0 40px currentColor, 0 0 80px currentColor, 0 0 120px currentColor;
}
.btn-deploy:active { transform: scale(0.97); }
.ds-footer {
  flex-shrink: 0; padding: 8px 36px; border-top: 1px solid #1a1428;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to top, #020208cc, transparent);
}
.ds-footer-lore { font-size: 9px; letter-spacing: 3px; color: #9977bb; text-shadow: 0 0 8px #000000aa; }

/* ── ANIMATIONS ── */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>

// ── STARFIELD ─────────────────────────────────────
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 280}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      alpha: Math.random() * 0.6 + 0.1,
      speed: Math.random() * 0.008 + 0.002,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      const a = s.alpha * (0.5 + 0.5 * Math.sin(t * s.speed * 12 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,185,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize(); draw();
})();

let selectedRace = null;

// ── CONVEYOR — JS-based infinite loop ─────────────────
const TILE_COUNT   = 11;
const AUTO_SPEED   = 1.4;

let cvPos          = 0;
let cvSpeed        = AUTO_SPEED;
let cvHoverPaused  = false;
let cvWheeling     = false;
let cvWheelTimer   = null;
let CV_LOOP_PX     = 0; // measured from DOM after tiles render — avoids padding mismatch

function measureLoopWidth() {
  const track = document.getElementById('conveyorTrack');
  if (!track) return;
  const tiles = track.querySelectorAll('.race-tile');
  if (tiles.length < TILE_COUNT + 1) return;
  // Exact distance from tile[0] left edge to tile[TILE_COUNT] left edge
  const a = tiles[0].getBoundingClientRect().left;
  const b = tiles[TILE_COUNT].getBoundingClientRect().left;
  CV_LOOP_PX = Math.abs(b - a);
}

function runConveyor() {
  const track = document.getElementById('conveyorTrack');
  if (!track) { requestAnimationFrame(runConveyor); return; }

  // Try to measure if not yet done
  if (!CV_LOOP_PX) measureLoopWidth();

  if ((!cvHoverPaused || cvWheeling) && CV_LOOP_PX > 0) {
    cvPos += cvSpeed;
    if (cvPos >= CV_LOOP_PX) cvPos -= CV_LOOP_PX;
    if (cvPos < 0)           cvPos += CV_LOOP_PX;
    track.style.transform = `translateX(${-cvPos}px)`;
  }
  requestAnimationFrame(runConveyor);
}

// Arrow buttons step speed
const SPEED_STEPS = [0.4, 0.8, 1.4, 2.5, 5.0];
let speedIdx = 2; // default = AUTO_SPEED step

function shiftSpeed(dir) {
  speedIdx = Math.max(0, Math.min(SPEED_STEPS.length - 1, speedIdx + dir));
  cvSpeed = SPEED_STEPS[speedIdx];
}

function initConveyorWheel() {
  const screen = document.getElementById('deckselect');
  if (!screen) return;
  screen.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Wheel scrolls in both directions, overrides hover pause
    cvWheeling = true;
    cvSpeed = e.deltaY > 0 ? 5.0 : -5.0;
    clearTimeout(cvWheelTimer);
    cvWheelTimer = setTimeout(() => {
      cvWheeling = false;
      cvSpeed = Math.abs(cvSpeed) === 5.0 ? AUTO_SPEED : cvSpeed; // revert to auto
    }, 600);
  }, { passive: false });

  const wrap = document.getElementById('conveyorWrap');
  if (wrap) {
    wrap.addEventListener('mouseenter', () => { cvHoverPaused = true; });
    wrap.addEventListener('mouseleave', () => { cvHoverPaused = false; });
  }
}

function resetConveyorHalf() {
  // Re-measure loop width once the screen is visible and tiles are laid out
  setTimeout(measureLoopWidth, 150);
}

// ── BUILD CONVEYOR BELT ────────────────────────────
function buildRaceGrid() {
  const track = document.getElementById('conveyorTrack');
  track.innerHTML = '';
  // 3 full sets — provides an extra buffer so seam is never visible
  [0, 1, 2].forEach(() => RACES.forEach(race => track.appendChild(createTile(race))));
  // CV_LOOP_PX = distance across exactly ONE set (measured after layout)
  requestAnimationFrame(() => requestAnimationFrame(measureLoopWidth));
}

function createTile(race) {
  const tile = document.createElement('div');
  tile.className = 'race-tile';
  tile.dataset.id = race.id;
  tile.style.backgroundImage = `url('${race.cover}')`;
  tile.style.borderColor = race.color + '33';
  tile.innerHTML = `
    ${race.starter ? `<div class="rt-starter-badge" style="color:${race.color};border:1px solid ${race.color}66;background:#00000099">STARTER</div>` : ''}
    <div class="rt-text-group">
      <div class="rt-name" style="color:${race.color}">${race.name}</div>
      <div class="rt-sub">${race.sub}</div>
    </div>
  `;
  tile.addEventListener('click', () => selectRace(race, tile));
  tile.addEventListener('mouseenter', () => {
    tile.style.borderColor = race.color + '99';
    tile.style.boxShadow = `0 12px 50px ${race.color}55, 0 0 80px ${race.color}22`;
  });
  tile.addEventListener('mouseleave', () => {
    if (selectedRace?.id !== race.id) {
      tile.style.borderColor = race.color + '33';
      tile.style.boxShadow = '';
    }
  });
  return tile;
}

function selectRace(race, tileEl) {
  // Deselect previous
  document.querySelectorAll('.race-tile.selected').forEach(t => {
    const r = RACES.find(r => r.id === t.dataset.id);
    if (r) {
      t.style.borderColor = r.color + '28';
      t.style.boxShadow = '';
      // DO NOT clear background — it contains the deck cover backgroundImage
    }
    t.classList.remove('selected');
  });

  selectedRace = race;
  tileEl.classList.add('selected');
  tileEl.style.borderColor = race.color;
  tileEl.style.boxShadow = `0 12px 50px ${race.color}66, 0 0 80px ${race.color}33`;

  // Use lore background — clip it to start at the bottom of the conveyor belt
  const bg = document.getElementById('race-bg');
  const ov = document.getElementById('race-bg-overlay');
  const cvSection = document.querySelector('.conveyor-section');
  const clipTop = cvSection ? Math.round(cvSection.getBoundingClientRect().bottom) : 380;
  bg.style.backgroundImage = `url('${race.loreBg || race.cover}')`;
  bg.style.clipPath  = `inset(${clipTop}px 0 0 0)`;
  ov.style.clipPath  = `inset(${clipTop}px 0 0 0)`;
  bg.style.opacity = '0.88';
  ov.style.opacity = '1';

  // Update lore panel
  document.getElementById('dsEmpty').classList.add('hidden');
  const lc = document.getElementById('loreContent');
  // Don't remove visible — update content directly to avoid black flash on re-select
  setTimeout(() => {
    document.getElementById('loreName').textContent   = race.name;
    document.getElementById('loreName').style.color   = race.color;
    document.getElementById('loreSub').textContent    = race.sub + ' · ' + race.playstyle;
    document.getElementById('loreQuote').textContent  = race.quote;
    document.getElementById('loreQuote').style.borderLeftColor = race.color;
    document.getElementById('loreText1').textContent  = race.lore;
    document.getElementById('loreText2').textContent  = race.history;
    document.getElementById('loreText3').textContent  = race.counter;
    document.getElementById('loreLabel1').style.color = race.color;
    document.getElementById('loreLabel2').style.color = race.color;
    document.getElementById('loreLabel3').style.color = race.color;
    document.getElementById('loreDivider').style.background =
      `linear-gradient(90deg, ${race.color}, transparent)`;

    const ab = document.getElementById('loreAbilities');
    ab.innerHTML = race.abilities.map(a =>
      `<span class="ability-pill" style="color:${race.color};border-color:${race.color}44">${a}</span>`
    ).join('');

    // Ability showcase cards — show first 3 unique abilities with descriptions
    const ac = document.getElementById('abilityCards');
    ac.innerHTML = race.abilities.slice(0, 3).map(a => `
      <div class="ability-showcase" style="color:${race.color};border-color:${race.color}44;background:${race.color}08">
        <div class="absc-title">${a}</div>
        <div class="absc-desc">${ABILITY_DESC[a] || '—'}</div>
      </div>
    `).join('');

    const btn = document.getElementById('deployBtn');
    btn.style.cssText = `
      font-family:'Orbitron',monospace;font-size:13px;letter-spacing:5px;
      padding:16px 52px;cursor:pointer;text-transform:uppercase;border-radius:3px;
      border:2px solid ${race.color};color:${race.color};background:${race.color}11;
    `;
    document.getElementById('deployWrap').classList.add('visible');
    lc.classList.add('visible');
  }, 60);
}

// ── GALAXY VIDEO ───────────────────────────────────
const gv = document.getElementById('galaxyVideo');
gv.addEventListener('loadeddata', () => {
  gv.style.display = 'block';
  document.getElementById('splashBg').style.opacity = '0';
});
gv.addEventListener('error', () => { /* fallback to static image */ });

// ── MUSIC ──────────────────────────────────────────
let musicStarted = false;
let muted = false;

function startMusic() {
  if (musicStarted) return;
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.35;
  audio.play().then(() => { musicStarted = true; }).catch(() => {});
}

function toggleMute() {
  const audio = document.getElementById('bgMusic');
  muted = !muted;
  audio.muted = muted;
  document.getElementById('muteBtn').innerHTML =
    (muted ? '🔇' : '🔊') + ' <span id="muteLbl">' + (muted ? 'MUTED' : 'MUSIC') + '</span>';
  document.getElementById('muteBtn').style.opacity = muted ? '0.5' : '1';
  if (!musicStarted && !muted) startMusic();
}

// Click sound — plays on every button and card click
function playClick() {
  const sfx = document.getElementById('clickSfx');
  if (!sfx) return;
  sfx.currentTime = 0;
  sfx.volume = 0.6;
  sfx.play().catch(() => {});
}

// Start music on first ANY interaction with the page
document.addEventListener('click', () => startMusic(), { once: true });

// Wire click sound to buttons and race tiles (using event delegation)
document.addEventListener('click', e => {
  const t = e.target;
  if (
    t.closest('button') ||
    t.closest('.race-tile') ||
    t.closest('.conveyor-arrow') ||
    t.closest('#muteBtn')
  ) playClick();
});

// ── SCREEN TRANSITIONS ─────────────────────────────
function showDeckSelect() {
  startMusic(); // First user interaction — safe to play
  const splash = document.getElementById('splash');
  const splashBg = document.getElementById('splashBg');
  const splashDim = document.getElementById('splashDim');
  splash.classList.add('hidden');
  splashBg.style.transition = 'opacity 0.7s';
  splashBg.style.opacity = '0';
  splashDim.style.opacity = '0';
  // Compute conveyor half-width now that it's visible
  setTimeout(resetConveyorHalf, 100);
  setTimeout(() => {
    document.getElementById('deckselect').classList.remove('hidden');
  }, 150);
}

function showSplash() {
  document.getElementById('deckselect').classList.add('hidden');
  // Reset race bg
  const bg = document.getElementById('race-bg');
  const ov = document.getElementById('race-bg-overlay');
  bg.style.opacity  = '0';
  ov.style.opacity  = '0';
  bg.style.clipPath = '';
  ov.style.clipPath = '';
  const splashBg = document.getElementById('splashBg');
  const splashDim = document.getElementById('splashDim');
  splashBg.style.opacity = '0.55';
  splashDim.style.opacity = '1';
  setTimeout(() => {
    document.getElementById('splash').classList.remove('hidden');
  }, 150);
}

function startGame() {
  if (!selectedRace) return;
  // Play deploy sound instead of regular click
  const dep = document.getElementById('deploySfx');
  if (dep) { dep.currentTime = 0; dep.volume = 0.8; dep.play().catch(()=>{}); }
  // Navigate to game board with selected race parameters
  const params = new URLSearchParams({
    race:  selectedRace.id,
    color: selectedRace.color,
    name:  selectedRace.name,
  });
  window.location.href = `game.html?${params.toString()}`;
}

// ── INIT ──────────────────────────────────────────
// If returning from game with ?screen=deck, skip splash and show deck select directly
if (new URLSearchParams(window.location.search).get('screen') === 'deck') {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('splashBg').style.opacity = '0';
  document.getElementById('splashDim').style.opacity = '0';
  document.getElementById('deckselect').classList.remove('hidden');
}

initConveyorWheel();

// Preload ALL cover images first, then build tiles and start conveyor
// This guarantees zero blank tiles — every image is cached before tiles render
Promise.all(
  RACES.map(r => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = res;
    img.src = r.cover;
  }))
).then(() => {
  buildRaceGrid();
  runConveyor();
});
</script>
