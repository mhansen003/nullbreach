<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GALACTIC ZERO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #020208;
  --purple: #8855ff;
  --purple-dim: #4422aa;
}

body {
  background: var(--bg);
  color: #e0e0e0;
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  cursor: default;
}

/* ── LAYERS ── */
#starfield { position:fixed; inset:0; z-index:0; }

.splash-bg-img {
  position: fixed; inset: 0; z-index: 1;
  background: url('assets/splash.png') center/cover no-repeat;
  opacity: 0.9;
}
/* Galaxy video loop — replaces static image once generated */
#galaxyVideo {
  position: fixed; inset: 0; z-index: 1;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.9; display: none;
}
.splash-bg-dim {
  position: fixed; inset: 0; z-index: 2;
  background: radial-gradient(ellipse at 50% 100%, #020208cc 0%, transparent 60%);
}

/* Race background — fades in when a deck is selected */
#race-bg {
  position: fixed; inset: 0; z-index: 1;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 0.8s ease;
}
#race-bg-overlay {
  position: fixed; inset: 0; z-index: 2;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    transparent 38%,
    #020208aa 55%,
    #020208ee 75%,
    #020208f8 100%
  );
  opacity: 0; transition: opacity 0.8s ease;
}

/* ── SCREEN TRANSITIONS ── */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.screen.hidden {
  opacity: 0; pointer-events: none;
  transform: scale(0.98) translateY(8px);
}

/* ══════════════════════════════════════
   SCREEN 1 — SPLASH
══════════════════════════════════════ */
#splash { gap: 0; text-align: center; }

.splash-eyebrow {
  font-size: 10px; letter-spacing: 8px;
  color: #ffffffbb; margin-bottom: 24px;
  text-transform: uppercase;
  text-shadow: 0 0 12px #000000cc, 0 1px 3px #000000;
}

.splash-title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(48px, 8vw, 96px);
  letter-spacing: 12px;
  color: #fff;
  line-height: 1;
  text-shadow:
    0 0 20px #ffffff88,
    0 0 60px #8855ff66,
    0 0 120px #4422aa44,
    0 0 200px #22119922;
  animation: titleGlow 5s ease-in-out infinite;
  margin-bottom: 8px;
}
@keyframes titleGlow {
  0%,100% {
    text-shadow: 0 0 20px #fff8, 0 0 60px #8855ff55, 0 0 120px #4422aa33;
  }
  50% {
    text-shadow: 0 0 30px #ffff, 0 0 90px #aa77ffaa, 0 0 180px #6633cc66, 0 0 280px #33119944;
  }
}

.splash-tagline {
  font-size: 12px; letter-spacing: 6px;
  color: #ffffffee; margin-bottom: 5px;
  animation: fadeIn 2s ease forwards;
  text-shadow: 0 0 14px #000000cc, 0 1px 3px #000000;
}
.splash-tagline2 {
  font-size: 10px; letter-spacing: 4px;
  color: #ffffffaa; margin-bottom: 52px;
  text-shadow: 0 0 10px #000000cc, 0 1px 2px #000000;
}

/* Scanning line */
.splash-divider {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, transparent, #8855ff, transparent);
  margin: 0 auto 28px;
  animation: scanDown 2s ease-in-out infinite;
}
@keyframes scanDown {
  0%,100% { opacity:0.3; transform:scaleY(0.5); }
  50%      { opacity:1;   transform:scaleY(1); }
}

.btn-enter {
  position: relative;
  background: #000000cc;
  border: 1px solid #ffffff88;
  color: #ffffff;
  font-family: inherit;
  font-size: 11px; letter-spacing: 6px;
  padding: 16px 52px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.3s;
  overflow: hidden;
}
.btn-enter::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, #8855ff22 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.btn-enter:hover {
  border-color: #aa77ff;
  color: #fff;
  box-shadow: 0 0 24px #8855ff44, 0 0 60px #4422aa22;
  letter-spacing: 8px;
}
.btn-enter:hover::before { transform: translateX(100%); }
.btn-enter:active { transform: scale(0.98); }

/* Corner decorations */
.corner {
  position: absolute; width: 20px; height: 20px;
  opacity: 0.3;
}
.corner-tl { top: 10px; left: 10px; border-top: 1px solid #8855ff; border-left: 1px solid #8855ff; }
.corner-tr { top: 10px; right: 10px; border-top: 1px solid #8855ff; border-right: 1px solid #8855ff; }
.corner-bl { bottom: 10px; left: 10px; border-bottom: 1px solid #8855ff; border-left: 1px solid #8855ff; }
.corner-br { bottom: 10px; right: 10px; border-bottom: 1px solid #8855ff; border-right: 1px solid #8855ff; }

.splash-footer {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  text-align: center;
}
.splash-footer-lore {
  font-size: 9px; letter-spacing: 3px; color: #ffffffbb; margin-bottom: 4px;
  text-shadow: 0 0 10px #000000, 0 1px 2px #000000cc;
}
.splash-version { font-size: 8px; color: #ffffff88; letter-spacing: 2px; text-shadow: 0 0 8px #000000; }

/* ══════════════════════════════════════
   SCREEN 2 — DECK SELECT
══════════════════════════════════════ */
#deckselect { justify-content:flex-start; padding:0; overflow:hidden; }

.ds-header {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 16px 36px 10px; flex-shrink: 0;
  background: linear-gradient(to bottom, #020208ee, transparent);
  position: relative; z-index: 20;
}
.ds-title {
  font-family: 'Orbitron', monospace;
  font-size: 16px; letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 20px #8855ffaa, 0 2px 4px #000000aa;
}
.ds-header-right { display: flex; gap: 12px; align-items: center; }
.ds-logo { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:4px; color:#7755aa; }
.btn-back {
  background: #00000066; border: 1px solid #8855ff66;
  color: #aa88ff; font-family: inherit;
  font-size: 9px; letter-spacing: 3px;
  padding: 6px 16px; cursor: pointer; transition: all 0.2s;
}
.btn-back:hover { border-color: #aa77ff; color: #fff; }

/* ── CONVEYOR BELT ── */
.conveyor-section {
  position: relative; flex-shrink: 0; z-index: 20;
  /* No hard bottom border — let the lore bg bleed through */
  background: linear-gradient(to bottom, #020208cc 0%, transparent 35%, transparent 100%);
}
.conveyor-wrap {
  width: 100%;
  overflow: hidden;
  /* Top padding gives room for the hover jump without clipping */
  padding: 56px 0 20px;
}
.conveyor-track {
  display: flex; gap: 22px; width: max-content;
  padding: 0 28px;
  will-change: transform;
}

/* Navigation arrows */
.conveyor-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 80px; z-index: 30;
  background: #000000cc; border: 1px solid #8855ff66;
  color: #aa88ff; font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; border-radius: 4px;
  user-select: none;
}
.conveyor-arrow:hover { background: #1a0a2eee; border-color: #aa77ff; color: #fff; box-shadow: 0 0 20px #8855ff44; }
.conveyor-arrow.left  { left: 8px; }
.conveyor-arrow.right { right: 8px; }

/* ── RACE TILES ── */
.race-tile {
  width: 240px; height: 320px; flex-shrink: 0;
  border-radius: 18px; cursor: pointer;
  background: #06050e center/cover no-repeat;
  border: 2px solid transparent;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, border-color 0.2s;
  position: relative; overflow: hidden;
}
.race-tile::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, #000000cc 0%, #00000066 40%, transparent 70%);
  z-index: 0;
}
/* Hover goes DOWN a little so it doesn't clip on top */
.race-tile:hover { transform: translateY(-28px) scale(1.12); z-index: 20; }
.race-tile.selected { transform: translateY(-14px) scale(1.07); }
.rt-text-group {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px 14px 14px; z-index: 2;
  display: flex; flex-direction: column; gap: 5px;
}
.rt-name {
  font-size: 16px; letter-spacing: 1px; line-height: 1.2; font-weight: bold;
  text-shadow: 0 0 16px #000, 0 2px 5px #000;
}
.rt-sub {
  font-size: 11px; letter-spacing: 0.5px; color: #ffffffcc; line-height: 1.3;
  text-shadow: 0 0 10px #000, 0 1px 2px #000;
}
.rt-starter-badge {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  font-size: 8px; letter-spacing: 2px; padding: 4px 8px; border-radius: 2px;
}

/* ── LORE PANEL (below conveyor) — scrollable so full content is reachable */
.ds-lore-panel {
  flex: 1; display: flex; padding: 16px 40px 14px;
  overflow-y: auto; position: relative; z-index: 10;
  scrollbar-width: thin; scrollbar-color: #8855ff33 transparent;
}
.ds-lore-panel::-webkit-scrollbar { width: 4px; }
.ds-lore-panel::-webkit-scrollbar-track { background: transparent; }
.ds-lore-panel::-webkit-scrollbar-thumb { background: #8855ff44; border-radius: 2px; }
.ds-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; gap: 14px;
}
.ds-empty.hidden { display: none; }
.ds-empty-icon { font-size: 40px; opacity: 0.5; }
.ds-empty-text {
  font-size: 13px; letter-spacing: 5px; color: #ffffffaa;
  text-shadow: 0 0 12px #000000cc;
}
.ds-lore-content { display: none; flex-direction: column; gap: 8px; width: 100%; }
.ds-lore-content.visible { display: flex; animation: loreIn 0.4s ease; }
@keyframes loreIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.ds-race-name {
  font-family: 'Orbitron', monospace;
  font-size: 28px; letter-spacing: 3px; font-weight: 700; line-height: 1.1;
  text-shadow: 0 0 24px currentColor;
}
.ds-race-sub { font-size: 13px; letter-spacing: 3px; color: #ffffffcc; margin-top: 4px; }
.ds-race-quote {
  font-size: 16px; letter-spacing: 0.5px; color: #ffffffee;
  font-style: italic; line-height: 1.6; padding-left: 16px;
  border-left: 3px solid currentColor; margin: 6px 0 6px;
}
.ds-abilities-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.ability-pill {
  font-size: 11px; letter-spacing: 2px;
  padding: 6px 14px; border-radius: 2px;
  border: 1px solid currentColor; opacity: 0.85;
}

/* Ability showcase cards — full-width below avatar, bigger text */
.ability-cards-row { display: flex; gap: 12px; flex-shrink: 0; margin: 10px 0 6px; }
.ability-showcase {
  flex: 1; min-width: 0;
  background: #000000bb; border-radius: 6px;
  border: 1px solid currentColor;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.absc-title { font-size: 13px; letter-spacing: 2px; font-weight: bold; }
.absc-desc  { font-size: 13px; letter-spacing: 0.2px; color: #ffffffdd; line-height: 1.6; }

.lore-divider { height: 1px; flex-shrink: 0; opacity: 0.3; }
.lore-label { font-size: 11px; letter-spacing: 3px; opacity: 0.7; text-transform: uppercase; margin-bottom: 6px; }
.lore-text { font-size: 14px; letter-spacing: 0.2px; color: #ffffff; line-height: 1.85; }
.lore-weakness { font-size: 13px; letter-spacing: 0.2px; color: #ffffffcc; line-height: 1.8; font-style: italic; }

/* Glowing launch button — pulsing with race color */
.ds-deploy-wrap { display: none; }
@keyframes launchGlow {
  0%,100% { box-shadow: 0 0 14px currentColor, 0 0 28px currentColor; opacity:0.9; }
  50%      { box-shadow: 0 0 28px currentColor, 0 0 56px currentColor, 0 0 84px currentColor; opacity:1; }
}
.ds-deploy-wrap.visible { display: block; }
.btn-deploy {
  background: transparent; font-family: 'Orbitron', monospace;
  font-size: 15px; letter-spacing: 6px; padding: 20px 80px;
  cursor: pointer; text-transform: uppercase; transition: letter-spacing 0.3s;
  border-radius: 4px; position: relative; width: 100%; max-width: 500px;
  animation: deployPulse 2s ease-in-out infinite;
}
@keyframes deployPulse {
  0%,100% {
    box-shadow: 0 0 12px currentColor, 0 0 24px currentColor,
                inset 0 0 8px transparent;
    opacity: 1;
  }
  50% {
    box-shadow: 0 0 28px currentColor, 0 0 56px currentColor,
                0 0 80px currentColor, inset 0 0 12px currentColor;
    opacity: 0.88;
  }
}
.btn-deploy:hover {
  letter-spacing: 8px;
  animation: none;
  box-shadow: 0 0 40px currentColor, 0 0 80px currentColor, 0 0 120px currentColor;
}
.btn-deploy:active { transform: scale(0.97); }
.ds-footer {
  flex-shrink: 0; padding: 8px 36px; border-top: 1px solid #1a1428;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to top, #020208cc, transparent);
}
.ds-footer-lore { font-size: 9px; letter-spacing: 3px; color: #9977bb; text-shadow: 0 0 8px #000000aa; }

/* ── ANIMATIONS ── */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Avatar deploy pulse — always visible, pulses to signal clickability */
@keyframes deployPulse {
  0%, 55%  { opacity: 0; }
  70%, 90% { opacity: 0.95; }
  100%     { opacity: 0; }
}
@keyframes avatarBorderPulse {
  0%, 100% { box-shadow: 0 0 8px currentColor; }
  50%      { box-shadow: 0 0 28px currentColor, 0 0 50px currentColor; }
}

/* ══════════════════════════════════════
   MOBILE / TABLET RESPONSIVE
══════════════════════════════════════ */

/* Touch & iOS baseline */
html { -webkit-text-size-adjust: 100%; }
button, [onclick] { touch-action: manipulation; }

/* ── TABLET (768px – 1024px) ── */
@media (max-width: 1024px) {
  /* Race tiles */
  .race-tile { width: 190px; height: 253px; }
  /* Conveyor arrows */
  .conveyor-arrow { width: 40px; height: 64px; font-size: 18px; }
  /* Lore grid: 3 → 2 columns */
  #loreContent > div:last-of-type { grid-template-columns: 1fr 1fr !important; }
  /* Opponent grid: 4 → 3 columns */
  #opponentGrid { grid-template-columns: repeat(3, 140px) !important; }
  /* Avatar */
  #loreAvatar { width: 150px !important; height: 150px !important; }
  #deployBtn  { width: 150px !important; }
}

/* ── MOBILE (≤ 767px) ── */
@media (max-width: 767px) {

  /* Body: allow scrolling on mobile so lore panel is reachable */
  body { overflow-y: auto; height: auto; }

  /* ── SPLASH ── */
  .splash-title { font-size: clamp(32px, 8vw, 64px); letter-spacing: 6px; }
  .splash-tagline { font-size: 10px; letter-spacing: 3px; }
  .splash-tagline2 { font-size: 9px; letter-spacing: 2px; margin-bottom: 36px; }
  .btn-enter {
    font-size: 10px; letter-spacing: 4px;
    padding: 14px 32px;
    width: calc(100% - 40px); max-width: 320px;
  }
  .btn-enter:hover { letter-spacing: 4px; } /* no letter-spacing growth on touch */

  /* ── DECK SELECT SCREEN ── */
  #deckselect { overflow-y: auto; height: auto; min-height: 100vh; }

  /* ── HEADER ── */
  .ds-header { padding: 10px 14px 8px; }
  .ds-header > div:first-child > div:first-child {
    font-size: 14px !important; letter-spacing: 3px !important;
  }
  .ds-title { font-size: 11px !important; letter-spacing: 3px; }
  .ds-logo  { font-size: 8px; letter-spacing: 2px; }
  .btn-back { font-size: 8px; letter-spacing: 2px; padding: 5px 10px; }

  /* ── CONVEYOR ── */
  .conveyor-wrap { padding: 30px 0 14px; }
  .conveyor-arrow { width: 32px; height: 50px; font-size: 16px; }
  .race-tile { width: 150px; height: 200px; border-radius: 12px; }
  .race-tile:hover { transform: translateY(-16px) scale(1.08); }
  .race-tile.selected { transform: translateY(-10px) scale(1.05); }
  .rt-name { font-size: 13px; }
  .rt-sub  { font-size: 10px; }

  /* ── LORE PANEL ── */
  .ds-lore-panel { padding: 12px 14px 14px; flex-direction: column; }

  /* ROW 1: stack avatar → name → (no tier cards) */
  .ds-lore-content > div:first-child {
    flex-direction: column !important;
    align-items: center !important;
    gap: 12px !important;
    margin-bottom: 8px !important;
  }

  /* Avatar: shrink */
  #loreAvatar {
    width: 130px !important; height: 130px !important;
  }
  #deployBtn {
    width: 130px !important;
    font-size: 11px !important; letter-spacing: 3px !important;
    padding: 10px 0 !important;
  }

  /* Center block: name+quote */
  .ds-race-name { font-size: 20px !important; letter-spacing: 2px; }
  .ds-race-sub  { font-size: 11px; letter-spacing: 2px; }
  .ds-race-quote { font-size: 13px; padding-left: 10px; }
  .ability-pill { font-size: 10px; padding: 4px 10px; letter-spacing: 1px; }

  /* Tier card previews: hide on mobile */
  #tierCardPreview { display: none !important; }

  /* Ability showcase cards: 1 column */
  .ability-cards-row {
    flex-direction: column !important;
    gap: 8px !important;
  }
  .ability-showcase { padding: 10px 12px; }
  .absc-title { font-size: 12px; }
  .absc-desc  { font-size: 12px; }

  /* Lore text */
  .lore-text    { font-size: 13px; line-height: 1.7; }
  .lore-weakness { font-size: 12px; }

  /* 3-col lore grid → 1 col on mobile */
  /* Target the inline-grid div inside lore content */
  .ds-lore-content > div:last-of-type {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }

  /* Deploy button: full-width */
  .ds-deploy-wrap { width: 100%; }
  .btn-deploy {
    width: 100% !important; max-width: 100% !important;
    font-size: 13px !important; letter-spacing: 4px !important;
    padding: 16px 0 !important;
  }

  /* Footer: compress */
  .ds-footer { padding: 6px 14px; }
  .ds-footer-lore { font-size: 8px; letter-spacing: 2px; }

  /* ── OPPONENT MODAL ── */
  #opponentModal > div:nth-child(1) { font-size: 16px !important; letter-spacing: 3px !important; }
  #opponentGrid {
    grid-template-columns: repeat(2, 1fr) !important;
    max-width: min(340px, 90vw) !important;
    gap: 8px !important;
    width: 90vw !important;
  }
  #opponentModal {
    padding: 16px !important;
  }

  /* Audio controls: shrink on mobile */
  #muteBtn, #voiceMuteBtn {
    font-size: 9px !important; padding: 4px 8px !important;
    letter-spacing: 1px !important;
  }
}

/* ── VERY SMALL (≤ 400px) ── */
@media (max-width: 400px) {
  .splash-title { font-size: clamp(28px, 9vw, 48px); letter-spacing: 4px; }
  .race-tile { width: 130px; height: 173px; }
  .conveyor-track { gap: 14px; }
  .ds-race-name { font-size: 17px !important; }
  .btn-enter { padding: 12px 20px; font-size: 9px; letter-spacing: 3px; }
}
</style>
</head>
<body>

<!-- AUDIO -->
<audio id="bgMusic" loop preload="auto">
  <source src="assets/void-horizon.mp3" type="audio/mpeg">
</audio>
<audio id="clickSfx" preload="auto">
  <source src="assets/click.mp3" type="audio/mpeg">
</audio>
<audio id="deploySfx" preload="auto">
  <source src="assets/deploy-click.mp3" type="audio/mpeg">
</audio>
<!-- Civilization voice intro — plays on deck selection -->
<audio id="civVoice" preload="none"></audio>

<!-- AUDIO CONTROLS — bottom right, stacked vertically -->
<div style="position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
  <!-- Music mute -->
  <div id="muteBtn" onclick="toggleMute()" style="
    padding:5px 12px;border-radius:4px;
    background:#000000cc;border:1px solid #ffffff22;
    color:#ffffffaa;font-size:10px;letter-spacing:2px;
    cursor:pointer;display:flex;align-items:center;gap:6px;
    font-family:'Courier New',monospace;transition:all 0.2s;
  " title="Toggle music">🎵 <span id="muteLbl">MUSIC</span></div>
  <!-- Voice mute -->
  <div id="voiceMuteBtn" onclick="toggleVoiceMute()" style="
    padding:5px 12px;border-radius:4px;
    background:#000000cc;border:1px solid #ffffff22;
    color:#ffffffaa;font-size:10px;letter-spacing:2px;
    cursor:pointer;display:flex;align-items:center;gap:6px;
    font-family:'Courier New',monospace;transition:all 0.2s;
  " title="Toggle civilization voice">🔊 <span id="voiceMuteLbl">VOICE</span></div>
</div>

<!-- STARFIELD -->
<canvas id="starfield"></canvas>

<!-- GALAXY VIDEO — plays once, freezes on last frame -->
<video id="galaxyVideo" autoplay muted playsinline>
  <source src="assets/galaxy-splash.mp4" type="video/mp4">
</video>

<!-- SPLASH BG (static fallback while video generates) -->
<div class="splash-bg-img" id="splashBg"></div>
<div class="splash-bg-dim" id="splashDim"></div>

<!-- RACE COVER BG -->
<div id="race-bg"></div>
<div id="race-bg-overlay"></div>

<!-- SCREEN 1: SPLASH ─────────────────────────── -->
<div class="screen" id="splash">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="splash-title">GALACTIC ZERO</div>
  <div class="splash-divider"></div>
  <button class="btn-enter" onclick="showDeckSelect()">ENTER THE SECTOR</button>

(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 280}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      alpha: Math.random() * 0.6 + 0.1,
      speed: Math.random() * 0.008 + 0.002,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      const a = s.alpha * (0.5 + 0.5 * Math.sin(t * s.speed * 12 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,185,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize(); draw();
})();

let selectedRace = null;

// ── CONVEYOR — JS-based infinite loop ─────────────────
const TILE_COUNT   = 11;
const AUTO_SPEED   = 1.4;

let cvPos          = 0;
let cvSpeed        = AUTO_SPEED;
let cvHoverPaused  = false;
let cvWheeling     = false;
let cvLastTime     = null;  // for delta-time smooth animation
let cvWheelTimer   = null;
let CV_LOOP_PX     = 0; // measured from DOM after tiles render — avoids padding mismatch

function measureLoopWidth() {
  const track = document.getElementById('conveyorTrack');
  if (!track) return;
  const tiles = track.querySelectorAll('.race-tile');
  if (tiles.length < TILE_COUNT + 1) return;
  // Exact distance from tile[0] left edge to tile[TILE_COUNT] left edge
  const a = tiles[0].getBoundingClientRect().left;
  const b = tiles[TILE_COUNT].getBoundingClientRect().left;
  CV_LOOP_PX = Math.abs(b - a);
}

function runConveyor(timestamp) {
  const track = document.getElementById('conveyorTrack');
  if (!track) { requestAnimationFrame(runConveyor); return; }
  if (!CV_LOOP_PX) measureLoopWidth();

  // Delta-time: move based on elapsed ms, not frames — prevents jumps on tab switch
  if (cvLastTime === null) cvLastTime = timestamp;
  const delta = Math.min(timestamp - cvLastTime, 50); // cap at 50ms to prevent big jumps
  cvLastTime = timestamp;

  if ((!cvHoverPaused || cvWheeling) && CV_LOOP_PX > 0 && !document.hidden) {
    const move = cvSpeed * (delta / 16.67); // normalize to 60fps baseline
    cvPos += move;
    if (cvPos >= CV_LOOP_PX) cvPos -= CV_LOOP_PX;
    if (cvPos < 0)           cvPos += CV_LOOP_PX;
    track.style.transform = `translateX(${-cvPos}px)`;
  }
  requestAnimationFrame(runConveyor);
}

// Reset last frame time when tab becomes visible — prevents position jump
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) cvLastTime = null;
});

// Arrow buttons step speed
const SPEED_STEPS = [0.4, 0.8, 1.4, 2.5, 5.0];
let speedIdx = 2; // default = AUTO_SPEED step

function shiftSpeed(dir) {
  speedIdx = Math.max(0, Math.min(SPEED_STEPS.length - 1, speedIdx + dir));
  cvSpeed = SPEED_STEPS[speedIdx];
}

function initConveyorWheel() {
  const screen = document.getElementById('deckselect');
  if (!screen) return;
  screen.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Wheel scrolls in both directions, overrides hover pause
    cvWheeling = true;
    // Speed proportional to deltaY magnitude for more responsive scroll
    const magnitude = Math.min(Math.abs(e.deltaY) * 0.08, 12.0);
    cvSpeed = e.deltaY > 0 ? magnitude : -magnitude;
    clearTimeout(cvWheelTimer);
    cvWheelTimer = setTimeout(() => {
      cvWheeling = false;
      cvSpeed = AUTO_SPEED; // revert to auto
    }, 600);
  }, { passive: false });

  const wrap = document.getElementById('conveyorWrap');
  if (wrap) {
    wrap.addEventListener('mouseenter', () => { cvHoverPaused = true; });
    wrap.addEventListener('mouseleave', () => { cvHoverPaused = false; });
  }
}

function resetConveyorHalf() {
  // Re-measure loop width once the screen is visible and tiles are laid out
  setTimeout(measureLoopWidth, 150);
}

// ── BUILD CONVEYOR BELT ────────────────────────────
function buildRaceGrid() {
  const track = document.getElementById('conveyorTrack');
  track.innerHTML = '';
  // 3 full sets — provides an extra buffer so seam is never visible
  [0, 1, 2].forEach(() => RACES.forEach(race => track.appendChild(createTile(race))));
  // CV_LOOP_PX = distance across exactly ONE set (measured after layout)
  requestAnimationFrame(() => requestAnimationFrame(measureLoopWidth));
}

function createTile(race) {
  const tile = document.createElement('div');
  tile.className = 'race-tile';
  tile.dataset.id = race.id;
  tile.style.backgroundImage = `url('${race.cover}')`;
  tile.style.borderColor = race.color + '33';
  tile.innerHTML = `
    ${race.starter ? `<div class="rt-starter-badge" style="color:${race.color};border:1px solid ${race.color}66;background:#00000099">STARTER</div>` : ''}
    <div class="rt-text-group">
      <div class="rt-name" style="color:${race.color}">${race.name}</div>
      <div class="rt-sub">${race.sub}</div>
    </div>
  `;
  tile.addEventListener('click', () => selectRace(race, tile));
  tile.addEventListener('mouseenter', () => {
    tile.style.borderColor = race.color + '99';
    tile.style.boxShadow = `0 12px 50px ${race.color}55, 0 0 80px ${race.color}22`;
  });
  tile.addEventListener('mouseleave', () => {
    if (selectedRace?.id !== race.id) {
      tile.style.borderColor = race.color + '33';
      tile.style.boxShadow = '';
    }
  });
  return tile;
}

function selectRace(race, tileEl) {
  // Deselect previous
  document.querySelectorAll('.race-tile.selected').forEach(t => {
    const r = RACES.find(r => r.id === t.dataset.id);
    if (r) {
      t.style.borderColor = r.color + '28';
      t.style.boxShadow = '';
      // DO NOT clear background — it contains the deck cover backgroundImage
    }
    t.classList.remove('selected');
  });

  selectedRace = race;
  // Apply yellow border to ALL copies of this tile in the conveyor (3 sets)
  document.querySelectorAll(`.race-tile[data-id="${race.id}"]`).forEach(t => {
    t.classList.add('selected');
    t.style.borderColor = '#ffdd00';
    t.style.boxShadow = `0 0 24px #ffdd0066, 0 0 48px #ffdd0033, 0 12px 40px ${race.color}44`;
  });

  // Use lore background — clip it to start at the bottom of the conveyor belt
  const bg = document.getElementById('race-bg');
  const ov = document.getElementById('race-bg-overlay');
  const cvSection = document.querySelector('.conveyor-section');
  const clipTop = cvSection ? Math.round(cvSection.getBoundingClientRect().bottom) : 380;
  bg.style.backgroundImage = `url('${race.loreBg || race.cover}')`;
  // Soft gradient fade: race-bg bleeds up into the conveyor for a natural blend
  const fadeStart = clipTop + 40; // image only starts showing BELOW the conveyor
  const maskGrad = `linear-gradient(to bottom, transparent 0px, transparent ${fadeStart}px, black ${clipTop}px, black 100%)`;
  bg.style.webkitMaskImage = maskGrad;
  bg.style.maskImage = maskGrad;
  bg.style.clipPath = ''; // no hard clip
  ov.style.clipPath = '';
  ov.style.webkitMaskImage = maskGrad;
  ov.style.maskImage = maskGrad;
  bg.style.opacity = '0.88';
  ov.style.opacity = '1';

  // Update lore panel
  document.getElementById('dsEmpty').classList.add('hidden');
  const lc = document.getElementById('loreContent');
  // Don't remove visible — update content directly to avoid black flash on re-select
  setTimeout(() => {
    // Avatar portrait
    const avEl = document.getElementById('loreAvatar');
    if (avEl) {
      avEl.style.borderColor = race.color;
      avEl.style.boxShadow  = `0 0 20px ${race.color}44`;
      // Avatar image + deploy overlay (visible on hover)
      avEl.style.animation = ''; // no overlay — deploy button is separate below
      avEl.innerHTML = `<img src="assets/avatars/${race.id}.png"
        style="width:100%;height:100%;object-fit:cover;display:block;"
        onerror="this.style.display='none'">`;
    }
    document.getElementById('loreName').textContent   = race.name;
    document.getElementById('loreName').style.color   = race.color;
    document.getElementById('loreSub').textContent    = race.sub + ' · ' + race.playstyle;
    document.getElementById('loreQuote').textContent  = race.quote;
    document.getElementById('loreQuote').style.borderLeftColor = race.color;
    document.getElementById('loreText1').textContent  = race.lore;
    document.getElementById('loreText2').textContent  = race.history;
    document.getElementById('loreText3').textContent  = race.counter;
    document.getElementById('loreLabel1').style.color = race.color;
    document.getElementById('loreLabel2').style.color = race.color;
    document.getElementById('loreLabel3').style.color = race.color;
    document.getElementById('loreDivider').style.background =
      `linear-gradient(90deg, ${race.color}, transparent)`;

    const ab = document.getElementById('loreAbilities');
    ab.innerHTML = race.abilities.map(a =>
      `<span class="ability-pill" style="color:${race.color};border-color:${race.color}44">${a}</span>`
    ).join('');

    // Ability showcase cards — show first 3 unique abilities with descriptions
    const ac = document.getElementById('abilityCards');
    ac.innerHTML = race.abilities.slice(0, 3).map(a => `
      <div class="ability-showcase" style="color:${race.color};border-color:${race.color}44;background:${race.color}08">
        <div class="absc-title">${a}</div>
        <div class="absc-desc">${ABILITY_DESC[a] || '—'}</div>
      </div>
    `).join('');

    // Tier card previews — show one card per tier for this race
    // Tier card art — Terran + Brood have real art; others use deck cover as placeholder
    const TIER_CARD_ART = {
      terran: [
        { tier:'I',   art:'assets/cards/terran/colony-world-a.png', name:'COLONY WORLD'    },
        { tier:'II',  art:'assets/cards/terran/battle-group.png',   name:'BATTLE GROUP'    },
        { tier:'III', art:'assets/cards/terran/interceptor.png',     name:'INTERCEPTOR'     },
        { tier:'IV',  art:'assets/cards/terran/the-accord.png',      name:'THE ACCORD'      },
      ],
      brood: [
        { tier:'I',   art:'assets/cards/brood/hive-node.png',       name:'HIVE NODE'       },
        { tier:'II',  art:'assets/cards/brood/warrior-cluster.png', name:'WARRIOR CLUSTER' },
        { tier:'III', art:'assets/cards/brood/skimmer.png',         name:'SKIMMER'         },
        { tier:'IV',  art:'assets/cards/brood/the-sovereign.png',   name:'THE SOVEREIGN'   },
      ],
    };
    // For races without art, generate placeholder tiles from deck cover
    const samples = TIER_CARD_ART[race.id] ||
      ['I','II','III','IV'].map(t => ({ tier:t, art:race.cover, name:`TIER ${t}`, placeholder:true }));

    const tcp = document.getElementById('tierCardPreview');
    if (tcp) {
      const TC = {'I':'#d0d0d0','II':'#44cc66','III':'#4488ff','IV':'#aa44ff'};
      tcp.innerHTML = samples.map(s => `
        <div style="
          width:120px;height:160px;border-radius:6px;
          background:url('${s.art}') center/cover;
          border:2px solid ${TC[s.tier]};
          position:relative;overflow:hidden;flex-shrink:0;
          box-shadow:0 0 10px ${TC[s.tier]}44;
          ${s.placeholder ? 'filter:brightness(0.4) saturate(0.5);' : ''}
        ">
          <div style="position:absolute;bottom:0;left:0;right:0;background:#000000dd;padding:5px 6px;">
            <div style="font-size:8px;letter-spacing:1px;color:${TC[s.tier]};">${s.name}</div>
            ${s.placeholder ? `<div style="font-size:7px;color:#555;letter-spacing:1px;">ART PENDING</div>` : ''}
          </div>
          <div style="position:absolute;top:5px;left:5px;background:${TC[s.tier]}22;border:1px solid ${TC[s.tier]}66;border-radius:3px;padding:2px 5px;font-size:9px;color:${TC[s.tier]};font-weight:bold;">${s.tier}</div>
        </div>
      `).join('');
      tcp.style.display = 'flex';
    }

    const btn = document.getElementById('deployBtn');
    btn.style.cssText = `
      font-family:'Orbitron',monospace;font-size:12px;letter-spacing:4px;
      padding:12px 0;cursor:pointer;text-transform:uppercase;border-radius:4px;
      width:180px;
      border:2px solid ${race.color};color:${race.color};background:${race.color}11;
      animation:launchGlow 2s ease-in-out infinite;
    `;
    document.getElementById('deployWrap').style.display = 'block';
    lc.classList.add('visible');

    // Play civilization voice intro
    playCivVoice(race.id);
  }, 60);
}

let voiceMuted = localStorage.getItem("gz_voice_muted") === "true";

function playCivVoice(raceId) {
  const v = document.getElementById('civVoice');
  if (!v || voiceMuted) return;
  v.pause();
  v.src = `assets/voices/${raceId}.mp3`;
  v.volume = 0.85;
  v.play().catch(() => {});
}
function stopCivVoice() {
  const v = document.getElementById('civVoice');
  if (v) { v.pause(); v.currentTime = 0; }
}
function toggleVoiceMute() {
  voiceMuted = !voiceMuted;
  localStorage.setItem("gz_voice_muted", voiceMuted);
  const btn = document.getElementById('voiceMuteBtn');
  const lbl = document.getElementById('voiceMuteLbl');
  if (voiceMuted) {
    stopCivVoice();
    if (btn) btn.style.opacity = '0.4';
    if (lbl) lbl.textContent = 'VOICE OFF';
  } else {
    if (btn) btn.style.opacity = '1';
    if (lbl) lbl.textContent = 'VOICE';
    // Replay for currently selected race
    if (selectedRace) playCivVoice(selectedRace.id);
  }
}

// ── GALAXY VIDEO — play once, freeze on last frame ───────────────────
const gv = document.getElementById('galaxyVideo');
gv.addEventListener('loadeddata', () => {
  gv.style.display = 'block';
  document.getElementById('splashBg').style.opacity = '0';
});
gv.addEventListener('ended', () => {
  // Freeze: seek back a tiny bit so the last frame is visible
  gv.currentTime = gv.duration - 0.05;
  gv.pause();
});
gv.addEventListener('error', () => { /* fallback to static image */ });

// ── MUSIC ──────────────────────────────────────────
let musicStarted = false;
let muted = localStorage.getItem("gz_music_muted") === "true";

function startMusic() {
  if (musicStarted) return;
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.35;
  audio.play().then(() => { musicStarted = true; }).catch(() => {});
}

function toggleMute() {
  const audio = document.getElementById('bgMusic');
  muted = !muted;
  audio.muted = muted;
  localStorage.setItem("gz_music_muted", muted);
  document.getElementById('muteBtn').innerHTML =
    (muted ? '🔇' : '🔊') + ' <span id="muteLbl">' + (muted ? 'MUTED' : 'MUSIC') + '</span>';
  document.getElementById('muteBtn').style.opacity = muted ? '0.5' : '1';
  if (!musicStarted && !muted) startMusic();
}

// Click sound — plays on every button and card click
function playClick() {
  const sfx = document.getElementById('clickSfx');
  if (!sfx) return;
  sfx.currentTime = 0;
  sfx.volume = 0.6;
  sfx.play().catch(() => {});
}

// Start music on first ANY interaction with the page
document.addEventListener('click', () => startMusic(), { once: true });

// Wire click sound to buttons and race tiles (using event delegation)
document.addEventListener('click', e => {
  const t = e.target;
  if (
    t.closest('button') ||
    t.closest('.race-tile') ||
    t.closest('.conveyor-arrow') ||
    t.closest('#muteBtn')
  ) playClick();
});

// ── SCREEN TRANSITIONS ─────────────────────────────
function showDeckSelect() {
  startMusic(); // First user interaction — safe to play
  const splash = document.getElementById('splash');
  const splashBg = document.getElementById('splashBg');
  const splashDim = document.getElementById('splashDim');
  splash.classList.add('hidden');
  splashBg.style.transition = 'opacity 0.7s';
  splashBg.style.opacity = '0';
  splashDim.style.opacity = '0';
  // Compute conveyor half-width now that it's visible
  setTimeout(resetConveyorHalf, 100);
  setTimeout(() => {
    document.getElementById('deckselect').classList.remove('hidden');
    // Auto-select Terran AFTER deck select is visible (avoids lore bg on splash)
    const terranRace = RACES.find(r => r.id === 'terran');
    const terranTile = document.querySelector('.race-tile[data-id="terran"]');
    if (terranRace && terranTile) selectRace(terranRace, terranTile);
  }, 160);
}

function showSplash() {
  stopCivVoice(); // Stop voice when going back to splash
  document.getElementById('deckselect').classList.add('hidden');
  // Reset race bg
  const bg = document.getElementById('race-bg');
  const ov = document.getElementById('race-bg-overlay');
  bg.style.opacity  = '0';
  ov.style.opacity  = '0';
  bg.style.clipPath = ''; bg.style.maskImage = ''; bg.style.webkitMaskImage = '';
  ov.style.clipPath = ''; ov.style.maskImage = ''; ov.style.webkitMaskImage = '';
  const splashBg = document.getElementById('splashBg');
  const splashDim = document.getElementById('splashDim');
  splashBg.style.opacity = '0.55';
  splashDim.style.opacity = '1';
  setTimeout(() => {
    document.getElementById('splash').classList.remove('hidden');
  }, 150);
}

// ── OPPONENT PICKER ────────────────────────────────────────────────
function showOpponentPicker() {
  if (!selectedRace) return;
  const modal = document.getElementById('opponentModal');
  const grid  = document.getElementById('opponentGrid');
  if (!modal || !grid) { launchGame('random'); return; }

  // Build opponent tiles — all races except the selected one
  grid.innerHTML = RACES.filter(r => r.id !== selectedRace.id).map(r => `
    <div onclick="launchGame('${r.id}')" style="
      height:80px;border-radius:6px;cursor:pointer;overflow:hidden;
      background:url('${r.cover}') center/cover;
      border:2px solid ${r.color}44;position:relative;
      transition:transform 0.2s,border-color 0.2s;
    " onmouseenter="this.style.transform='scale(1.05)';this.style.borderColor='${r.color}'"
       onmouseleave="this.style.transform='';this.style.borderColor='${r.color}44'">
      <div style="position:absolute;bottom:0;left:0;right:0;background:#000000cc;padding:5px 6px;">
        <div style="font-size:8px;letter-spacing:1px;color:${r.color};line-height:1.2;">${r.name.replace('THE ','')}</div>
      </div>
    </div>
  `).join('');

  modal.style.display = 'flex';
}

function launchGame(opponentId) {
  document.getElementById('opponentModal').style.display = 'none';
  stopCivVoice();
  // Pick opponent
  const allRaceIds = RACES.map(r => r.id).filter(id => id !== selectedRace.id);
  const aiId = opponentId === 'random'
    ? allRaceIds[Math.floor(Math.random() * allRaceIds.length)]
    : opponentId;
  sessionStorage.setItem('gz_ai_race', aiId);
  const dep = document.getElementById('deploySfx');
  if (dep) { dep.currentTime = 0; dep.volume = 0.8; dep.play().catch(()=>{}); }
  const params = new URLSearchParams({ race: selectedRace.id, color: selectedRace.color, name: selectedRace.name });
  setTimeout(() => { window.location.href = `game.html?${params.toString()}`; }, 400);
}

function startGame() {
  showOpponentPicker();
}

// (startGame now routes through showOpponentPicker -> launchGame)

// Disable right-click on both splash and deck select screens
document.addEventListener('contextmenu', e => e.preventDefault());

// ── INIT ──────────────────────────────────────────
// If returning from game with ?screen=deck, skip splash and show deck select directly
if (new URLSearchParams(window.location.search).get('screen') === 'deck') {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('splashBg').style.opacity = '0';
  document.getElementById('splashDim').style.opacity = '0';
  document.getElementById('deckselect').classList.remove('hidden');
  // Auto-select Terran when arriving from game
  setTimeout(() => {
    const terranRace = RACES.find(r => r.id === 'terran');
    const terranTile = document.querySelector('.race-tile[data-id="terran"]');
    if (terranRace && terranTile) selectRace(terranRace, terranTile);
  }, 200);
}

initConveyorWheel();

// Preload ALL cover images first, then build tiles and start conveyor
// This guarantees zero blank tiles — every image is cached before tiles render
Promise.all(
  RACES.map(r => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = res;
    img.src = r.cover;
  }))
).then(() => {
  buildRaceGrid();
  requestAnimationFrame(runConveyor); // must use rAF to pass timestamp, else NaN delta
  // Auto-select Terran fires in showDeckSelect, not here (prevents lore bg on splash)
});
</script>
</body>
</html>
