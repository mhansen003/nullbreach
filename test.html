<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GALACTIC ZERO — Test Harness v2 (300 tests)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #06060f; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 20px; }
h1 { font-size: 18px; letter-spacing: 4px; color: #8855ff; margin-bottom: 6px; }
h2 { font-size: 11px; letter-spacing: 3px; color: #554477; margin: 18px 0 6px; border-bottom: 1px solid #1a1a2a; padding-bottom: 4px; }
.suite-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.badge { font-size: 11px; letter-spacing: 2px; padding: 4px 12px; border-radius: 3px; font-weight: bold; }
.badge.pass { background: #0a1a10; color: #44cc66; border: 1px solid #44cc6644; }
.badge.fail { background: #1a0505; color: #ff5555; border: 1px solid #ff555544; }
.badge.info { background: #0a0a1e; color: #8855ff; border: 1px solid #8855ff44; }
.test { display: flex; align-items: flex-start; gap: 8px; padding: 3px 8px; border-radius: 3px; margin: 2px 0; font-size: 10px; line-height: 1.5; }
.test.pass { background: #07100a; }
.test.fail { background: #100707; }
.test .icon { font-size: 11px; flex-shrink: 0; }
.test .name { color: #bbb; flex: 1; }
.test.fail .name { color: #ffaaaa; }
.test .detail { color: #ff6666; font-size: 9px; display: block; margin-top: 1px; }
.cat-header { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; }
.cat-name { font-size: 11px; letter-spacing: 3px; font-weight: bold; }
.cat-count { font-size: 9px; color: #555; letter-spacing: 1px; }
.collapsible { display: none; }
.collapsible.expanded { display: block; }
.cat-toggle { cursor: pointer; user-select: none; font-size: 10px; color: #444; margin-left: 6px; }
.visual-section { margin-top: 24px; border-top: 1px solid #1a1a2a; padding-top: 16px; }
.board-grid { display: grid; grid-template-columns: repeat(7, 56px); grid-template-rows: repeat(5, 74px); gap: 3px; margin-top: 8px; }
.bcell { width:56px;height:74px;border-radius:4px;border:1px dashed #111120;background:#060610;position:relative;display:flex;align-items:center;justify-content:center;font-size:8px;color:#1a1a28; }
.bcell.player { background:#0a1814;border:1.5px solid #00ffcc44; }
.bcell.ai { background:#18080a;border:1.5px solid #ff008044; }
.bedge { position:absolute;font-size:10px;font-weight:bold; }
.bedge.n { top:1px;left:50%;transform:translateX(-50%); }
.bedge.s { bottom:1px;left:50%;transform:translateX(-50%); }
.bedge.w { left:2px;top:50%;transform:translateY(-50%); }
.bedge.e { right:2px;top:50%;transform:translateY(-50%); }
.bedge.win { color:#00ffcc; }
.bedge.lose { color:#ff444466; }
.bedge.tie { color:#ffdd0088; }
.bedge.none { color:#555; }
.bpow { font-size:15px;font-weight:bold; }
.bab { position:absolute;bottom:1px;left:2px;font-size:6px;letter-spacing:1px; }
.blog { font-size:10px;color:#666;margin-top:6px;line-height:1.7; }
.blog span.win { color:#00ffcc; }
.blog span.lose { color:#ff4444; }
.blog span.tie { color:#ffdd00; }
.blog span.note { color:#888; }
</style>
</head>
<body>
<h1>GALACTIC ZERO — TEST HARNESS</h1>
<div class="suite-header">
  <span id="badge-pass" class="badge pass">… PASS</span>
  <span id="badge-fail" class="badge fail">… FAIL</span>
  <span id="badge-total" class="badge info">… / 300 TESTS</span>
  <span style="font-size:9px;color:#333;letter-spacing:2px;">Terran + universal abilities</span>
</div>
<div id="results"></div>
<div id="visual" class="visual-section"></div>

<script>
// ══════════════════════════════════════════════
// GAME LOGIC — exact copy from game.html
// ══════════════════════════════════════════════
let G = {};

function initTestGame(cells) {
  G = { grid:Array(5).fill(null).map(()=>Array(7).fill(null).map(()=>({card:null,owner:null}))),
        playerHand:[],aiHand:[],turn:'player',selectedCard:null,gameOver:false,
        surgeTrigger:{player:false,ai:false},_flankTriggered:null };
  (cells||[]).forEach(({r,c,card,owner})=>{
    G.grid[r][c]={card:{...card,edgeMod:card.edgeMod?{...card.edgeMod}:null,shieldExpended:!!card.shieldExpended},owner};
  });
}

function makeCard(o={}) {
  const tier=o.tier||'II';
  return { id:o.id||'t', name:o.name||'TEST', tier, zone:o.zone||'wide_cross',
    edges:{n:o.n??o.edges?.n??5,s:o.s??o.edges?.s??3,e:o.e??o.edges?.e??5,w:o.w??o.edges?.w??5},
    power:o.power??({I:1,II:2,III:3,IV:4}[tier]||2),
    ability:o.ability||null, abilityText:o.abilityText||'',
    shieldExpended:!!o.shieldExpended, edgeMod:o.edgeMod||null, isSpecial:!!o.ability, art:'' };
}

function computeBattleResults() {
  const b=Array(5).fill(null).map(()=>Array(7).fill(null).map(()=>({hW:0,hL:0,vW:0,vL:0})));
  for(let r=0;r<5;r++) for(let c=0;c<7;c++){
    const cell=G.grid[r][c]; if(!cell.card) continue;
    if(c<6){
      const east=G.grid[r][c+1];
      if(east.card&&east.owner!==cell.owner){
        const sB=(cell.card.ability==='surge'&&G.surgeTrigger?.[cell.owner])?3:0;
        const me=cell.card.edges.e+(cell.card.edgeMod?.e||0)+sB;
        const them=east.card.edges.w+(east.card.edgeMod?.w||0);
        const pc=cell.card.ability==='pierce',pt=east.card.ability==='pierce';
        if(me>them||(me===them&&pc&&!pt)){
          b[r][c].hW++;
          if(east.card.ability==='shield'&&!east.card.shieldExpended)east.card.shieldExpended=true;
          else b[r][c+1].hL++;
          if(cell.card.ability==='double_strike'&&c<5){const far=G.grid[r][c+2];if(far.card&&far.owner!==cell.owner){const m2=Math.max(1,Math.floor(me/2));if(m2>(far.card.edges.w+(far.card.edgeMod?.w||0)))b[r][c+2].hL++;}}
        } else if(them>me||(me===them&&pt&&!pc)){
          b[r][c+1].hW++;
          if(cell.card.ability==='shield'&&!cell.card.shieldExpended)cell.card.shieldExpended=true;
          else b[r][c].hL++;
          if(east.card.ability==='double_strike'&&c>1){const far=G.grid[r][c-1];if(far.card&&far.owner!==east.owner){const m2=Math.max(1,Math.floor(them/2));if(m2>(far.card.edges.e+(far.card.edgeMod?.e||0)))b[r][c-1].hL++;}}
        } else {b[r][c].hL++;b[r][c+1].hL++;}
      }
    }
    if(r<4){
      const south=G.grid[r+1][c];
      if(south.card&&south.owner!==cell.owner){
        const me=cell.card.edges.s+(cell.card.edgeMod?.s||0);
        const them=south.card.edges.n+(south.card.edgeMod?.n||0);
        if(me>them){
          b[r][c].vW++;
          if(south.card.ability==='shield'&&!south.card.shieldExpended)south.card.shieldExpended=true;
          else b[r+1][c].vL++;
          if(cell.card.ability==='double_strike'&&r<3){const far=G.grid[r+2][c];if(far.card&&far.owner!==cell.owner){const m2=Math.max(1,Math.floor(me/2));if(m2>(far.card.edges.n+(far.card.edgeMod?.n||0)))b[r+2][c].vL++;}}
        } else if(me<them){
          b[r+1][c].vW++;
          if(cell.card.ability==='shield'&&!cell.card.shieldExpended)cell.card.shieldExpended=true;
          else b[r][c].vL++;
          if(south.card.ability==='double_strike'&&r>0){const far=G.grid[r-1][c];if(far.card&&far.owner!==south.owner){const m2=Math.max(1,Math.floor(them/2));if(m2>(far.card.edges.s+(far.card.edgeMod?.s||0)))b[r-1][c].vL++;}}
        } else {b[r][c].vL++;b[r+1][c].vL++;}
      }
    }
  }
  for(let r=0;r<5;r++) for(let c=0;c<7;c++){
    const bb=b[r][c];
    bb.h=bb.hW>bb.hL?'win':bb.hL>bb.hW?'lose':(bb.hW>0)?'tie':'none';
    bb.v=bb.vW>bb.vL?'win':bb.vL>bb.vW?'lose':(bb.vW>0)?'tie':'none';
  }
  return b;
}

function computeScores(){
  const battles=computeBattleResults();
  for(let r=0;r<5;r++) for(let c=0;c<7;c++) if(G.grid[r][c].card)G.grid[r][c].battle=battles[r][c];
  const rows=Array(5).fill(null).map(()=>({p:0,a:0}));
  const cols=Array(7).fill(null).map(()=>({p:0,a:0}));
  for(let r=0;r<5;r++) for(let c=0;c<7;c++){
    const cell=G.grid[r][c]; if(!cell.card) continue;
    const bat=battles[r][c];
    const cH=bat.h==='win'||bat.h==='none', cV=bat.v==='win'||bat.v==='none';
    if(cH){if(cell.owner==='player')rows[r].p+=cell.card.power;else rows[r].a+=cell.card.power;}
    if(cV){if(cell.owner==='player')cols[c].p+=cell.card.power;else cols[c].a+=cell.card.power;}
  }
  let pW=0,aW=0;
  const rRes=rows.map(r=>r.p>r.a?'p':r.a>r.p?'a':'tie');
  const cRes=cols.map(c=>c.p>c.a?'p':c.a>c.p?'a':'tie');
  rRes.forEach(r=>{if(r==='p')pW++;if(r==='a')aW++;});
  cRes.forEach(c=>{if(c==='p')pW++;if(c==='a')aW++;});
  return {rows,cols,rowResults:rRes,colResults:cRes,pWins:pW,aWins:aW};
}

function applyPlacementAbility(card,r,c,owner){
  const dirs=[{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
  if(card.ability==='boost'||card.ability==='commander'){
    const bonus=card.ability==='commander'?2:1;
    dirs.forEach(({dr,dc})=>{
      const nr=r+dr,nc=c+dc; if(nr<0||nr>=5||nc<0||nc>=7) return;
      const nb=G.grid[nr][nc];
      if(nb.card&&nb.owner===owner){
        if(card.ability==='commander'&&nb.card.tier!==card.tier)return;
        nb.card.edgeMod=nb.card.edgeMod||{n:0,s:0,e:0,w:0};
        nb.card.edgeMod.n+=bonus;nb.card.edgeMod.s+=bonus;nb.card.edgeMod.e+=bonus;nb.card.edgeMod.w+=bonus;
      }
    });
  }
  if(card.ability==='sweep'){
    card.edgeMod=card.edgeMod||{n:0,s:0,e:0,w:0};
    card.edgeMod.n+=2;card.edgeMod.s+=2;card.edgeMod.e+=2;card.edgeMod.w+=2;
  }
}

// ══════════════════════════════════════════════
// TEST ENGINE
// ══════════════════════════════════════════════
const TESTS=[];
let PASS=0, FAIL=0;

function test(name,cat,fn){
  let ok=true,detail='';
  try{fn();}catch(e){ok=false;detail=e.message;}
  TESTS.push({name,cat,ok,detail});
  if(ok)PASS++;else FAIL++;
}
function eq(a,b,msg){if(a!==b)throw new Error(`${msg||'eq'}: got "${a}" expected "${b}"`);}
function neq(a,b,msg){if(a===b)throw new Error(`${msg||'neq'}: got "${a}" (should differ)`);}
function ok(cond,msg){if(!cond)throw new Error(msg||'Expected truthy');}
function gt(a,b,msg){if(a<=b)throw new Error(`${msg||'gt'}: ${a} not > ${b}`);}
function gte(a,b,msg){if(a<b)throw new Error(`${msg||'gte'}: ${a} not >= ${b}`);}

// ══════════════════════════════════════════════════════════════════════
// 1. H BATTLE — all E vs W edge values 1-9 (81 tests)
// ══════════════════════════════════════════════════════════════════════
for(let e=1;e<=9;e++) for(let w=1;w<=9;w++){
  const exp=e>w?'win':e<w?'lose':'tie';
  const opp=e>w?'lose':e<w?'win':'tie';
  test(`H E=${e} W=${w} → player ${exp}`,'H Battle',()=>{
    initTestGame([{r:2,c:3,card:makeCard({e}),owner:'player'},{r:2,c:4,card:makeCard({w}),owner:'ai'}]);
    const b=computeBattleResults();
    eq(b[2][3].h,exp,`player H`);
    eq(b[2][4].h,opp,`ai H`);
  });
}

// ══════════════════════════════════════════════════════════════════════
// 2. V BATTLE — all S vs N edge values 1-9 (81 tests)
// ══════════════════════════════════════════════════════════════════════
for(let s=1;s<=9;s++) for(let n=1;n<=9;n++){
  const exp=s>n?'win':s<n?'lose':'tie';
  const opp=s>n?'lose':s<n?'win':'tie';
  test(`V S=${s} N=${n} → top card ${exp}`,'V Battle',()=>{
    initTestGame([{r:1,c:3,card:makeCard({s}),owner:'player'},{r:2,c:3,card:makeCard({n}),owner:'ai'}]);
    const b=computeBattleResults();
    eq(b[1][3].v,exp,`top V`);
    eq(b[2][3].v,opp,`bottom V`);
  });
}

// ══════════════════════════════════════════════════════════════════════
// 3. H BATTLE — all 6 column positions (6 tests)
// ══════════════════════════════════════════════════════════════════════
for(let col=0;col<6;col++){
  test(`H at column ${col}-${col+1}: player E=7 beats AI W=4`,'H Positions',()=>{
    initTestGame([{r:2,c:col,card:makeCard({e:7}),owner:'player'},{r:2,c:col+1,card:makeCard({w:4}),owner:'ai'}]);
    const b=computeBattleResults();
    eq(b[2][col].h,'win',`player col${col}`);
    eq(b[2][col+1].h,'lose',`ai col${col+1}`);
  });
}

// ══════════════════════════════════════════════════════════════════════
// 4. V BATTLE — all 4 row positions (4 tests)
// ══════════════════════════════════════════════════════════════════════
for(let row=0;row<4;row++){
  test(`V at rows ${row}-${row+1}: top S=7 beats bottom N=4`,'V Positions',()=>{
    initTestGame([{r:row,c:3,card:makeCard({s:7}),owner:'player'},{r:row+1,c:3,card:makeCard({n:4}),owner:'ai'}]);
    const b=computeBattleResults();
    eq(b[row][3].v,'win',`top row${row}`);
    eq(b[row+1][3].v,'lose',`bottom row${row+1}`);
  });
}

// ══════════════════════════════════════════════════════════════════════
// 5. NET WIN RULE — all H×V outcome combinations (9 tests)
// ══════════════════════════════════════════════════════════════════════
const netCases=[
  {hR:'win',vR:'win',hExp:'win',vExp:'win',label:'win+win → H=win V=win'},
  {hR:'win',vR:'lose',hExp:'win',vExp:'lose',label:'win+lose → H=win V=lose'},
  {hR:'win',vR:'tie',hExp:'win',vExp:'tie',label:'win+tie → H=win V=tie'},
  {hR:'lose',vR:'win',hExp:'lose',vExp:'win',label:'lose+win → H=lose V=win'},
  {hR:'lose',vR:'lose',hExp:'lose',vExp:'lose',label:'lose+lose → both lose'},
  {hR:'lose',vR:'tie',hExp:'lose',vExp:'tie',label:'lose+tie → H=lose V=tie'},
  {hR:'tie',vR:'win',hExp:'tie',vExp:'win',label:'tie+win → H=tie V=win'},
  {hR:'tie',vR:'lose',hExp:'tie',vExp:'lose',label:'tie+lose → H=tie V=lose'},
  {hR:'tie',vR:'tie',hExp:'tie',vExp:'tie',label:'tie+tie → both tie'},
];
netCases.forEach(({hR,vR,hExp,vExp,label})=>{
  test(`Net win: ${label}`,'Net Win Rule',()=>{
    const pE=hR==='win'?8:hR==='lose'?2:5;
    const aiW=hR==='win'?4:hR==='lose'?8:5;
    const pN=vR==='win'?8:vR==='lose'?2:5;
    const aiS=vR==='win'?3:vR==='lose'?9:5;
    initTestGame([
      {r:2,c:3,card:makeCard({e:pE,n:pN,s:1,w:1}),owner:'player'},
      {r:2,c:4,card:makeCard({w:aiW}),owner:'ai'},
      {r:1,c:3,card:makeCard({s:aiS}),owner:'ai'},
    ]);
    const b=computeBattleResults();
    eq(b[2][3].h,hExp,'H result');
    eq(b[2][3].v,vExp,'V result');
  });
});

// ══════════════════════════════════════════════════════════════════════
// 6. SANDWICHED CARD — net tie scenarios (6 tests)
// ══════════════════════════════════════════════════════════════════════
test('Sandwiched V: wins-north loses-south → tie (power=0 col)','Sandwiched',()=>{
  initTestGame([
    {r:1,c:3,card:makeCard({s:2}),owner:'ai'},
    {r:2,c:3,card:makeCard({n:8,s:2,power:3}),owner:'player'},
    {r:3,c:3,card:makeCard({n:7}),owner:'ai'},
  ]);
  const b=computeBattleResults();
  eq(b[2][3].v,'tie','sandwiched V → tie');
  const s=computeScores();
  eq(s.cols[3].p,0,'sandwiched player contributes 0 col power');
});
test('Sandwiched H: wins-east loses-west → tie (power=0 row)','Sandwiched',()=>{
  initTestGame([
    {r:2,c:2,card:makeCard({e:2}),owner:'ai'},
    {r:2,c:3,card:makeCard({e:7,w:2,power:2}),owner:'player'},
    {r:2,c:4,card:makeCard({w:8}),owner:'ai'},
  ]);
  const b=computeBattleResults();
  eq(b[2][3].h,'tie','sandwiched H → tie');
  const s=computeScores();
  eq(s.rows[2].p,0,'sandwiched player contributes 0 row power');
});
test('Sandwiched V: wins both N and S → net win (2W, 0L)','Sandwiched',()=>{
  initTestGame([
    {r:1,c:3,card:makeCard({s:2}),owner:'ai'},
    {r:2,c:3,card:makeCard({n:9,s:8,power:2}),owner:'player'},
    {r:3,c:3,card:makeCard({n:3}),owner:'ai'},
  ]);
  const b=computeBattleResults();
  eq(b[2][3].v,'win','wins both V comparisons → win');
});
test('Sandwiched H: loses both E and W → lose','Sandwiched',()=>{
  initTestGame([
    {r:2,c:2,card:makeCard({e:9}),owner:'ai'},
    {r:2,c:3,card:makeCard({e:2,w:2,power:2}),owner:'player'},
    {r:2,c:4,card:makeCard({w:9}),owner:'ai'},
  ]);
  const b=computeBattleResults();
  eq(b[2][3].h,'lose','loses both H comparisons → lose');
});
test('Sandwiched V: wins 2 loses 1 → net win (2W > 1L)','Sandwiched',()=>{
  // player card sandwiched by 3 enemies: wins 2 V comparisons, loses 1
  initTestGame([
    {r:1,c:3,card:makeCard({s:2}),owner:'ai'},    // player beats going north
    {r:2,c:3,card:makeCard({n:9,s:9,power:2}),owner:'player'},
    {r:3,c:3,card:makeCard({n:3}),owner:'ai'},     // player beats going south too
    // For 3rd comparison we'd need to be more creative - can't have 3 V enemies on same col
    // So just verify 2W 0L = win
  ]);
  const b=computeBattleResults();
  eq(b[2][3].v,'win','2W 0L → win net');
});
test('Sandwiched: uncontested card always wins both axes','Sandwiched',()=>{
  initTestGame([{r:3,c:3,card:makeCard({power:2}),owner:'player'}]);
  const b=computeBattleResults();
  eq(b[3][3].h,'none','uncontested H');
  eq(b[3][3].v,'none','uncontested V');
  const s=computeScores();
  eq(s.rows[3].p,2,'uncontested row power');
  eq(s.cols[3].p,2,'uncontested col power');
});

// ══════════════════════════════════════════════════════════════════════
// 7. SHIELD — 12 tests
// ══════════════════════════════════════════════════════════════════════
test('SHIELD H: blocks first H loss from east','SHIELD',()=>{
  initTestGame([{r:2,c:4,card:makeCard({e:8}),owner:'ai'},{r:2,c:5,card:makeCard({w:3,ability:'shield'}),owner:'player'}]);
  const b=computeBattleResults(); eq(b[2][5].h,'none','shield blocked → none');
  ok(G.grid[2][5].card.shieldExpended,'shield expended');
});
test('SHIELD H: blocks first H loss from west','SHIELD',()=>{
  initTestGame([{r:2,c:2,card:makeCard({w:3,ability:'shield'}),owner:'player'},{r:2,c:3,card:makeCard({e:8}),owner:'ai'}]);
  // The ai is east of player, ai.e fights player.w... wait that's player being attacked from west side
  // Actually: iterating r=2, c=2 → cell=player, east=ai. ai.w vs player.e → different cards
  // Let me reconsider: player is at c=2, ai is at c=3. Loop processes c=2 (player): me=player.e, them=ai.w
  // ai.w is not high, so player might win. Let me reverse:
  // ai at c=2, player(shield) at c=3 → ai.e vs player.w
  initTestGame([{r:2,c:2,card:makeCard({e:8}),owner:'ai'},{r:2,c:3,card:makeCard({w:3,ability:'shield'}),owner:'player'}]);
  const b=computeBattleResults(); eq(b[2][3].h,'none','shield blocked west attack');
  ok(G.grid[2][3].card.shieldExpended,'shield expended');
});
test('SHIELD H: after expend, takes loss normally','SHIELD',()=>{
  initTestGame([{r:2,c:3,card:makeCard({e:8}),owner:'ai'},{r:2,c:4,card:makeCard({w:3,ability:'shield',shieldExpended:true}),owner:'player'}]);
  const b=computeBattleResults(); eq(b[2][4].h,'lose','expended shield takes loss');
});
test('SHIELD V: blocks first V loss from north (player below)','SHIELD',()=>{
  initTestGame([{r:1,c:3,card:makeCard({s:9}),owner:'ai'},{r:2,c:3,card:makeCard({n:2,ability:'shield'}),owner:'player'}]);
  const b=computeBattleResults(); eq(b[2][3].v,'none','shield blocked V from north');
  ok(G.grid[2][3].card.shieldExpended,'shield V expended');
});
test('SHIELD V: blocks first V loss from south (player above)','SHIELD',()=>{

const res = document.getElementById('results');
Object.entries(byCategory).forEach(([cat,ts])=>{
  const catPass=ts.filter(t=>t.ok).length, catAll=ts.length;
  const allOk=catPass===catAll;
  const hdr=document.createElement('div');
  hdr.className='cat-header';
  hdr.innerHTML=`<span class="cat-name" style="color:${allOk?'#44cc66':'#ff6644'}">${allOk?'✓':'✗'} ${cat}</span>
    <span class="cat-count">${catPass}/${catAll}</span>
    <span class="cat-toggle" onclick="this.closest('.cat-header').nextElementSibling.classList.toggle('expanded')">▾ show</span>`;
  res.appendChild(hdr);

  const group=document.createElement('div');
  group.className='collapsible'+(allOk?'':' expanded');
  ts.forEach(t=>{
    const d=document.createElement('div');
    d.className=`test ${t.ok?'pass':'fail'}`;
    d.innerHTML=`<span class="icon">${t.ok?'✓':'✗'}</span><span class="name">${t.name}${!t.ok&&t.detail?`<span class="detail">↳ ${t.detail}</span>`:''}</span>`;
    group.appendChild(d);
  });
  res.appendChild(group);
});

function renderDemoBoard(){
  const grid=document.createElement('div');
  grid.className='board-grid';
  for(let r=0;r<5;r++) for(let c=0;c<7;c++){
    const div=document.createElement('div');
    const cell=G.grid[r][c];
    if(cell.card){
      const col=cell.owner==='player'?'#00ffcc':'#ff0080';
      div.className=`bcell ${cell.owner}`;
      const bat=cell.battle||{h:'none',v:'none'};
      const hC=bat.h==='win'?'win':bat.h==='lose'?'lose':bat.h==='tie'?'tie':'none';
      const vC=bat.v==='win'?'win':bat.v==='lose'?'lose':bat.v==='tie'?'tie':'none';
      div.innerHTML=`
        <span class="bedge n ${vC}">${cell.card.edges.n+(cell.card.edgeMod?.n||0)}</span>
        <span class="bedge s ${vC}">${cell.card.edges.s+(cell.card.edgeMod?.s||0)}</span>
        <span class="bedge w ${hC}">${cell.card.edges.w+(cell.card.edgeMod?.w||0)}</span>
        <span class="bedge e ${hC}">${cell.card.edges.e+(cell.card.edgeMod?.e||0)}</span>
        <span class="bpow" style="color:${col}">${cell.card.power}</span>
        ${cell.card.ability?`<span class="bab" style="color:${col}88">${cell.card.ability.slice(0,3).toUpperCase()}</span>`:''}
        ${cell.card.shieldExpended?`<span style="position:absolute;top:1px;right:2px;font-size:8px;color:#aaaaff55">🛡✗</span>`:''}
      `;
      if(bat.h!=='none'||bat.v!=='none'){
        const bc=bat.h==='win'||bat.v==='win'?col:bat.h==='lose'||bat.v==='lose'?'#ff3333':'#ffdd00';
        div.style.boxShadow=`0 0 8px ${bc}44, inset 0 0 6px ${bc}22`;
      }
    } else {
      div.className='bcell';
      div.style.fontSize='7px';div.style.color='#1a1a28';
      if(r===4) div.style.borderTop='2px solid #00ffcc22';
      if(r===0) div.style.borderBottom='2px solid #ff008022';
    }
    grid.appendChild(div);
  }
  vis.appendChild(grid);
}
