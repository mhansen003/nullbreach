<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  body {
    width: 600px;
    height: 900px;
    overflow: hidden;
    background: #000008;
    font-family: 'Orbitron', monospace;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 8%, #ffffff77 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 22%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 58% 6%, #ffffffaa 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 18%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 22% 45%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 38%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 52%, #ffffff66 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 8% 65%, #ffffff88 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 72%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 80%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 88%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 94%, #ffffff66 0%, transparent 100%),
      radial-gradient(1px 1px at 18% 30%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 70%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 55%, #ffffff44 0%, transparent 100%);
  }

  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 20%, #2a006888 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 60%, #001a4466 0%, transparent 55%),
      radial-gradient(ellipse 70% 40% at 80% 70%, #1a004488 0%, transparent 55%),
      radial-gradient(ellipse 50% 30% at 50% 90%, #00051844 0%, transparent 50%);
  }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(100,60,200,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,60,200,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 70%);
  }

  /* Full-height faction strip */
  .faction-strip {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  .faction-row {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .faction-row img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .faction-row:nth-child(1) img { filter: brightness(0.28) saturate(1.4) hue-rotate(-10deg); }
  .faction-row:nth-child(2) img { filter: brightness(0.22) saturate(1.3) hue-rotate(20deg); }
  .faction-row:nth-child(3) img { filter: brightness(0.25) saturate(1.5) hue-rotate(180deg); }
  .faction-row:nth-child(4) img { filter: brightness(0.20) saturate(1.2) hue-rotate(-20deg); }
  .faction-row:nth-child(5) img { filter: brightness(0.24) saturate(1.4) hue-rotate(60deg); }

  .faction-row:nth-child(1) { clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%); }
  .faction-row:nth-child(2) { clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); margin-top: -14px; }
  .faction-row:nth-child(3) { clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); margin-top: -14px; }
  .faction-row:nth-child(4) { clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); margin-top: -14px; }
  .faction-row:nth-child(5) { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); margin-top: -14px; }

  /* Dark gradient overlays */
  .faction-strip::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, #000008 0%, transparent 18%, transparent 55%, #000008cc 85%, #000008 100%);
    z-index: 2;
  }
  .faction-strip::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, #00000866 0%, transparent 25%, transparent 75%, #00000866 100%);
    z-index: 2;
  }

  /* Center glow */
  .center-glow {
    position: absolute;
    top: 160px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 400px;
    background: radial-gradient(ellipse, #6610cc22 0%, transparent 70%);
    z-index: 3;
  }

  /* Title block — centered */
  .title-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 120px;
  }

  .subtitle-label {
    font-size: 11px;
    letter-spacing: 8px;
    color: #8866ff99;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .title-line1 {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #ffffff;
    text-shadow:
      0 0 24px #8844ff,
      0 0 48px #8844ff88,
      0 0 96px #8844ff44,
      0 2px 6px #000000cc;
    line-height: 1;
    margin-bottom: 4px;
  }

  .title-line2 {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: 18px;
    color: #ffffff;
    text-shadow:
      0 0 24px #4488ff,
      0 0 48px #4488ff88,
      0 0 96px #4488ff44,
      0 2px 6px #000000cc;
    line-height: 1;
  }

  .title-accent {
    width: 320px; height: 1px;
    background: linear-gradient(to right, transparent, #8866ff, #4499ff, #8866ff, transparent);
    margin-top: 24px; margin-bottom: 20px;
  }

  .tagline {
    font-size: 12px;
    letter-spacing: 5px;
    color: #bbbbddbb;
    text-transform: uppercase;
  }

  /* Bottom badge */
  .bottom-badge {
    position: absolute;
    bottom: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .badge-pip {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, #8866ff88);
  }
  .badge-pip.right { background: linear-gradient(to left, transparent, #8866ff88); }

  .badge-text {
    font-size: 10px;
    letter-spacing: 4px;
    color: #9977ffcc;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Horizontal dividers between factions */
  .dividers {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
  }

  /* Corner brackets */
  .corner { position: absolute; width: 28px; height: 28px; z-index: 15; }
  .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }
  .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="grid-bg"></div>

  <div class="faction-strip">
    <div class="faction-row"><img src="file:///C:/GitHub/nullbreach/assets/lore_void.png"></div>
    <div class="faction-row"><img src="file:///C:/GitHub/nullbreach/assets/lore_brood.png"></div>
    <div class="faction-row"><img src="file:///C:/GitHub/nullbreach/assets/lore_entropy.png"></div>
    <div class="faction-row"><img src="file:///C:/GitHub/nullbreach/assets/lore_crystallis.png"></div>
    <div class="faction-row"><img src="file:///C:/GitHub/nullbreach/assets/lore_veil.png"></div>
  </div>

  <div class="center-glow"></div>

  <div class="title-area">
    <div class="subtitle-label">Strategic Card Battle</div>
    <div class="title-line1">GALACTIC</div>
    <div class="title-line2">ZERO</div>
    <div class="title-accent"></div>
    <div class="tagline">11 Civilizations · One Galaxy</div>
  </div>

  <div class="bottom-badge">
    <div class="badge-pip"></div>
    <div class="badge-text">Free to Play · Multiplayer · Leaderboards</div>
    <div class="badge-pip right"></div>
  </div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="scanlines"></div>
</body>
</html>
