<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  body {
    width: 1920px;
    height: 620px;
    overflow: hidden;
    background: #000008;
    font-family: 'Orbitron', monospace;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 5% 15%, #ffffff66 0%, transparent 100%),
      radial-gradient(1px 1px at 12% 70%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20% 35%, #ffffffaa 0%, transparent 100%),
      radial-gradient(1px 1px at 28% 85%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 38% 20%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 48% 60%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 10%, #ffffff88 0%, transparent 100%),
      radial-gradient(1px 1px at 62% 75%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 40%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 90%, #ffffff66 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 25%, #ffffff88 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 55%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 97% 80%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 33% 50%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 72% 15%, #ffffff55 0%, transparent 100%);
  }

  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 120% at 15% 50%, #1a003866 0%, transparent 55%),
      radial-gradient(ellipse 60% 100% at 50% 50%, #2200558a 0%, transparent 50%),
      radial-gradient(ellipse 50% 120% at 85% 50%, #001a3866 0%, transparent 55%),
      radial-gradient(ellipse 30% 80% at 50% 100%, #00051844 0%, transparent 50%);
  }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(100,60,200,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,60,200,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, black 10%, transparent 65%);
  }

  /* Full-width faction art strip */
  .faction-strip {
    position: absolute;
    inset: 0;
    display: flex;
  }

  .faction-slot {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .faction-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .faction-slot:nth-child(1) img { filter: brightness(0.28) saturate(1.4) hue-rotate(-10deg); }
  .faction-slot:nth-child(2) img { filter: brightness(0.22) saturate(1.3) hue-rotate(20deg); }
  .faction-slot:nth-child(3) img { filter: brightness(0.30) saturate(1.6) hue-rotate(180deg); }
  .faction-slot:nth-child(4) img { filter: brightness(0.24) saturate(1.2) hue-rotate(-30deg); }
  .faction-slot:nth-child(5) img { filter: brightness(0.26) saturate(1.5) hue-rotate(60deg); }
  .faction-slot:nth-child(6) img { filter: brightness(0.22) saturate(1.3) hue-rotate(120deg); }
  .faction-slot:nth-child(7) img { filter: brightness(0.28) saturate(1.4) hue-rotate(-60deg); }

  /* Angled slices */
  .faction-slot:nth-child(1) { clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%); }
  .faction-slot:nth-child(2) { clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); margin-left: -20px; }
  .faction-slot:nth-child(3) { clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); margin-left: -20px; flex: 1.3; }
  .faction-slot:nth-child(4) { clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); margin-left: -20px; }
  .faction-slot:nth-child(5) { clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); margin-left: -20px; flex: 1.3; }
  .faction-slot:nth-child(6) { clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); margin-left: -20px; }
  .faction-slot:nth-child(7) { clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); margin-left: -20px; }

  .faction-strip::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, #000008 0%, transparent 25%, transparent 60%, #000008aa 85%, #000008 100%);
    z-index: 2;
  }
  .faction-strip::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, #000008 0%, transparent 8%, transparent 92%, #000008 100%);
    z-index: 2;
  }

  /* Center glow */
  .center-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 500px;
    background: radial-gradient(ellipse, #55009933 0%, transparent 65%);
    z-index: 3;
  }

  /* Title — centered */
  .title-area {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .subtitle-label {
    font-size: 14px;
    letter-spacing: 10px;
    color: #8866ff99;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .title-line1 {
    font-size: 130px;
    font-weight: 900;
    letter-spacing: 20px;
    color: #ffffff;
    text-shadow:
      0 0 30px #8844ff,
      0 0 60px #8844ff88,
      0 0 120px #8844ff44,
      0 3px 8px #000000cc;
    line-height: 1;
    margin-bottom: 4px;
  }

  .title-line2 {
    font-size: 130px;
    font-weight: 900;
    letter-spacing: 28px;
    color: #ffffff;
    text-shadow:
      0 0 30px #4488ff,
      0 0 60px #4488ff88,
      0 0 120px #4488ff44,
      0 3px 8px #000000cc;
    line-height: 1;
  }

  .title-accent {
    width: 600px; height: 1px;
    background: linear-gradient(to right, transparent, #8866ff, #4499ff, #8866ff, transparent);
    margin-top: 28px; margin-bottom: 22px;
  }

  .tagline {
    font-size: 16px;
    letter-spacing: 7px;
    color: #bbbbddbb;
    text-transform: uppercase;
  }

  .corner { position: absolute; width: 32px; height: 32px; z-index: 15; }
  .corner-tl { top: 20px; left: 20px; border-top: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-tr { top: 20px; right: 20px; border-top: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
    );
    z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="grid-bg"></div>

  <div class="faction-strip">
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_void.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_brood.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_entropy.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_crystallis.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_veil.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_quantum.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_lithos.png"></div>
  </div>

  <div class="center-glow"></div>

  <div class="title-area">
    <div class="subtitle-label">Strategic Card Battle</div>
    <div class="title-line1">GALACTIC</div>
    <div class="title-line2">ZERO</div>
    <div class="title-accent"></div>
    <div class="tagline">11 Civilizations · One Galaxy</div>
  </div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="scanlines"></div>
</body>
</html>
