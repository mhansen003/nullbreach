<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  body {
    width: 460px;
    height: 215px;
    overflow: hidden;
    background: #000008;
    font-family: 'Orbitron', monospace;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8% 20%, #ffffff66 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 55%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 10%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 75%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 30%, #ffffff66 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 60%, #ffffffaa 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 80%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 25%, #ffffff55 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 15%, #ffffff77 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 85%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 45%, #ffffff33 0%, transparent 100%);
  }

  .nebula {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 80% at 15% 50%, #1a003888 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 30%, #001a3066 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 50% 100%, #00082044 0%, transparent 50%);
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(100,60,200,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,60,200,0.07) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 20%, transparent 75%);
  }

  /* Right-side faction art collage */
  .faction-art {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 220px;
    display: flex;
  }

  .faction-slot {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .faction-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .faction-slot:nth-child(1) {
    clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
  }
  .faction-slot:nth-child(1) img { filter: brightness(0.55) saturate(1.3) hue-rotate(-10deg); }

  .faction-slot:nth-child(2) {
    clip-path: polygon(15% 0, 88% 0, 100% 100%, 0 100%);
    margin-left: -14px;
    flex: 1.2;
  }
  .faction-slot:nth-child(2) img { filter: brightness(0.65) saturate(1.5) hue-rotate(20deg); }

  .faction-slot:nth-child(3) {
    clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    margin-left: -12px;
  }
  .faction-slot:nth-child(3) img { filter: brightness(0.5) saturate(1.2) hue-rotate(180deg); }

  .faction-art::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, #000008 0%, transparent 30%);
    z-index: 2;
  }
  .faction-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #00000844 0%, transparent 30%, transparent 70%, #00000844 100%);
    z-index: 2;
  }

  /* Title area — left side */
  .title-area {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 24px;
  }

  .subtitle-label {
    font-size: 8px;
    letter-spacing: 6px;
    color: #8866ff99;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .title-line1 {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffffff;
    text-shadow:
      0 0 16px #8844ff,
      0 0 32px #8844ff88,
      0 2px 4px #000000cc;
    line-height: 1;
    margin-bottom: 2px;
  }

  .title-line2 {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #ffffff;
    text-shadow:
      0 0 16px #4488ff,
      0 0 32px #4488ff88,
      0 2px 4px #000000cc;
    line-height: 1;
  }

  .title-accent {
    width: 180px;
    height: 1px;
    background: linear-gradient(to right, #8866ff, #4499ff, transparent);
    margin-top: 12px;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 8px;
    letter-spacing: 3px;
    color: #bbbbddaa;
    text-transform: uppercase;
  }

  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    z-index: 15;
  }
  .corner-tl { top: 10px; left: 10px; border-top: 1px solid #8866ffaa; border-left: 1px solid #8866ffaa; }
  .corner-tr { top: 10px; right: 10px; border-top: 1px solid #8866ffaa; border-right: 1px solid #8866ffaa; }
  .corner-bl { bottom: 10px; left: 10px; border-bottom: 1px solid #8866ffaa; border-left: 1px solid #8866ffaa; }
  .corner-br { bottom: 10px; right: 10px; border-bottom: 1px solid #8866ffaa; border-right: 1px solid #8866ffaa; }

  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.05) 3px,
      rgba(0,0,0,0.05) 4px
    );
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="grid-bg"></div>

  <div class="faction-art">
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_entropy.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_veil.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_void.png"></div>
  </div>

  <div class="title-area">
    <div class="subtitle-label">Strategic Card Battle</div>
    <div class="title-line1">GALACTIC</div>
    <div class="title-line2">ZERO</div>
    <div class="title-accent"></div>
    <div class="tagline">11 Civilizations · One Galaxy</div>
  </div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="scanlines"></div>
</body>
</html>
