<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  body {
    width: 630px;
    height: 500px;
    overflow: hidden;
    background: #000008;
    font-family: 'Orbitron', monospace;
  }

  /* Star field */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 35%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, #ffffff33 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 45%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 65%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, #ffffff66 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 75%, #ffffff33 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 78% 22%, #ffffffaa 0%, transparent 100%),
      radial-gradient(1px 1px at 62% 88%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 50%, #ffffff33 0%, transparent 100%),
      radial-gradient(2px 2px at 33% 15%, #ffffff77 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 50%, #ffffff44 0%, transparent 100%);
  }

  /* Nebula background */
  .nebula {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 50%, #1a0040 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 30%, #001a30 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 80%, #000820 0%, transparent 50%);
  }

  /* Grid overlay */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(100,60,200,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,60,200,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
  }

  /* Faction panels - angled layout */
  .faction-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 280px;
    display: flex;
    gap: 0;
  }

  .faction-slot {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .faction-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    filter: brightness(0.55) saturate(1.3);
  }

  /* Left faction */
  .faction-slot:nth-child(1) {
    clip-path: polygon(0 0, 88% 0, 100% 100%, 0 100%);
  }
  .faction-slot:nth-child(1) img { filter: brightness(0.5) saturate(1.4) hue-rotate(-10deg); }

  /* Center-left faction */
  .faction-slot:nth-child(2) {
    clip-path: polygon(12% 0, 90% 0, 100% 100%, 0 100%);
    margin-left: -18px;
  }
  .faction-slot:nth-child(2) img { filter: brightness(0.52) saturate(1.2); }

  /* Center faction — brightest, featured */
  .faction-slot:nth-child(3) {
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
    margin-left: -16px;
    flex: 1.4;
  }
  .faction-slot:nth-child(3) img { filter: brightness(0.62) saturate(1.5) hue-rotate(20deg); }

  /* Center-right faction */
  .faction-slot:nth-child(4) {
    clip-path: polygon(10% 0, 88% 0, 100% 100%, 0 100%);
    margin-left: -16px;
  }
  .faction-slot:nth-child(4) img { filter: brightness(0.5) saturate(1.3) hue-rotate(-20deg); }

  /* Right faction */
  .faction-slot:nth-child(5) {
    clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    margin-left: -18px;
  }
  .faction-slot:nth-child(5) img { filter: brightness(0.45) saturate(1.2) hue-rotate(180deg); }

  /* Gradient overlays on faction strip */
  .faction-strip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #000008 0%, transparent 40%, transparent 60%, #000008cc 100%);
    z-index: 2;
    pointer-events: none;
  }
  .faction-strip::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, #000008 0%, transparent 10%, transparent 90%, #000008 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* Divider lines between faction slots */
  .faction-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, #7744ff55, #7744ffaa, #7744ff55, transparent);
    z-index: 3;
  }

  /* Center glow behind title */
  .center-glow {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 560px;
    height: 300px;
    background: radial-gradient(ellipse, #5510aa28 0%, transparent 70%);
    z-index: 3;
  }

  /* Title area */
  .title-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 42px;
  }

  .subtitle-label {
    font-size: 10px;
    letter-spacing: 8px;
    color: #8866ff99;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .title-line1 {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow:
      0 0 20px #8844ff,
      0 0 40px #8844ff88,
      0 0 80px #8844ff44,
      0 2px 4px #000000cc;
    line-height: 1;
    margin-bottom: 4px;
  }

  .title-line2 {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow:
      0 0 20px #4488ff,
      0 0 40px #4488ff88,
      0 0 80px #4488ff44,
      0 2px 4px #000000cc;
    line-height: 1;
  }

  /* Title underline accent */
  .title-accent {
    width: 340px;
    height: 1px;
    background: linear-gradient(to right, transparent, #8866ff, #4499ff, #8866ff, transparent);
    margin-top: 16px;
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 5px;
    color: #bbbbddbb;
    text-transform: uppercase;
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    z-index: 15;
  }
  .corner-tl { top: 14px; left: 14px; border-top: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-tr { top: 14px; right: 14px; border-top: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }
  .corner-bl { bottom: 14px; left: 14px; border-bottom: 1.5px solid #8866ffaa; border-left: 1.5px solid #8866ffaa; }
  .corner-br { bottom: 14px; right: 14px; border-bottom: 1.5px solid #8866ffaa; border-right: 1.5px solid #8866ffaa; }

  /* Faction count badge */
  .faction-badge {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .badge-pip {
    width: 32px;
    height: 1px;
    background: linear-gradient(to right, transparent, #8866ff88);
  }
  .badge-pip.right {
    background: linear-gradient(to left, transparent, #8866ff88);
  }

  .badge-text {
    font-size: 9px;
    letter-spacing: 4px;
    color: #9977ffcc;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Scan-line effect */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.06) 3px,
      rgba(0, 0, 0, 0.06) 4px
    );
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="grid-bg"></div>

  <!-- Faction art strip -->
  <div class="faction-strip">
    <div class="faction-slot">
      <img src="file:///C:/GitHub/nullbreach/assets/lore_brood.png">
    </div>
    <div class="faction-slot">
      <img src="file:///C:/GitHub/nullbreach/assets/lore_veil.png">
    </div>
    <div class="faction-slot">
      <img src="file:///C:/GitHub/nullbreach/assets/lore_entropy.png">
    </div>
    <div class="faction-slot">
      <img src="file:///C:/GitHub/nullbreach/assets/lore_crystallis.png">
    </div>
    <div class="faction-slot">
      <img src="file:///C:/GitHub/nullbreach/assets/lore_void.png">
    </div>
  </div>

  <div class="center-glow"></div>

  <!-- Title -->
  <div class="title-area">
    <div class="subtitle-label">Strategic Card Battle</div>
    <div class="title-line1">GALACTIC</div>
    <div class="title-line2">ZERO</div>
    <div class="title-accent"></div>
    <div class="tagline">11 Civilizations &nbsp;·&nbsp; One Galaxy</div>
  </div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Bottom badge -->
  <div class="faction-badge">
    <div class="badge-pip"></div>
    <div class="badge-text">Free to Play &nbsp;·&nbsp; Multiplayer &nbsp;·&nbsp; Leaderboards</div>
    <div class="badge-pip right"></div>
  </div>

  <div class="scanlines"></div>

</body>
</html>
