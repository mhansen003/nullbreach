<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  body {
    width: 1438px;
    height: 810px;
    overflow: hidden;
    background: #000008;
    font-family: 'Orbitron', monospace;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 4% 10%, #ffffff66 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 55%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 18% 25%, #ffffffaa 0%, transparent 100%),
      radial-gradient(1px 1px at 26% 78%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 42%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 44% 8%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 52% 65%, #ffffff77 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 30%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 88%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 76% 50%, #ffffff44 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 84% 15%, #ffffff88 0%, transparent 100%),
      radial-gradient(1px 1px at 91% 72%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 96% 38%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 22% 92%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 5%, #ffffff66 0%, transparent 100%);
  }

  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 80% at 20% 40%, #1a003877 0%, transparent 55%),
      radial-gradient(ellipse 60% 70% at 50% 20%, #2200558a 0%, transparent 50%),
      radial-gradient(ellipse 70% 80% at 80% 50%, #001a4477 0%, transparent 55%),
      radial-gradient(ellipse 40% 50% at 50% 100%, #00051855 0%, transparent 50%);
  }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(100,60,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,60,200,0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 60%, black 10%, transparent 70%);
  }

  /* Bottom faction strip */
  .faction-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 420px;
    display: flex;
  }

  .faction-slot {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .faction-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .faction-slot:nth-child(1) { clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%); }
  .faction-slot:nth-child(2) { clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); margin-left: -16px; }
  .faction-slot:nth-child(3) { clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); margin-left: -16px; flex: 1.2; }
  .faction-slot:nth-child(4) { clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); margin-left: -16px; }
  .faction-slot:nth-child(5) { clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); margin-left: -16px; flex: 1.2; }
  .faction-slot:nth-child(6) { clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%); margin-left: -16px; }

  .faction-slot:nth-child(1) img { filter: brightness(0.30) saturate(1.4) hue-rotate(-10deg); }
  .faction-slot:nth-child(2) img { filter: brightness(0.25) saturate(1.3) hue-rotate(20deg); }
  .faction-slot:nth-child(3) img { filter: brightness(0.28) saturate(1.5) hue-rotate(180deg); }
  .faction-slot:nth-child(4) img { filter: brightness(0.22) saturate(1.2) hue-rotate(-30deg); }
  .faction-slot:nth-child(5) img { filter: brightness(0.26) saturate(1.4) hue-rotate(60deg); }
  .faction-slot:nth-child(6) img { filter: brightness(0.24) saturate(1.3) hue-rotate(120deg); }

  .faction-strip::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, #000008 0%, transparent 35%);
    z-index: 2;
  }
  .faction-strip::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, #000008 0%, transparent 6%, transparent 94%, #000008 100%);
    z-index: 2;
  }

  /* Title watermark top-center */
  .title-watermark {
    position: absolute;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.6;
  }

  .title-line1 {
    font-size: 100px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #ffffff;
    text-shadow: 0 0 40px #8844ff88, 0 0 80px #8844ff44;
    line-height: 1;
    margin-bottom: 2px;
  }

  .title-line2 {
    font-size: 100px;
    font-weight: 900;
    letter-spacing: 22px;
    color: #ffffff;
    text-shadow: 0 0 40px #4488ff88, 0 0 80px #4488ff44;
    line-height: 1;
  }

  .title-accent {
    width: 500px; height: 1px;
    background: linear-gradient(to right, transparent, #8866ff66, #4499ff66, #8866ff66, transparent);
    margin-top: 18px;
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
    );
    z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="grid-bg"></div>

  <div class="faction-strip">
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_void.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_entropy.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_brood.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_veil.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_crystallis.png"></div>
    <div class="faction-slot"><img src="file:///C:/GitHub/nullbreach/assets/lore_quantum.png"></div>
  </div>

  <div class="title-watermark">
    <div class="title-line1">GALACTIC</div>
    <div class="title-line2">ZERO</div>
    <div class="title-accent"></div>
  </div>

  <div class="scanlines"></div>
</body>
</html>
